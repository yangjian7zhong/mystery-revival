    ],
  };

  /* ------------------------------------------------------------ 取句逻辑 */
  const u32 = (x) => x >>> 0;
  function hashStr(s) {
    let h = 0x811c9dc5;
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193); }
    return u32(h);
  }

  // 近期用过的句子：按种子分桶，只记录「本轮更早回合」用过的句子。
  // 这样同一 (种子, 回合) 无论调用几次都取到同一句（确定性不被破坏），
  // 同时又能避免相邻回合重复读到同一句。纯文本记忆，重载即清空。
  const WINDOW = 12;              // 约 12 个回合内不重复
  const memory = new Map();       // seed → Map(line → 最后一次使用的回合)

  function memFor(seed) {
    let m = memory.get(seed);
    if (!m) { m = new Map(); memory.set(seed, m); }
    if (m.size > 600) { Array.from(m.keys()).slice(0, 200).forEach((k) => m.delete(k)); }
    return m;
  }
  function usedRecently(m, line, turn) {
    const prev = m.get(line);
    return prev !== undefined && prev < turn && (turn - prev) < WINDOW;
  }

  /** 轮转取句：同库内按 seed 定偏移 + turn 递增；若命中近期用过的句子就往后跳 */
  function pick(bank, state, salt) {
    const arr = B[bank];
    if (!arr || !arr.length) return '';
    const off = hashStr(String(state.seed || '') + ':' + bank);
    const base = (off + (state.turn || 0) + (salt || 0)) % arr.length;
    const m = memFor(String(state.seed || ''));
    const turn = state.turn || 0;
    let line = arr[base];
    for (let k = 1; k <= 3 && usedRecently(m, line, turn); k++) {
      line = arr[(base + k) % arr.length];
    }
    m.set(line, turn);
    return line;
  }

  /** 多句不重复取（同一回合内要两句时用） */
  function pickN(bank, state, n, salt) {
    const arr = B[bank];
    const out = [];
    if (!arr || !arr.length) return out;
    for (let k = 0; k < n && k < arr.length; k++) {
      const off = hashStr(String(state.seed || '') + ':' + bank + ':' + k);
      out.push(arr[(off + (state.turn || 0) + (salt || 0)) % arr.length]);
    }
    return out;
  }

  /* --------------------------------------------------------- 场景组装 */
  /**
   * 一回合的场景描写：时段天气 + 场所 + 感官/异象 + 状态反应（0~3 句）+ 分级句
   * 返回 { lines, tags } —— tags 说明这段用了哪些库（供测试统计覆盖率）
   */
  function scene(state) {
    const s = state;
    const lines = [];
    const tags = [];
    lines.push(pick('timeOfDay', s) + '，' + pick('weather', s) + '。'); tags.push('timeOfDay', 'weather');
    lines.push(pick('place', s)); tags.push('place');
    // 第 13 轮：加厚——环境细节 + 时期感 + 地点专属细节（带库就取，没有就跳过）
    if (B.dayDetail) { const dd = pickN('dayDetail', s, 2, 4); dd.forEach((x) => lines.push(x)); tags.push('dayDetail'); }
    const eraBank = 'era_' + (s.era || '');
    if (B[eraBank]) { lines.push(pick(eraBank, s)); tags.push(eraBank); }
    const placeBank = 'place_' + (s.place || '');
    if (B[placeBank]) { lines.push(pick(placeBank, s, 1)); tags.push(placeBank); }

    // 感官与异象：交替出现，保证不会每回合都只有一种味道
    if (s.turn % 2 === 1) { lines.push(pick('sense', s)); tags.push('sense'); }
    else { lines.push(pick('anomaly', s)); tags.push('anomaly'); }

    // 状态反应（按紧急度排序，最多取 2 条，避免刷屏）
    const reactive = [];
    if (s.stats.sanity < 40) reactive.push(['lowSanity', pick('lowSanity', s)]);
    if (s.stats.humanity < 30) reactive.push(['lowHumanity', pick('lowHumanity', s)]);
    if (s.stats.erosion >= 60) reactive.push(['highErosion', pick('highErosion', s)]);
    if (s.stats.pollution >= 45) reactive.push(['highPollution', pick('highPollution', s)]);
    if (s.stats.calamity >= 70) reactive.push(['highCalamity', pick('highCalamity', s)]);
    if (s.stats.stamina < 35) reactive.push(['lowStamina', pick('lowStamina', s)]);
    if (s.stats.stealth < 25) reactive.push(['lowStealth', pick('lowStealth', s)]);
    else if (s.stats.stealth >= 75) reactive.push(['highStealth', pick('highStealth', s)]);
    if (s.clues.length >= 6) reactive.push(['intel', pick('intel', s)]);
    if (s.contracts.length >= 1 && s.turn % 3 === 0) reactive.push(['contract', pick('contract', s)]);
    const chosen = reactive.slice(0, 2);
    for (const [tag, line] of chosen) { lines.push(line); tags.push(tag); }

    // 一切正常时给一句"平静"的话，避免正文太干
    if (!chosen.length && !s.pending) { lines.push(pick('safe', s)); tags.push('safe'); }

    // 内容分级：只影响文字强度
    const lv = s.contentLevel || 'A';
    if (lv === 'B') { lines.push(pick('levelB', s)); tags.push('levelB'); }
    else if (lv === 'C') { lines.push(pick('levelC', s)); tags.push('levelC'); }

    return { lines: lines, tags: tags };
  }

  /** 行动结果变体句（引擎给出 variant key，这里取对应库） */
  function actionLine(state, variant) {
    const bank = 'act_' + (variant || 'custom');
    if (!B[bank]) {
      // 本地专属行动（act_<行动>）等没有专属库时：先试该城的专属库，再退通用句，而不是整段消失
      const cityBank = state && state.city ? 'act_city_' + state.city : null;
      if (cityBank && B[cityBank]) return pick(cityBank, state);
      if (B.act_city) return pick('act_city', state);
      return B.act_normal ? pick('act_normal', state) : '';
    }
    return pick(bank, state);
  }

  /** 遭遇氛围句：随"掌握线索条数"变化，让同一只鬼的遭遇读起来不一样 */
  function encounterMood(state) {    const p = state.pending;
    if (!p) return '';
    const known = (p.revealedClues || []).length;
    if (known === 0) return '你对它一无所知。所有判断都只能靠眼前这一点东西。';
    if (known === 1) return '你掌握的线索让它的轮廓清楚了一点——只有一点。';
    if (known === 2) return '你知道它的规矩了，至少知道两条。';
    return '它的规律在你脑子里几乎连成了一条线。';
  }

  /** 世界事件开场白 */
  function eventLine(state) {
    const ev = (state.__evLabel) || '';
    return ev ? '接下来的一切都会围着「' + ev + '」转。' : '';
  }

  /** 供测试统计：素材库规模与条目 */
  function stats() {
    const out = {};
    for (const k of Object.keys(B)) out[k] = B[k].length;
    return out;
  }

  /** 第 15 轮：行动过程（"你是怎么做的"，接在行动结果之前） */
  function actionProcess(state, actionId) {
    const id = String(actionId || '').replace(/^city_/, 'city').replace(/^probe_/, 'probe');
    const bank = 'proc_' + (id === 'city' ? 'investigate' : (id === 'probe' ? 'investigate' : id));
    if (B[bank]) return pickN(bank, state, 2, 3);
    return B.proc_investigate ? pickN('proc_investigate', state, 1, 5) : [];
  }

  /** 第 15 轮：身体状态段（按侵蚀/理智/体力/污染取一句） */
  function bodyState(state) {
    if (!B.bodyState) return '';
    return pick('bodyState', state, 2);
  }

  /** 第 15 轮：遭遇时那只鬼在做什么 */
  function encounterAct(state) {
    return B.encounterAct ? pick('encounterAct', state, 3) : '';
  }

  /** 第 13 轮：遭遇的感官细节（接在遭遇正文之后，让场景"可感知"） */
  function encounterSense(state) {
    return B.encounterSense ? pick('encounterSense', state) : '';
  }

  /** 第 13 轮：行动之后的余波（1~2 句，让"做完了"这件事有下文） */
  function aftermath(state, n) {
    if (!B.aftermath) return [];
    return pickN('aftermath', state, n || 1, 7);
  }

  return {
    banks: B,
    scene: scene,
    actionProcess: actionProcess,
    bodyState: bodyState,
    encounterAct: encounterAct,
    encounterSense: encounterSense,
    aftermath: aftermath,
    actionLine: actionLine,
    encounterMood: encounterMood,
    eventLine: eventLine,
    pick: pick,
    stats: stats,
  };
});
</script>
<script>/* ============================================================================
 * 神秘复苏模拟器 · 本机账户与密钥保管库（vault）
 * ----------------------------------------------------------------------------
 * 目的：把 AI 的 API 配置绑定到本机账户上——没登录看不见、改不了。
 *
 * 做法：密码 → PBKDF2-SHA256（25 万次）派生密钥 → AES-GCM 加密 AI 配置，
 *       只把「盐 + 密文」写进 localStorage；密码本身不落盘。
 *       AES-GCM 自带完整性校验：密文被改动会解密失败（不是静默出错）。
 *
 * 能防住什么：同机其他人翻 localStorage / 手改存档 / 误改配置。
 * 防不住什么：能改页面 JS 的人、知道密码的人、以及"密码本身太弱"被爆破。
 * 没有的东西：找回密码、跨设备同步、服务端身份校验——单文件本地游戏做不到。
 * ==========================================================================*/
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.RSVault = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  const KEY = 'rs_vault';
  const ITER = 250000;
  const CHECK_PLAIN = 'rs-vault-check-v1';
  const MIN_PASS = 6;

  const enc = new TextEncoder();
  const dec = new TextDecoder();

  function b64(buf) {
    const bytes = new Uint8Array(buf);
    let s = '';
    for (let i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
    return (typeof btoa === 'function') ? btoa(s) : Buffer.from(bytes).toString('base64');
  }
  function unb64(str) {
    let s;
    if (typeof atob === 'function') { s = atob(str); }
    else { s = Buffer.from(str, 'base64').toString('binary'); }
    const out = new Uint8Array(s.length);
    for (let i = 0; i < s.length; i++) out[i] = s.charCodeAt(i);
    return out;
  }
  function subtle() {
    const c = (typeof crypto !== 'undefined' && crypto.subtle) ? crypto.subtle
      : (typeof globalThis !== 'undefined' && globalThis.crypto && globalThis.crypto.subtle) ? globalThis.crypto.subtle : null;
    if (!c) throw new Error('当前环境没有 WebCrypto，无法加密保存');
    return c;
  }
  function rand(n) {
    const a = new Uint8Array(n);
    if (typeof crypto !== 'undefined' && crypto.getRandomValues) crypto.getRandomValues(a);
    else globalThis.crypto.getRandomValues(a);
    return a;
  }

  async function deriveKey(pass, salt, iter) {
    const base = await subtle().importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveKey']);
    return subtle().deriveKey(
      { name: 'PBKDF2', salt: salt, iterations: iter || ITER, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  }
  async function encrypt(key, obj) {
    const iv = rand(12);
    const ct = await subtle().encrypt({ name: 'AES-GCM', iv: iv }, key, enc.encode(JSON.stringify(obj)));
    return { iv: b64(iv), ct: b64(ct) };
  }
  async function decrypt(key, box) {
    const iv = unb64(box.iv), ct = unb64(box.ct);
    const plain = await subtle().decrypt({ name: 'AES-GCM', iv: iv }, key, ct);
    return JSON.parse(dec.decode(plain));
  }

  /* --------------------------------------------------------------- 存取 */
  function lsGet() {
    try { return localStorage.getItem(KEY); } catch (e) { return null; }
  }
  function lsSet(v) { try { localStorage.setItem(KEY, v); } catch (e) {} }
  function lsDel() { try { localStorage.removeItem(KEY); } catch (e) {} }

  function read() {
    const raw = lsGet();
    if (!raw) return null;
    try {
      const v = JSON.parse(raw);
      if (!v || v.v !== 1 || !v.salt || !v.check) return null;
      return v;
    } catch (e) { return null; }
  }
  function write(v) { lsSet(JSON.stringify(v)); }

  /* --------------------------------------------------------------- 会话 */
  let sessionKey = null;   // 只在内存里，刷新即失效（这正是"必须登录"的含义）
  let sessionUser = null;

  function hasVault() { return !!read(); }
  function userName() { const v = read(); return v ? v.user : null; }
  function isUnlocked() { return !!sessionKey; }
  function lockedUser() { return sessionUser; }

  /** 首次使用：创建账户并把 AI 配置加密绑定进去 */
  async function register(user, pass, initialAI) {
    user = String(user || '').trim();
    pass = String(pass || '');
    if (user.length < 2) return { error: '账户名至少 2 个字符' };
    if (pass.length < MIN_PASS) return { error: '密码至少 ' + MIN_PASS + ' 位' };
    if (hasVault()) return { error: '本机已存在账户，请直接登录（或先用原密码删除账户）' };
    const salt = rand(16);
    const key = await deriveKey(pass, salt);
    const v = {
      v: 1, user: user, salt: b64(salt), iter: ITER,
      check: await encrypt(key, CHECK_PLAIN),
      ai: initialAI ? await encrypt(key, initialAI) : null,
    };
    write(v);
    sessionKey = key;
    sessionUser = user;
    return { ok: true, user: user, bound: !!v.ai };
  }

  /** 登录：密码不对 → 解密校验块失败 */
  async function unlock(pass) {
    const v = read();
    if (!v) return { error: '本机还没有账户' };
    try {
      const key = await deriveKey(String(pass || ''), unb64(v.salt), v.iter);
      const check = await decrypt(key, v.check);
      if (check !== CHECK_PLAIN) return { error: '密码不正确' };
      sessionKey = key;
      sessionUser = v.user;
      return { ok: true, user: v.user, bound: !!v.ai };
    } catch (e) {
      return { error: '密码不正确' };   // AES-GCM 校验失败也落在这里
    }
  }

  function lock() { sessionKey = null; sessionUser = null; return { ok: true }; }

  /* ----------------------------------------------------------- AI 绑定 */
  async function putAI(ai) {
    const v = read();
    if (!v) return { error: '本机还没有账户，请先创建' };
    if (!sessionKey) return { error: '需要登录后才能修改绑定的 API 配置' };
    v.ai = await encrypt(sessionKey, {
      endpoint: String(ai.endpoint || '').trim(),
      apiKey: String(ai.apiKey || ''),
      model: String(ai.model || 'deepseek-chat').trim(),
    });
    write(v);
    return { ok: true };
  }

  function hasAI() { const v = read(); return !!(v && v.ai); }

  function getAI() {
    if (!sessionKey) return { error: '未登录：查看或修改 API 配置需要先登录账户' };
    const v = read();
    if (!v || !v.ai) return null;      // 已登录但还没绑定
    return decrypt(sessionKey, v.ai).then((ai) => ai).catch(() => ({ error: '密文校验失败（保管库被改动过）' }));
  }

  function clearAI() {
    const v = read();
    if (!v) return { error: '本机还没有账户' };
    if (!sessionKey) return { error: '需要登录后才能解绑' };
    v.ai = null;
    write(v);
    return { ok: true };
  }

  /** 删除账户（需原密码验证） */
  async function destroy(pass) {
    const v = read();
    if (!v) return { error: '本机还没有账户' };
    const r = await unlock(pass);
    if (r.error) return r;
    lsDel();
    sessionKey = null;
    sessionUser = null;
    return { ok: true };
  }

  return {
    KEY: KEY,
    MIN_PASS: MIN_PASS,
    ITER: ITER,
    hasVault: hasVault,
    userName: userName,
    isUnlocked: isUnlocked,
    lockedUser: lockedUser,
    hasAI: hasAI,
    register: register,
    unlock: unlock,
    lock: lock,
    putAI: putAI,
    getAI: getAI,
    clearAI: clearAI,
    destroy: destroy,
    // 仅测试用
    _internals: { deriveKey: deriveKey, encrypt: encrypt, decrypt: decrypt, b64: b64, unb64: unb64 },
  };
});
</script>
<script>/* ============================================================================
 * 神秘复苏模拟器 · 界面层
 * ----------------------------------------------------------------------------
 * 原则：
 *  - 界面只读引擎状态，绝不参与判定；玩家无法在界面上输入任何数值。
 *  - 所有文本经 textContent 注入（不拼 HTML），自定义输入先剥离尖括号。
 *  - 预留 AI 叙事接口 window.RS_AI：AI 只写【剧情叙事】，判定与数值一律以引擎为准，
 *    AI 返回的任何数值声明都会被忽略。
 * ==========================================================================*/
(function () {
  'use strict';

  const E = window.RSEngine;
  const C = window.RSContent;
  const P = window.RSProfile || null;
  let profile = P ? P.loadProfile().profile : null;

  const LS = {
    get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  };

  /* ------------------------------------------------------------ AI 接口 */
  window.RS_AI = window.RS_AI || {
    enabled: false,
    endpoint: '',
    apiKey: '',
    model: '',
    /** 只负责把引擎给的机械结果润色成剧情文字；不得改动任何数值 */
    async narrate(payload) {
      if (!this.enabled || !this.endpoint) return null;
      const sys = '你是恐怖互动小说的叙事者。只输出【剧情叙事】段落，' +
        '禁止输出任何数值、状态、公式、选项；禁止替玩家做决定；禁止修改判定结果。';
      const user = JSON.stringify({
        世界: payload.world, 状态: payload.panel, 玩家行动: payload.action,
        引擎判定: payload.settlement, 要求: '写 120~220 字的中文剧情，压抑、克制、不写爽文。',
      });
      const res = await fetch(this.endpoint, {
        method: 'POST',
        headers: Object.assign({ 'Content-Type': 'application/json' },
          this.apiKey ? { Authorization: 'Bearer ' + this.apiKey } : {}),
        body: JSON.stringify({
          model: this.model || 'deepseek-chat',
          messages: [{ role: 'system', content: sys }, { role: 'user', content: user }],
          temperature: 0.8,
        }),
      });
      if (!res.ok) throw new Error('AI 接口返回 ' + res.status);
      const data = await res.json();
      const txt = data && data.choices && data.choices[0] && data.choices[0].message
        ? data.choices[0].message.content : '';
      return txt ? String(txt).replace(/[【】]/g, '').slice(0, 600) : null;
    },
  };

  /* -------------------------------------------------------------- 状态 */
  let state = null;
  let selected = {
    difficulty: 'standard', pack: 'ordinary', level: 'A', seed: '',
    city: 'random', era: 'random',
    custom: { encounter: 'normal', judge: 'normal', mercy: 'normal' },
    legacy: null,
  };

  const $ = (id) => document.getElementById(id);
  function el(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  }
  function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }

  /* ------------------------------------------------------------ 场景文本 */
  const N = window.RSNarrative || null;

  /** 本时期的"世界时钟"（时期不同，主线厉鬼序列就不同）；老存档无时期 → 退回原著 2018 */
  function eraClock(s) {
    const era = (C.eras && C.eras[s && s.era]) || null;
    return (era && era.events && era.events.length) ? era.events : C.worldClock;
  }
  function cityInfo(s) {
    return (C.cities && C.cities[s && s.city]) || null;
  }
  function eraInfo(s) {
    return (C.eras && C.eras[s && s.era]) || null;
  }

  /** 场景描写：优先用叙事生成器（组合 + 轮转 + 状态反应），没有则退回素材库 */
  function sceneLines(s) {
    if (N) {
      const r = N.scene(s);
      const clock = eraClock(s);
      const ev = clock.filter((e) => e.turn <= s.turn).slice(-1)[0];
      if (ev && s.turn - ev.turn <= 2) r.lines.push('【世界事件】' + ev.label + ' 正在进行。');
      const era = eraInfo(s);
      if (era && s.turn === 1) r.lines.push('【时期】' + era.name + '——' + era.desc);
      const city = cityInfo(s);
      if (city && s.turn === 1) r.lines.push('【落地】' + city.name + '（' + city.src + '）——' + city.desc);
      // 第 15 轮：加一段"身体现在是什么感觉"，让每天的场景更完整
      if (N.bodyState) { const bd = N.bodyState(s); if (bd) r.lines.push(bd); }
      return r.lines;
    }
    const n = C.narrative;
    const out = [];
    out.push(n.timeOfDay[(s.turn * 3 + s.seedInt) % n.timeOfDay.length] + '，' +
      n.weather[(s.turn * 7 + s.seedInt) % n.weather.length] + '。');
    out.push(n.city[(s.turn + s.seedInt) % n.city.length]);
    return out;
  }

  let lastSceneTurn = 0;

  /** 每天开始时输出一次氛围与事件提示（同一天不重复） */
  function renderScene(force) {
    if (!state || state.over) return;
    if (!force && lastSceneTurn === state.turn) return;
    lastSceneTurn = state.turn;
    const lines = sceneLines(state);
    const startEv = eraClock(state).find((e) => e.turn === state.turn);
    if (startEv) {
      addLog('event', '════ 【重大事件】' + startEv.label + ' ════');
      addLog('event', '你正在被卷进去。它不是背景，它是接下来的一切。');
    }
    addLog('scene', lines);
  }

  /* ------------------------------------------------------------ 渲染 */
  function renderPanel() {
    const box = $('panel');
    clear(box);
    const p = E.panelOf(state);
    for (const k of Object.keys(p)) {
      const row = el('div', 'prow');
      row.appendChild(el('span', 'pk', k));
      row.appendChild(el('span', 'pv', String(p[k])));
      box.appendChild(row);
    }
    $('turnLabel').textContent = p['回合'];
    $('diffLabel').textContent = p['难度'];
  }

  /* ------------------------------------------------------ 剧情流（第 12 轮）
   * 手机端问题：「点完选项不知道上面还有故事」。
   * 解法：① 新剧情永远自动滚到可见处；② 本轮新增的行同时渲染到紧贴选项的「刚刚发生」卡片；
   *      ③ 选完先只给一个「继续」按钮，玩家读完结果再进下一步，不再"一跳就到下一个选择"。
   */
  let lastLines = [];        // 本轮新增的行（供「刚刚发生」卡片）
  let nowLineCount = 0;

  function scrollLog() {
    const box = $('logWrap');
    if (!box) return;
    box.scrollTop = box.scrollHeight;
    const j = $('jumpNew');
    if (j) j.style.display = 'none';
  }

  function addLog(kind, lines, opts) {
    const box = $('log');
    for (const line of [].concat(lines)) {
      if (line === undefined || line === null || line === '') continue;
      const d = el('div', 'line ' + kind, String(line));
      box.appendChild(d);
      if (!(opts && opts.noNow)) lastLines.push({ kind: kind, text: String(line) });
    }
    scrollLog();
  }

  /** 把本轮新增的叙事渲染进「刚刚发生」卡片（紧贴选项，手机上也看得见） */
  function renderNow() {
    const box = $('now');
    clear(box);
    const rows = lastLines.filter((x) => x.kind !== 'set');
    if (!rows.length) { box.style.display = 'none'; return; }
    box.style.display = '';
    box.appendChild(el('div', 'nowhead', '刚刚发生 · 第 ' + (state ? state.turn : '?') + ' 天'));
    rows.slice(-8).forEach((r) => {
      const cls = r.kind === 'enc' ? 'line say ghost' : (r.kind === 'over' ? 'line say ghost' : 'line narr');
      box.appendChild(el('div', cls, r.text));
    });
    nowLineCount = rows.length;
  }

  function hideNow() { const b = $('now'); if (b) { clear(b); b.style.display = 'none'; } }

  function renderChoices(choices, mode) {
    const box = $('choices');
    clear(box);
    // 遭遇中不提供自定义入口：此刻必须做出选择，避免用描述性文本绕过判定
    $('footer').style.display = state && state.pending ? 'none' : '';
    if (state && state.over) {
      const b = el('button', 'btn primary', '重开一局');
      b.onclick = () => showMenu();
      box.appendChild(b);
      return;
    }
    // 结算后先只有「继续」：玩家读完结果再进下一步（不再"一跳就到下一个选择"）
    if (mode === 'continue') {
      const b = el('button', 'btn primary big', state && state.pending
        ? '继续｜面对「' + state.pending.name + '」'
        : '继续｜进入第 ' + (state.turn + 1) + ' 天');
      b.onclick = continueNext;
      box.appendChild(b);
      box.appendChild(el('div', 'hint', '上面是刚刚发生的事；点「继续」才推进到下一步。'));
      return;
    }
    if (!choices.length) {
      box.appendChild(el('div', 'muted', '（没有可选行动——请把存档贴回来继续）'));
      return;
    }
    // 标题：明确这里是"要你选一个"，否则一排按钮看起来像不明所以的文字块
    const inEnc = !!(state && state.pending);
    box.appendChild(el('div', 'choicesHead',
      inEnc ? '你必须做出选择 —— 点下面任意一行（生路要线索支撑，陷阱会死人）'
            : '今天可以做的事 —— 选一件（每天只能做一个主动作）'));
    if (inEnc) {
      const opts = state.pending.options || [];
      const kinds = { exit: 0, neutral: 0, trap: 0 };
      opts.forEach((o) => { if (kinds[o.kind] !== undefined) kinds[o.kind]++; });
      box.appendChild(el('div', 'choicesSub',
        '现在给出 ' + opts.length + ' 个选项：其中可走的路 ' + kinds.exit + ' 条（需你已掌握线索）、' +
        '安全但会受伤的 ' + kinds.neutral + ' 条、直接触发规矩的 ' + kinds.trap + ' 条。' +
        '看不出来就先去调查——线索越全，生路越明确。'));
    }
    choices.forEach((c, i) => {
      // 选项文字里已经写了「（生路）」的，不再重复追加标注
      const note = c.note && !c.label.includes('生路') ? c.note : '';
      const b = el('button', 'btn opt' + (c.note ? ' exit' : ''),
        String(i + 1).padStart(2, '0') + '　' + c.label + note);
      b.onclick = () => onChoice(c.id);
      box.appendChild(b);
    });
    if (state.pending) {
      const hint = el('div', 'muted', '可观察线索：已掌握 ' + state.pending.revealedClues.length +
        ' 条，另有 ' + state.pending.clueHints + ' 条尚未掌握。线索越全，生路越明确。');
      box.appendChild(hint);
    }
  }

  function renderEncounter() {
    if (!state.pending) return;
    addLog('enc', '【遭遇】' + state.pending.name + '（' + state.pending.level + ' 级）');
    addLog('', state.pending.text);
    if (N) {
      const mood = N.encounterMood(state);
      if (mood) addLog('scene', mood);
      const sense = N.encounterSense ? N.encounterSense(state) : '';
      if (sense) addLog('scene', sense);
      const act = N.encounterAct ? N.encounterAct(state) : '';
      if (act) addLog('scene', act);
    }
    if (state.pending.revealedClues.length) {
      addLog('clue', state.pending.revealedClues.map((c) => '· 你掌握的线索：' + c));
    } else {
      addLog('warn', '· 你对它一无所知——现在只能靠判断和运气。');
    }
  }

  function renderOver() {
    const o = state.over;
    const def = C.endings[o.ending] || { name: o.ending, text: '' };
    addLog('over', '【结局】' + def.name);
    addLog('over', def.text);
    addLog('', '存活 ' + state.turn + ' 天（第 ' + state.chapter + ' 章）。');
    // 跨局结算：统计、成就、周目点数（档案带校验和）
    if (P && profile && !o.settled) {
      o.settled = true;
      const r = P.settle(profile, state, o.ending);
      profile = r.profile;
      P.saveProfile(profile);
      addLog('muted', '【档案】本局获得周目点数 +' + r.points + '（累计可用 ' + profile.points + '）｜存活 ' +
        r.run.turn + ' 天｜生路存活 ' + r.run.escapes + ' 次｜触发玩法 ' + r.run.mechCount + ' 条');
      if (r.unlocked.length) {
        addLog('over', '【解锁成就】' + r.unlocked.map((a) => a.name + '（' + a.desc + '）').join('；'));
      }
      const prog = P.achievementProgress(profile);
      addLog('muted', '成就进度 ' + prog.unlocked + '/' + prog.total + '　结局收集 ' +
        Object.keys(profile.endings).length + '/' + Object.keys(C.endings).length);
    }
    const lv = state.contentLevel || 'A';
    if (lv !== 'A' && C.narrative['level' + lv]) {
      const bank = C.narrative['level' + lv];
      addLog('warn', bank[(state.turn + state.seedInt) % bank.length]);
    }
    const gallery = LS.get('rs_gallery', {});
    if (!gallery[o.ending]) {
      gallery[o.ending] = { times: 1, first: Date.now() };
      LS.set('rs_gallery', gallery);
    } else gallery[o.ending].times += 1, LS.set('rs_gallery', gallery);
  }

  async function onChoice(id, customText) {
    lastLines = [];                 // 本轮新增行：用于「刚刚发生」卡片
    // 自由输入：先尝试识别成"真实行动"（不接 AI 也能有自由度）
    let realId = id;
    let intent = null;
    if (id === '__custom__') {
      if (state && state.pending && E.parseEncounterIntent) {
        // 遭遇中：只允许把话对应到**现有选项**上，绝不凭空造一个绕过判定的选项
        const ei = E.parseEncounterIntent(state, customText);
        if (ei) {
          realId = ei.optionId;
          const kindName = { exit: '生路', neutral: '中性', trap: '陷阱' }[ei.kind] || ei.kind;
          intent = { label: '[' + kindName + '] ' + ei.label, via: '你写的那句话' };
        } else {
          addLog('warn', '【此刻必须做出选择】引擎不会因为你说了什么而改变判定。');
          addLog('muted', '你可以直接写你要做的事，但必须落在下面这些选项上；选项的文字/标签对得上，我就替你选它。');
          return;
        }
      } else if (E.parseIntent) {
        intent = E.parseIntent(state, customText);
        if (intent && E.availableActions(state).some((a) => a.id === intent.actionId)) {
          realId = intent.actionId;
        }
      }
    }
    const rep = E.resolve(state, realId, customText);
    if (rep.error) { addLog('warn', '【拒绝】' + rep.error); return; }
    if (intent && realId !== '__custom__') {
      addLog('muted', '（从你的话里识别到行动：' + intent.label + '｜依据：“' + intent.via + '”）');
    } else if (id === '__custom__') {
      addLog('muted', '（这句话只作为叙事描述，判定仍按当前局势照常结算）');
    }
    // 第 15 轮：先写"你是怎么做的"（行动过程），再出结果，剧情更完整
    if (N && N.actionProcess && !rep.error) {
      const proc = N.actionProcess(state, realId);
      if (proc && proc.length) addLog('', proc);
    }
    // 叙事
    if (window.RS_AI.enabled && window.RS_AI.endpoint && rep.narrative.length) {
      try {
        const ai = await window.RS_AI.narrate({ world: C.meta.title, panel: rep.panel, action: id, settlement: rep.settlement });
        if (ai) { addLog('', ai); addLog('muted', '（本段剧情由 AI 润色；判定与数值以引擎为准）'); }
        else addLog('', rep.narrative);
      } catch (e) {
        addLog('', rep.narrative);
        addLog('warn', '（AI 叙事失败，已回退为引擎文本：' + e.message + '）');
      }
    } else {
      addLog('', rep.narrative);
    }
    // 行动结果变体句：让"每次休整都是同一句话"不再发生
    if (N && rep.actionVariant && !state.over) {
      const extra = N.actionLine(state, rep.actionVariant);
      if (extra) addLog('scene', extra);
    }
    if (rep.settlement && rep.settlement.length) addLog('set', rep.settlement.map((s) => '▸ ' + s));
    // 第 13 轮：行动之后的余波（让"做完了"有下文，剧情更完整）
    if (N && N.aftermath && !state.over) {
      const af = N.aftermath(state, 2);
      if (af.length) addLog('scene', af[0]);
    }
    if (state.integrity.length) { addLog('warn', '【完整性告警】' + state.integrity.slice(-3).join(' / ')); }
    renderPanel();
    renderSceneArt(state, { lastAction: realId });
    if (state.over) { renderOver(); hideNow(); renderChoices([]); autoSave(); return; }
    if (state.pending) renderEncounter();     // 进入遭遇：正文要显示在「刚刚发生」里
    renderNow();
    renderChoices(rep.choices, 'continue');   // 先读完结果，再让玩家点「继续」
    autoSave();
  }

  /** 「继续」：清掉结果卡片，正式进入下一步（新的一天 / 一场遭遇） */
  function continueNext() {
    hideNow();
    lastLines = [];
    lastSceneCtx = { lastAction: null };
    if (!state) return;
    if (state.over) { renderOver(); renderChoices([]); return; }
    if (state.pending) {

  function sceneSvg(state, ctx, forceMotif) {
    const pal = ERA_PALETTE[(state && state.era)] || ERA_PALETTE.y2018;
    const seed = (state && state.seedInt) || 20180923;
    const turn = (state && state.turn) || 1;
    const hh = (i) => ((seed * 9301 + turn * 49297 + i * 233) % 233280) / 233280;
    const motif = forceMotif || motifOf(state, ctx);
    const W = 400; const H = 190; const horizon = 132;
    const out = [];
    out.push('<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">');
    out.push('<defs>' +
      '<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0" stop-color="' + pal[0] + '"/><stop offset=".52" stop-color="' + pal[1] + '"/>' +
      '<stop offset=".84" stop-color="' + pal[2] + '"/><stop offset="1" stop-color="' + pal[2] + '"/></linearGradient>' +
      '<radialGradient id="halo" cx="50%" cy="50%" r="50%">' +
      '<stop offset="0" stop-color="' + pal[2] + '" stop-opacity=".8"/><stop offset=".5" stop-color="' + pal[2] + '" stop-opacity=".16"/>' +
      '<stop offset="1" stop-color="' + pal[2] + '" stop-opacity="0"/></radialGradient>' +
      '<radialGradient id="vig" cx="50%" cy="45%" r="72%"><stop offset=".55" stop-color="#000" stop-opacity="0"/>' +
      '<stop offset="1" stop-color="#000" stop-opacity=".7"/></radialGradient></defs>');
    out.push(R_(0, 0, W, H, 'url(#sky)'));
    // 月亮 + 地平线（所有母题共用的底子）
    const mx = 58 + hh(1) * 284;
    out.push(C_(mx.toFixed(0), (34 + hh(2) * 24).toFixed(0), 74, 'url(#halo)'));
    out.push(C_(mx.toFixed(0), (34 + hh(2) * 24).toFixed(0), 17, pal[3], 1));
    out.push(C_(mx.toFixed(0), (34 + hh(2) * 24).toFixed(0), 11, '#ffffff', .9));
    out.push(R_(0, horizon, W, H - horizon, pal[5]));
    out.push(E_(200, horizon + 24, 240, 34, pal[2], .28));
    const flat = (a) => [].concat(a).reduce((acc, x) => acc.concat(Array.isArray(x) ? flat(x) : x), []);
    out.push(flat((MOTIFS[motif] || MOTIFS.skyline)(pal, hh)).join(''));
    // ===== 阴冷诡异质感层（借鉴《我叫杨间》：羊皮纸颗粒、被黑暗窥视的眼睛、高对比冷光）=====
    // 旧纸颗粒：SVG 湍流滤镜直接生成，不需要任何外部贴图
    out.push('<filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>' +
      '<feColorMatrix type="saturate" values="0"/></filter>');
    out.push('<rect width="' + W + '" height="' + H + '" filter="url(#grain)" opacity=".13"/>');
    for (let i = 0; i < 5; i++) {
      out.push(E_((hh(i + 300) * W).toFixed(0), (hh(i + 320) * H).toFixed(0),
        (18 + hh(i + 340) * 46).toFixed(0), (10 + hh(i + 360) * 26).toFixed(0), pal[2], .06));
    }
    for (let y = 0; y < H; y += 4) out.push(LN(0, y, W, y, '#000000', .06, 1));   // 扫描线
    for (let i = 0; i < 3; i++) {                                                  // 胶片划痕
      const sx = (hh(i + 400) * W).toFixed(0);
      out.push(LN(sx, (hh(i + 410) * 40).toFixed(0), (Number(sx) + hh(i + 420) * 3).toFixed(0), H, '#ffffff', .09, 1));
    }
    // 暗处窥视的眼睛：遭遇/结局时必现，平时偶尔出现——"被黑暗窥视"的招牌意象
    if ((state && (state.pending || state.over)) || hh(7) > .5) {
      const ex = 44 + hh(11) * 300;
      const ey = 54 + hh(13) * 58;
      const gap = 26 + hh(15) * 16;
      out.push(E_(ex.toFixed(0), ey.toFixed(0), 16, 8, '#000000', .5));
      [-1, 1].forEach((k) => {
        const x = (ex + k * gap / 2).toFixed(0);
        out.push(E_(x, ey.toFixed(0), 6.4, 3.6, pal[3], .95));
        out.push(C_(x, ey.toFixed(0), 2.2, '#05070a', .95));
        out.push(C_(x, ey.toFixed(0), 0.9, '#ffffff', .55));
      });
      out.push(LN(ex - 46, ey, ex - gap / 2 - 9, ey, pal[3], .16, 1.6));
      out.push(LN(ex + gap / 2 + 9, ey, ex + 46, ey, pal[3], .16, 1.6));
    }
    out.push(R_(0, 0, W, H, 'url(#vig)'));
    for (let i = 0; i < 26; i++) {
      out.push(C_((hh(i + 90) * W).toFixed(0), (hh(i + 150) * H).toFixed(0), 0.9, '#fff', (.05 + hh(i) * .09).toFixed(2)));
    }
    out.push('</svg>');
    return out.join('');
  }

  function sceneCaption(state, ctx) {
    if (!state) return '神秘复苏 · 灵异复苏时代';
    const city = (C.cities && C.cities[state.city]) || null;
    const era = (C.eras && C.eras[state.era]) || null;
    const motif = motifOf(state, ctx);
    const parts = [];
    if (MOTIF_LABEL[motif]) parts.push(MOTIF_LABEL[motif]);
    if (city) parts.push(city.name);
    if (era) parts.push(era.short);
    return parts.join('　·　') || '神秘复苏';
  }

  let lastSceneCtx = null;
  function renderSceneArt(state, ctx) {
    const box = $('scene');
    if (!box || !state) return;
    if (ctx) lastSceneCtx = ctx;
    const m = motifOf(state, lastSceneCtx);
    box.innerHTML = sceneSvg(state, lastSceneCtx);
    box.appendChild(el('div', 'sceneCaption', sceneCaption(state, lastSceneCtx)));
    box.setAttribute('data-motif', m);
  }

  function autoSave() {
    // 只在「每天开始」这一干净边界自动存档（遭遇中途不覆盖，避免歧义）
    if (state && !state.over && state.phase === 'day' && !state.actionTakenToday) {
      LS.set('rs_autosave', E.serialize(state));
    }
  }
  function saveToFile() {
    const text = E.serialize(state);
    const blob = new Blob([text], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '神秘复苏-存档-第' + state.turn + '天.json';
    a.click();
    URL.revokeObjectURL(a.href);
  }
  function loadFromText(text) {
    const r = E.deserialize(String(text || '').trim());
    if (r.error) {
      addLog('warn', '【载入失败】' + r.error + '（存档被修改过，或被截断）');
      return false;
    }
    state = r.state;
    clear($('log'));
    addLog('', '【读档】第 ' + state.turn + ' 天（第 ' + state.chapter + ' 章），难度：' + (state.difficulty === 'hard' ? '极难' : '标准'));
    if (state.over) renderOver();
    renderPanel();
    lastSceneTurn = 0;
    if (state.pending) { renderEncounterPreview(); renderChoices(E.availableActions(state)); }
    else { renderScene(true); renderSceneArt(state); renderChoices(E.availableActions(state)); }
    return true;
  }

          const b = el('button', 'btn small' + (selected.custom[key] === op.id ? ' on' : ''), op.name);
          b.onclick = () => { selected.custom[key] = op.id; showMenu(); };

          : C.cities[id].src !== '原著'));

      const curC = selected.city === 'random' ? null : C.cities[selected.city];
      box.appendChild(el('div', 'hint', curC
        ? ('落地：' + curC.name + '（' + curC.src + '）' + curC.desc +
           '　本地厉鬼：' + curC.ghosts.map((g) => (C.ghosts[g] ? C.ghosts[g].name : g)).join('、') +
           (curC.rule ? '　【本地规矩】' + curC.rule.text : '') +
           (curC.act ? '　【专属行动】' + curC.act.label : ''))
        : '落地：随机（按种子抽签，同种子必得同一座城；每座城都有本地厉鬼、本地规矩与一条专属行动）'));
    }

    // ---- 时期（原著时间线）：可自选，也可随机 ----
    if (C.eras) {
      box.appendChild(el('div', 'sectionTitle', '时期（原著时间线）· 可自选或随机'));
      const eRow = el('div', 'row');
      const re = el('button', 'btn small' + (selected.era === 'random' ? ' on' : ''), '随机时期');
      re.onclick = () => { selected.era = 'random'; showMenu(); };
      eRow.appendChild(re);
      Object.keys(C.eras).forEach((id) => {
        const e = C.eras[id];
        const b = el('button', 'btn small' + (selected.era === id ? ' on' : ''), e.short);
        b.title = e.name + '　' + e.desc;
        b.onclick = () => { selected.era = id; showMenu(); };
        eRow.appendChild(b);
      });
      box.appendChild(eRow);
      const curE = selected.era === 'random' ? null : C.eras[selected.era];
      box.appendChild(el('div', 'hint', curE
        ? ('时期：' + curE.name + '　' + curE.desc + '　世界时钟：' +
           curE.events.map((e) => (C.ghosts[e.ghost] ? C.ghosts[e.ghost].name : e.ghost) + '@' + e.turn + '天').join(' → '))
        : '时期：随机（按种子抽签）'));
    }

    box.appendChild(el('div', 'sectionTitle', '内容分级'));
    const lvRow = el('div', 'row');
    [['A', 'A 影视级（默认）'], ['B', 'B 写实级'], ['C', 'C 无限制']].forEach(([id, label]) => {
      const b = el('button', 'btn small' + (selected.level === id ? ' on' : ''), label);
      b.onclick = () => { selected.level = id; showMenu(); };
      lvRow.appendChild(b);
    });
    box.appendChild(lvRow);

    box.appendChild(el('div', 'sectionTitle', '随机种子（可选，同种子=同世界）'));
    const seedInput = el('input', 'input');
    seedInput.placeholder = '留空则随机';
    seedInput.value = selected.seed;
    seedInput.oninput = () => { selected.seed = seedInput.value.trim(); };
    box.appendChild(seedInput);

    const start = el('button', 'btn primary big', '开始游戏');
    start.onclick = () => startGame();
    box.appendChild(start);

    if (profile && P) {
      const prog = P.achievementProgress(profile);
      const endCount = Object.keys(profile.endings || {}).length;
      box.appendChild(el('div', 'sectionTitle', '玩家档案（跨局保存）'));
      const kv = el('div', 'hint');
      kv.textContent = '成就 ' + prog.unlocked + '/' + prog.total +
        '　｜　结局收集 ' + endCount + '/' + Object.keys(C.endings).length +
        '　｜　最佳存活 ' + (profile.best.turn || 0) + ' 天' +
        '　｜　总局数 ' + profile.runs.total + '（死亡 ' + profile.runs.died + '）' +
        '　｜　周目点数 ' + profile.points;
      box.appendChild(kv);
      const names = Object.keys(profile.endings || {})
        .map((k) => (C.endings[k] ? C.endings[k].name : k) + '×' + profile.endings[k]);
      box.appendChild(el('div', 'muted', '结局图鉴：' + (names.length ? names.join('、') : '暂无')));
      const unlockedNames = prog.list.filter((x) => x.unlocked).map((x) => x.name);
      box.appendChild(el('div', 'muted', '已解锁成就：' + (unlockedNames.length ? unlockedNames.join('、') : '暂无')));

      // 二周目：花点数换开局加成（只改初始值，写进本局存档参与校验和）
      if (profile.points > 0 && C.legacyOptions) {
        box.appendChild(el('div', 'sectionTitle', '二周目继承（本次开局生效，消耗周目点数）'));
        const row = el('div', 'row');
        const none = el('button', 'btn small' + (!selected.legacy ? ' on' : ''), '不带继承');
        none.onclick = () => { selected.legacy = null; showMenu(); };
        row.appendChild(none);
        Object.keys(C.legacyOptions).forEach((id) => {
          const leg = C.legacyOptions[id];
          const afford = profile.points >= leg.cost;
          const b = el('button', 'btn small' + (selected.legacy === id ? ' on' : ''),
            leg.name + '（' + leg.cost + ' 点）' + (afford ? '' : '·点数不足'));
          b.disabled = !afford;
          if (afford) b.onclick = () => { selected.legacy = id; showMenu(); };
          row.appendChild(b);
        });
        box.appendChild(row);
        const cur = selected.legacy && C.legacyOptions[selected.legacy];
        box.appendChild(el('div', 'hint', cur ? cur.desc : '继承只影响开局初始值，不参与任何判定公式。'));
      }
    } else {
      const gallery = LS.get('rs_gallery', {});
      const names = Object.keys(gallery).map((k) => (C.endings[k] ? C.endings[k].name : k) + '×' + gallery[k].times);
      box.appendChild(el('div', 'muted', '结局图鉴（' + Object.keys(gallery).length + '/' + Object.keys(C.endings).length + '）：' +
        (names.length ? names.join('、') : '暂无')));
    }
    const auto = LS.get('rs_autosave', null);
    if (auto) {
      const b = el('button', 'btn small', '继续上次的进度');
      b.onclick = () => loadFromText(auto); // 注意：LS.get 已经解过一次码，不能再 JSON.stringify
      box.appendChild(b);
    }
  }

  function startGame() {
    // 二周目继承：先校验点数（档案带校验和，改档会在载入时被拒）
    let legacy = null;
    if (selected.legacy && profile && P && C.legacyOptions[selected.legacy]) {
      const cost = C.legacyOptions[selected.legacy].cost;
      if (profile.points >= cost) {
        profile.points -= cost;
        legacy = selected.legacy;
        P.saveProfile(profile);
      } else {
        legacy = null;
      }
      selected.legacy = null; // 只对本次开局生效
    }
    state = E.createGame({
      pack: selected.pack, difficulty: selected.difficulty,
      custom: selected.difficulty === 'custom' ? selected.custom : null,
      seed: selected.seed || undefined, contentLevel: selected.level,
      city: selected.city, era: selected.era,
      legacy: legacy,
    });
    $('panel').style.display = '';
    clear($('log'));
    addLog('', '【开局】' + C.packs[selected.pack].blurb);
    const ci = cityInfo(state), ei = eraInfo(state);
    if (ci) addLog('', '【落地】' + ci.name + '（' + ci.src + '，' + (state.cityRandom ? '随机' : '自选') + '）——' + ci.desc);
    if (ei) addLog('', '【时期】' + ei.name + '（' + ei.src + '，' + (state.eraRandom ? '随机' : '自选') + '）——' + ei.desc);
    // 继承提示必须写在 clear(log) 之后，否则会被清掉（玩家花了点数却看不到反馈）
    if (legacy) {
      addLog('', '【二周目继承】' + C.legacyOptions[legacy].name + '：' + C.legacyOptions[legacy].desc +
        '（已消耗 ' + C.legacyOptions[legacy].cost + ' 点，剩余 ' + (profile ? profile.points : 0) + ' 点）');
    }
    addLog('muted', '规则引擎 ' + C.meta.version + '　种子：' + state.seed + '　难度：' + (state.tuning ? state.tuning.name : '标准') +
      '　内容分级：' + ({ A: 'A 影视级', B: 'B 写实级', C: 'C 无限制' }[state.contentLevel] || 'A') +
      '（同一种子+同一串选择 = 同一结果；判定永不由运气之外的因素改变）');
    renderPanel();
    lastSceneTurn = 0;
    renderScene(true);
    renderSceneArt(state);
    renderChoices(E.availableActions(state));
  }

  /* ------------------------------------------------------- 内置工具面板 */
  /** 存档导入 / AI 设置都走页面内面板：不可用会锁死渲染线程的 prompt/alert */
  function openToolbox(mode) {
    const box = $('toolbox');
    clear(box);
    box.style.display = '';
    if (mode === 'load') {
      box.appendChild(el('div', 'sectionTitle', '导入存档（会被校验和检查，改过就打不开）'));
      const ta = el('textarea', 'input');
      ta.rows = 4;
      ta.placeholder = '把存档 JSON 整段粘贴到这里';
      box.appendChild(ta);
      const row = el('div', 'row');
      const go = el('button', 'btn small primary', '载入');
      go.onclick = () => { if (loadFromText(ta.value)) { box.style.display = 'none'; } };
      const cancel = el('button', 'btn small', '关闭');
      cancel.onclick = () => { box.style.display = 'none'; };
      row.appendChild(go); row.appendChild(cancel);
      box.appendChild(row);
    } else {
      renderAccountPanel(box);
    }
  }

  /* --------------------------------------------- 本机账户与 API 绑定面板 */
  const V = window.RSVault || null;

  function aiBadge() {
    if (!V || !V.hasVault()) return 'AI：未设账户';
    const u = V.userName();
    if (!V.isUnlocked()) return 'AI：' + u + '（未登录）';
    return 'AI：' + u + (V.hasAI() ? '（已绑定）' : '（未绑定）');
  }

  function refreshAIState() {
    const cfg = window.RS_AI;
    $('aiState').textContent = aiBadge();
    if (!V || !V.isUnlocked() || !V.hasAI()) {   // 未登录 / 未绑定 → 一律回到纯程序叙事
      cfg.enabled = false;
      cfg.endpoint = '';
      cfg.apiKey = '';
      return;
    }
    V.getAI().then((ai) => {
      if (!ai || ai.error) { cfg.enabled = false; return; }
      cfg.endpoint = ai.endpoint || '';
      cfg.apiKey = ai.apiKey || '';
      cfg.model = ai.model || 'deepseek-chat';
      cfg.enabled = !!cfg.endpoint;
      $('aiState').textContent = aiBadge();
    });
  }

  function note(el2, text, tone) {
    const n = el('div', 'hint', text);
    if (tone === 'warn') n.style.color = 'var(--danger)';
    if (tone === 'ok') n.style.color = 'var(--ok)';
    el2.appendChild(n);
    return n;
  }

  function renderAccountPanel(box) {
    if (!V) { note(box, '当前环境不支持本机账户（缺少 WebCrypto）', 'warn'); return; }
    box.appendChild(el('div', 'sectionTitle', 'AI 叙事需要绑定本机账户（API 配置会加密保存）'));
    note(box, '说明：本机账户只是把 API 配置用你的密码加密存在本地——没登录就看不到、改不了。' +
      '它挡得住同机翻 localStorage 与手改存档，挡不住能改页面代码或知道密码的人；也没有找回密码与跨设备同步（单文件本地游戏做不到）。');

    if (!V.hasVault()) {
      // ---- 状态一：未设账户 ----
      const u = el('input', 'input'); u.id = 'acc_user'; u.placeholder = '账户名（例如 baisonghao）';
      const p = el('input', 'input'); p.id = 'acc_pass'; p.type = 'password'; p.placeholder = '密码（至少 ' + V.MIN_PASS + ' 位）';
      const p2 = el('input', 'input'); p2.id = 'acc_pass2'; p2.type = 'password'; p2.placeholder = '再输一次密码';
      box.appendChild(u); box.appendChild(p); box.appendChild(p2);
      // 如果旧版本在档案里留过明文配置，这里带出来供一次性绑定
      const legacy = (profile && profile.ai && profile.ai.endpoint) ? profile.ai : null;
      const ep = el('input', 'input'); ep.id = 'ai_endpoint'; ep.placeholder = 'AI 接口地址（可留空，稍后再绑）';
      const k = el('input', 'input'); k.id = 'ai_apiKey'; k.type = 'password'; k.placeholder = 'API Key（可留空）';
      const m = el('input', 'input'); m.id = 'ai_model'; m.placeholder = '模型名';
      ep.value = legacy ? (legacy.endpoint || '') : '';
      k.value = legacy ? (legacy.apiKey || '') : '';
      m.value = (legacy && legacy.model) || 'deepseek-chat';
      box.appendChild(el('div', 'sectionTitle', '顺带绑定 AI 配置（可选）'));
      box.appendChild(ep); box.appendChild(k); box.appendChild(m);
      if (legacy) note(box, '检测到旧版本存在档案里的明文配置，已带出——绑定后我会把它从档案里删掉。');
      const row = el('div', 'row');
      const go = el('button', 'btn small primary', '创建账户并绑定');
      go.onclick = async () => {
        if (p.value !== p2.value) { note(box, '两次输入的密码不一致', 'warn'); return; }
        const ai = ep.value.trim() ? { endpoint: ep.value.trim(), apiKey: k.value.trim(), model: m.value.trim() || 'deepseek-chat' } : null;
        const r = await V.register(u.value, p.value, ai);
        if (r.error) { note(box, r.error, 'warn'); return; }
        // 绑定成功：清掉档案里的明文（如果有人看过，它就不该再留一份）
        if (legacy && P && profile) { profile.ai = { endpoint: '', apiKey: '', model: 'deepseek-chat', enabled: false }; P.saveProfile(profile); }
        refreshAIState();
        addLog('muted', '【账户】已创建本机账户「' + r.user + '」' + (r.bound ? '，AI 配置已加密绑定。' : '（尚未绑定 AI 配置）。'));
        box.style.display = 'none';
      };
      const cancel = el('button', 'btn small', '关闭');
      cancel.onclick = () => { box.style.display = 'none'; };
      row.appendChild(go); row.appendChild(cancel);
      box.appendChild(row);
      return;
    }

    // ---- 状态二：有账户但未登录 ----
    if (!V.isUnlocked()) {
      note(box, '本机账户：「' + V.userName() + '」' + (V.hasAI() ? '（已绑定 AI 配置，加密保存）' : '（未绑定 AI 配置）'));
      note(box, '未登录时 AI 配置不可见、不可改，游戏按纯程序叙事运行。', 'warn');
      const p = el('input', 'input'); p.id = 'acc_pass'; p.type = 'password'; p.placeholder = '输入账户密码';
      box.appendChild(p);
      const row = el('div', 'row');
      const go = el('button', 'btn small primary', '登录');
      go.onclick = async () => {
        const r = await V.unlock(p.value);
        if (r.error) { note(box, r.error, 'warn'); return; }
        refreshAIState();
        addLog('muted', '【账户】已登录「' + r.user + '」' + (r.bound ? '，AI 叙事已启用（密钥只在本页内存里，刷新需重新登录）。' : '，还未绑定 AI 配置。'));
        box.style.display = 'none';
      };
      p.addEventListener('keydown', (ev) => { if (ev.key === 'Enter') go.click(); });
      const cancel = el('button', 'btn small', '关闭');
      cancel.onclick = () => { box.style.display = 'none'; };
      row.appendChild(go); row.appendChild(cancel);
      box.appendChild(row);
      return;
    }

    // ---- 状态三：已登录，可查看/修改绑定 ----
    note(box, '已登录：「' + V.lockedUser() + '」。下面是绑定到该账户的 AI 配置（未绑定则留空）。', 'ok');
    const cur = { endpoint: '', apiKey: '', model: 'deepseek-chat' };
    const build = (ai) => {
      if (ai && !ai.error) { cur.endpoint = ai.endpoint || ''; cur.apiKey = ai.apiKey || ''; cur.model = ai.model || 'deepseek-chat'; }
      const ep = el('input', 'input'); ep.id = 'ai_endpoint'; ep.value = cur.endpoint; ep.placeholder = '接口地址（留空=不用 AI，回到程序叙事）';
      const k = el('input', 'input'); k.id = 'ai_apiKey'; k.type = 'password'; k.value = cur.apiKey; k.placeholder = 'API Key';
      const m = el('input', 'input'); m.id = 'ai_model'; m.value = cur.model;
      box.appendChild(ep); box.appendChild(k); box.appendChild(m);
      const row = el('div', 'row');
      const save = el('button', 'btn small primary', '保存到账户');
      save.onclick = async () => {
        const r = await V.putAI({ endpoint: ep.value, apiKey: k.value, model: m.value });
        if (r.error) { note(box, r.error, 'warn'); return; }
        refreshAIState();
        addLog('muted', '【账户】AI 配置已加密绑定到「' + V.userName() + '」。');
        box.style.display = 'none';
      };
      const unbind = el('button', 'btn small', '解绑');
      unbind.onclick = () => {
        const r = V.clearAI();
        if (r.error) { note(box, r.error, 'warn'); return; }
        refreshAIState();
        addLog('muted', '【账户】已解绑 AI 配置，回到纯程序叙事。');
        box.style.display = 'none';
      };
      const logout = el('button', 'btn small', '登出');
      logout.onclick = () => {
        V.lock();
        refreshAIState();
        addLog('muted', '【账户】已登出，AI 配置重新变为不可见。');
        box.style.display = 'none';
      };
      const del = el('button', 'btn small danger', '删除账户');
      del.onclick = async () => {
        const pw = (document.querySelector('#acc_delpass') || {}).value || '';
        const r = await V.destroy(pw);
        if (r.error) { note(box, r.error, 'warn'); return; }
        refreshAIState();
        addLog('muted', '【账户】本机账户已删除（含加密保存的 AI 配置）。');
        box.style.display = 'none';
      };
      const row2 = el('div', 'row');
      const dp = el('input', 'input'); dp.id = 'acc_delpass'; dp.type = 'password'; dp.placeholder = '删除账户需再输一次密码';
      const cancel = el('button', 'btn small', '关闭');
      cancel.onclick = () => { box.style.display = 'none'; };
      row.appendChild(save); row.appendChild(unbind); row.appendChild(logout); row.appendChild(cancel);
      box.appendChild(row);
      box.appendChild(el('div', 'sectionTitle', '危险操作'));
      box.appendChild(dp);
      const row3 = el('div', 'row');
      row3.appendChild(del);
      box.appendChild(row3);
    };
    V.getAI().then((ai) => build(ai && ai.error ? null : ai)).catch(() => build(null));
  }

  // 供截图/测试核对：列出全部母题与生成 SVG
  window.RSUI = { motifList: motifList, sceneSvg: sceneSvg, motifOf: motifOf, MOTIFS: MOTIFS, openGallery: openGallery };

  /* ------------------------------------------------------------ 初始化 */
  window.addEventListener('DOMContentLoaded', function () {
    $('btnSave').onclick = saveToFile;
    $('btnLoad').onclick = function () { openToolbox('load'); };
    $('btnCard').onclick = function () {
      const txt = E.serialize(state || E.createGame({}));
      addLog('muted', '【存档卡】' + txt.slice(0, 240) + '…（完整内容用「导出存档」保存）');
    };
    $('btnAI').onclick = function () { openToolbox('ai'); };
    if ($('btnGuide')) $('btnGuide').onclick = openGuide;
    if ($('btnGallery')) $('btnGallery').onclick = openGallery;
    if ($('btnPanel')) $('btnPanel').onclick = function () { document.body.classList.toggle('panelOpen'); };
    if ($('jumpNew')) $('jumpNew').onclick = scrollLog;
    // 手动往上翻时给出「回到最新」提示
    const lw = $('logWrap');
    if (lw) lw.addEventListener('scroll', function () {
      const j = $('jumpNew');
      if (!j) return;
      const away = lw.scrollHeight - lw.scrollTop - lw.clientHeight > 90;
      j.style.display = away ? '' : 'none';
    });
    $('btnCustom').onclick = function () {
      const v = $('customInput').value;
      if (!v.trim()) return;
      $('customInput').value = '';
      onChoice('__custom__', v);
    };
    refreshAIState();   // 刷新后一律回到"未登录"，AI 配置留在加密保管库里
    showMenu();
    // 首次进入自动弹世界观速览（没看过小说也能玩明白）
    if (!LS.get('rs_seen_guide', 0)) { LS.set('rs_seen_guide', 1); openGuide(); }
  });
})();
</script>
</body>
</html>
