  function unb64(str) {
    let s;
    if (typeof atob === 'function') { s = atob(str); }
    else { s = Buffer.from(str, 'base64').toString('binary'); }
    const out = new Uint8Array(s.length);
    for (let i = 0; i < s.length; i++) out[i] = s.charCodeAt(i);
    return out;
  }
  function subtle() {
    const c = (typeof crypto !== 'undefined' && crypto.subtle) ? crypto.subtle
      : (typeof globalThis !== 'undefined' && globalThis.crypto && globalThis.crypto.subtle) ? globalThis.crypto.subtle : null;
    if (!c) throw new Error('当前环境没有 WebCrypto，无法加密保存');
    return c;
  }
  function rand(n) {
    const a = new Uint8Array(n);
    if (typeof crypto !== 'undefined' && crypto.getRandomValues) crypto.getRandomValues(a);
    else globalThis.crypto.getRandomValues(a);
    return a;
  }

  async function deriveKey(pass, salt, iter) {
    const base = await subtle().importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveKey']);
    return subtle().deriveKey(
      { name: 'PBKDF2', salt: salt, iterations: iter || ITER, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  }
  async function encrypt(key, obj) {
    const iv = rand(12);
    const ct = await subtle().encrypt({ name: 'AES-GCM', iv: iv }, key, enc.encode(JSON.stringify(obj)));
    return { iv: b64(iv), ct: b64(ct) };
  }
  async function decrypt(key, box) {
    const iv = unb64(box.iv), ct = unb64(box.ct);
    const plain = await subtle().decrypt({ name: 'AES-GCM', iv: iv }, key, ct);
    return JSON.parse(dec.decode(plain));
  }

  /* --------------------------------------------------------------- 存取 */
  function lsGet() {
    try { return localStorage.getItem(KEY); } catch (e) { return null; }
  }
  function lsSet(v) { try { localStorage.setItem(KEY, v); } catch (e) {} }
  function lsDel() { try { localStorage.removeItem(KEY); } catch (e) {} }

  function read() {
    const raw = lsGet();
    if (!raw) return null;
    try {
      const v = JSON.parse(raw);
      if (!v || v.v !== 1 || !v.salt || !v.check) return null;
      return v;
    } catch (e) { return null; }
  }
  function write(v) { lsSet(JSON.stringify(v)); }

  /* --------------------------------------------------------------- 会话 */
  let sessionKey = null;   // 只在内存里，刷新即失效（这正是"必须登录"的含义）
  let sessionUser = null;

  function hasVault() { return !!read(); }
  function userName() { const v = read(); return v ? v.user : null; }
  function isUnlocked() { return !!sessionKey; }
  function lockedUser() { return sessionUser; }

  /** 首次使用：创建账户并把 AI 配置加密绑定进去 */
  async function register(user, pass, initialAI) {
    user = String(user || '').trim();
    pass = String(pass || '');
    if (user.length < 2) return { error: '账户名至少 2 个字符' };
    if (pass.length < MIN_PASS) return { error: '密码至少 ' + MIN_PASS + ' 位' };
    if (hasVault()) return { error: '本机已存在账户，请直接登录（或先用原密码删除账户）' };
    const salt = rand(16);
    const key = await deriveKey(pass, salt);
    const v = {
      v: 1, user: user, salt: b64(salt), iter: ITER,
      check: await encrypt(key, CHECK_PLAIN),
      ai: initialAI ? await encrypt(key, initialAI) : null,
    };
    write(v);
    sessionKey = key;
    sessionUser = user;
    return { ok: true, user: user, bound: !!v.ai };
  }

  /** 登录：密码不对 → 解密校验块失败 */
  async function unlock(pass) {
    const v = read();
    if (!v) return { error: '本机还没有账户' };
    try {
      const key = await deriveKey(String(pass || ''), unb64(v.salt), v.iter);
      const check = await decrypt(key, v.check);
      if (check !== CHECK_PLAIN) return { error: '密码不正确' };
      sessionKey = key;
      sessionUser = v.user;
      return { ok: true, user: v.user, bound: !!v.ai };
    } catch (e) {
      return { error: '密码不正确' };   // AES-GCM 校验失败也落在这里
    }
  }

  function lock() { sessionKey = null; sessionUser = null; return { ok: true }; }

  /* ----------------------------------------------------------- AI 绑定 */
  async function putAI(ai) {
    const v = read();
    if (!v) return { error: '本机还没有账户，请先创建' };
    if (!sessionKey) return { error: '需要登录后才能修改绑定的 API 配置' };
    v.ai = await encrypt(sessionKey, {
      endpoint: String(ai.endpoint || '').trim(),
      apiKey: String(ai.apiKey || ''),
      model: String(ai.model || 'deepseek-chat').trim(),
    });
    write(v);
    return { ok: true };
  }

  function hasAI() { const v = read(); return !!(v && v.ai); }

  function getAI() {
    if (!sessionKey) return { error: '未登录：查看或修改 API 配置需要先登录账户' };
    const v = read();
    if (!v || !v.ai) return null;      // 已登录但还没绑定
    return decrypt(sessionKey, v.ai).then((ai) => ai).catch(() => ({ error: '密文校验失败（保管库被改动过）' }));
  }

  function clearAI() {
    const v = read();
    if (!v) return { error: '本机还没有账户' };
    if (!sessionKey) return { error: '需要登录后才能解绑' };
    v.ai = null;
    write(v);
    return { ok: true };
  }

  /** 删除账户（需原密码验证） */
  async function destroy(pass) {
    const v = read();
    if (!v) return { error: '本机还没有账户' };
    const r = await unlock(pass);
    if (r.error) return r;
    lsDel();
    sessionKey = null;
    sessionUser = null;
    return { ok: true };
  }

  return {
    KEY: KEY,
    MIN_PASS: MIN_PASS,
    ITER: ITER,
    hasVault: hasVault,
    userName: userName,
    isUnlocked: isUnlocked,
    lockedUser: lockedUser,
    hasAI: hasAI,
    register: register,
    unlock: unlock,
    lock: lock,
    putAI: putAI,
    getAI: getAI,
    clearAI: clearAI,
    destroy: destroy,
    // 仅测试用
    _internals: { deriveKey: deriveKey, encrypt: encrypt, decrypt: decrypt, b64: b64, unb64: unb64 },
  };
});
</script>
<script>/* ============================================================================
 * 神秘复苏模拟器 · 界面层
 * ----------------------------------------------------------------------------
 * 原则：
 *  - 界面只读引擎状态，绝不参与判定；玩家无法在界面上输入任何数值。
 *  - 所有文本经 textContent 注入（不拼 HTML），自定义输入先剥离尖括号。
 *  - 预留 AI 叙事接口 window.RS_AI：AI 只写【剧情叙事】，判定与数值一律以引擎为准，
 *    AI 返回的任何数值声明都会被忽略。
 * ==========================================================================*/
(function () {
  'use strict';

  const E = window.RSEngine;
  const C = window.RSContent;
  const P = window.RSProfile || null;
  let profile = P ? P.loadProfile().profile : null;

  const LS = {
    get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  };

  /* ------------------------------------------------------------ AI 接口 */
  window.RS_AI = window.RS_AI || {
    enabled: false,
    endpoint: '',
    apiKey: '',
    model: '',
    /** 只负责把引擎给的机械结果润色成剧情文字；不得改动任何数值 */
    async narrate(payload) {
      if (!this.enabled || !this.endpoint) return null;
      const sys = '你是恐怖互动小说的叙事者。只输出【剧情叙事】段落，' +
        '禁止输出任何数值、状态、公式、选项；禁止替玩家做决定；禁止修改判定结果。';
      const user = JSON.stringify({
        世界: payload.world, 状态: payload.panel, 玩家行动: payload.action,
        引擎判定: payload.settlement, 要求: '写 120~220 字的中文剧情，压抑、克制、不写爽文。',
      });
      const res = await fetch(this.endpoint, {
        method: 'POST',
        headers: Object.assign({ 'Content-Type': 'application/json' },
          this.apiKey ? { Authorization: 'Bearer ' + this.apiKey } : {}),
        body: JSON.stringify({
          model: this.model || 'deepseek-chat',
          messages: [{ role: 'system', content: sys }, { role: 'user', content: user }],
          temperature: 0.8,
        }),
      });
      if (!res.ok) throw new Error('AI 接口返回 ' + res.status);
      const data = await res.json();
      const txt = data && data.choices && data.choices[0] && data.choices[0].message
        ? data.choices[0].message.content : '';
      return txt ? String(txt).replace(/[【】]/g, '').slice(0, 600) : null;
    },
  };

  /* -------------------------------------------------------------- 状态 */
  let state = null;
  let selected = {
    difficulty: 'standard', pack: 'ordinary', level: 'A', seed: '',
    custom: { encounter: 'normal', judge: 'normal', mercy: 'normal' },
    legacy: null,
  };

  const $ = (id) => document.getElementById(id);
  function el(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  }
  function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }

  /* ------------------------------------------------------------ 场景文本 */
  const N = window.RSNarrative || null;

  /** 场景描写：优先用叙事生成器（组合 + 轮转 + 状态反应），没有则退回素材库 */
  function sceneLines(s) {
    if (N) {
      const r = N.scene(s);
      const ev = C.worldClock.filter((e) => e.turn <= s.turn).slice(-1)[0];
      if (ev && s.turn - ev.turn <= 2) r.lines.push('【世界事件】' + ev.label + ' 正在进行。');
      return r.lines;
    }
    const n = C.narrative;
    const out = [];
    out.push(n.timeOfDay[(s.turn * 3 + s.seedInt) % n.timeOfDay.length] + '，' +
      n.weather[(s.turn * 7 + s.seedInt) % n.weather.length] + '。');
    out.push(n.city[(s.turn + s.seedInt) % n.city.length]);
    return out;
  }

  let lastSceneTurn = 0;

  /** 每天开始时输出一次氛围与事件提示（同一天不重复） */
  function renderScene(force) {
    if (!state || state.over) return;
    if (!force && lastSceneTurn === state.turn) return;
    lastSceneTurn = state.turn;
    const lines = sceneLines(state);
    const startEv = C.worldClock.find((e) => e.turn === state.turn);
    if (startEv) {
      addLog('event', '════ 【重大事件】' + startEv.label + ' ════');
      addLog('event', '你正在被卷进去。它不是背景，它是接下来的一切。');
    }
    addLog('scene', lines);
  }

  /* ------------------------------------------------------------ 渲染 */
  function renderPanel() {
    const box = $('panel');
    clear(box);
    const p = E.panelOf(state);
    for (const k of Object.keys(p)) {
      const row = el('div', 'prow');
      row.appendChild(el('span', 'pk', k));
      row.appendChild(el('span', 'pv', String(p[k])));
      box.appendChild(row);
    }
    $('turnLabel').textContent = p['回合'];
    $('diffLabel').textContent = p['难度'];
  }

  function addLog(kind, lines) {
    const box = $('log');
    for (const line of [].concat(lines)) {
      if (line === undefined || line === null || line === '') continue;
      const d = el('div', 'line ' + kind, String(line));
      box.appendChild(d);
    }
    box.scrollTop = box.scrollHeight;
  }

  function renderChoices(choices) {
    const box = $('choices');
    clear(box);
    // 遭遇中不提供自定义入口：此刻必须做出选择，避免用描述性文本绕过判定
    $('footer').style.display = state && state.pending ? 'none' : '';
    if (state && state.over) {
      const b = el('button', 'btn primary', '重开一局');
      b.onclick = () => showMenu();
      box.appendChild(b);
      return;
    }
    if (!choices.length) {
      box.appendChild(el('div', 'muted', '（没有可选行动——请把存档贴回来继续）'));
      return;
    }
    choices.forEach((c, i) => {
      // 选项文字里已经写了「（生路）」的，不再重复追加标注
      const note = c.note && !c.label.includes('生路') ? c.note : '';
      const b = el('button', 'btn' + (c.note ? ' exit' : ''), (i + 1) + '｜ ' + c.label + note);
      b.onclick = () => onChoice(c.id);
      box.appendChild(b);
    });
    if (state.pending) {
      const hint = el('div', 'muted', '可观察线索：已掌握 ' + state.pending.revealedClues.length +
        ' 条，另有 ' + state.pending.clueHints + ' 条尚未掌握。线索越全，生路越明确。');
      box.appendChild(hint);
    }
  }

  function renderEncounter() {
    if (!state.pending) return;
    addLog('enc', '【遭遇】' + state.pending.name + '（' + state.pending.level + ' 级）');
    addLog('', state.pending.text);
    if (N) {
      const mood = N.encounterMood(state);
      if (mood) addLog('scene', mood);
    }
    if (state.pending.revealedClues.length) {
      addLog('clue', state.pending.revealedClues.map((c) => '· 你掌握的线索：' + c));
    } else {
      addLog('warn', '· 你对它一无所知——现在只能靠判断和运气。');
    }
  }

  function renderOver() {
    const o = state.over;
    const def = C.endings[o.ending] || { name: o.ending, text: '' };
    addLog('over', '【结局】' + def.name);
    addLog('over', def.text);
    addLog('', '存活 ' + state.turn + ' 天（第 ' + state.chapter + ' 章）。');
    // 跨局结算：统计、成就、周目点数（档案带校验和）
    if (P && profile && !o.settled) {
      o.settled = true;
      const r = P.settle(profile, state, o.ending);
      profile = r.profile;
      P.saveProfile(profile);
      addLog('muted', '【档案】本局获得周目点数 +' + r.points + '（累计可用 ' + profile.points + '）｜存活 ' +
        r.run.turn + ' 天｜生路存活 ' + r.run.escapes + ' 次｜触发玩法 ' + r.run.mechCount + ' 条');
      if (r.unlocked.length) {
        addLog('over', '【解锁成就】' + r.unlocked.map((a) => a.name + '（' + a.desc + '）').join('；'));
      }
      const prog = P.achievementProgress(profile);
      addLog('muted', '成就进度 ' + prog.unlocked + '/' + prog.total + '　结局收集 ' +
        Object.keys(profile.endings).length + '/' + Object.keys(C.endings).length);
    }
    const lv = state.contentLevel || 'A';
    if (lv !== 'A' && C.narrative['level' + lv]) {
      const bank = C.narrative['level' + lv];
      addLog('warn', bank[(state.turn + state.seedInt) % bank.length]);
    }
    const gallery = LS.get('rs_gallery', {});
    if (!gallery[o.ending]) {
      gallery[o.ending] = { times: 1, first: Date.now() };
      LS.set('rs_gallery', gallery);
    } else gallery[o.ending].times += 1, LS.set('rs_gallery', gallery);
  }

  async function onChoice(id, customText) {
    const rep = E.resolve(state, id, customText);
    if (rep.error) { addLog('warn', '【拒绝】' + rep.error); return; }
    // 叙事
    if (window.RS_AI.enabled && window.RS_AI.endpoint && rep.narrative.length) {
      try {
        const ai = await window.RS_AI.narrate({ world: C.meta.title, panel: rep.panel, action: id, settlement: rep.settlement });
        if (ai) { addLog('', ai); addLog('muted', '（本段剧情由 AI 润色；判定与数值以引擎为准）'); }
        else addLog('', rep.narrative);
      } catch (e) {
        addLog('', rep.narrative);
        addLog('warn', '（AI 叙事失败，已回退为引擎文本：' + e.message + '）');
      }
    } else {
      addLog('', rep.narrative);
    }
    // 行动结果变体句：让"每次休整都是同一句话"不再发生
    if (N && rep.actionVariant && !state.over) {
      const extra = N.actionLine(state, rep.actionVariant);
      if (extra) addLog('scene', extra);
    }
    if (rep.settlement && rep.settlement.length) addLog('set', rep.settlement.map((s) => '▸ ' + s));
    if (state.integrity.length) { addLog('warn', '【完整性告警】' + state.integrity.slice(-3).join(' / ')); }
    renderPanel();
    renderScene(false);
    renderEncounter();
    if (state.over) renderOver();
    renderChoices(rep.choices);
    autoSave();
  }

  /* ------------------------------------------------------------ 存档 */
  function autoSave() {
    // 只在「每天开始」这一干净边界自动存档（遭遇中途不覆盖，避免歧义）
    if (state && !state.over && state.phase === 'day' && !state.actionTakenToday) {
      LS.set('rs_autosave', E.serialize(state));
    }
  }
  function saveToFile() {
    const text = E.serialize(state);
    const blob = new Blob([text], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '神秘复苏-存档-第' + state.turn + '天.json';
    a.click();
    URL.revokeObjectURL(a.href);
  }
  function loadFromText(text) {
    const r = E.deserialize(String(text || '').trim());
    if (r.error) {
      addLog('warn', '【载入失败】' + r.error + '（存档被修改过，或被截断）');
      return false;
    }
    state = r.state;
    clear($('log'));
    addLog('', '【读档】第 ' + state.turn + ' 天（第 ' + state.chapter + ' 章），难度：' + (state.difficulty === 'hard' ? '极难' : '标准'));
    if (state.over) renderOver();
    renderPanel();
    lastSceneTurn = 0;
    renderScene(true);
    renderChoices(E.availableActions(state)); renderEncounter();
    return true;
  }

  /* ------------------------------------------------------------ 开局页 */
  function showMenu() {
    clear($('log'));
    $('panel').style.display = 'none';
    clear($('choices'));
    const box = $('choices');
    box.appendChild(el('div', 'sectionTitle', '选择难度（决定整局手感曲线）'));
    const diffRow = el('div', 'row');
    Object.keys(C.difficulties).forEach((id) => {
      const d = C.difficulties[id];
      const b = el('button', 'btn small' + (selected.difficulty === id ? ' on' : ''), d.name);
      b.onclick = () => { selected.difficulty = id; showMenu(); };
      diffRow.appendChild(b);
    });
    const cb = el('button', 'btn small' + (selected.difficulty === 'custom' ? ' on' : ''), '自定义');
    cb.onclick = () => { selected.difficulty = 'custom'; showMenu(); };
    diffRow.appendChild(cb);
    box.appendChild(diffRow);
    const cur = C.resolveTuning(selected.difficulty, selected.custom);
    box.appendChild(el('div', 'hint', cur.blurb));

    if (selected.difficulty === 'custom') {
      Object.keys(C.tuningKnobs).forEach((key) => {
        const knob = C.tuningKnobs[key];
        box.appendChild(el('div', 'sectionTitle', knob.label));
        const row = el('div', 'row');
        knob.options.forEach((op) => {
          const b = el('button', 'btn small' + (selected.custom[key] === op.id ? ' on' : ''), op.name);
          b.onclick = () => { selected.custom[key] = op.id; showMenu(); };
          row.appendChild(b);
        });
        box.appendChild(row);
      });
    }

    box.appendChild(el('div', 'sectionTitle', '选择开局'));
    for (const id of Object.keys(C.packs)) {
      const p = C.packs[id];
      const b = el('button', 'btn card' + (selected.pack === id ? ' on' : ''),
        p.name + '　—　' + p.blurb);
      b.onclick = () => { selected.pack = id; showMenu(); };
      box.appendChild(b);
    }

    box.appendChild(el('div', 'sectionTitle', '内容分级'));
    const lvRow = el('div', 'row');
    [['A', 'A 影视级（默认）'], ['B', 'B 写实级'], ['C', 'C 无限制']].forEach(([id, label]) => {
      const b = el('button', 'btn small' + (selected.level === id ? ' on' : ''), label);
      b.onclick = () => { selected.level = id; showMenu(); };
      lvRow.appendChild(b);
    });
    box.appendChild(lvRow);

    box.appendChild(el('div', 'sectionTitle', '随机种子（可选，同种子=同世界）'));
    const seedInput = el('input', 'input');
    seedInput.placeholder = '留空则随机';
    seedInput.value = selected.seed;
    seedInput.oninput = () => { selected.seed = seedInput.value.trim(); };
    box.appendChild(seedInput);

    const start = el('button', 'btn primary big', '开始游戏');
    start.onclick = () => startGame();
    box.appendChild(start);

    if (profile && P) {
      const prog = P.achievementProgress(profile);
      const endCount = Object.keys(profile.endings || {}).length;
      box.appendChild(el('div', 'sectionTitle', '玩家档案（跨局保存）'));
      const kv = el('div', 'hint');
      kv.textContent = '成就 ' + prog.unlocked + '/' + prog.total +
        '　｜　结局收集 ' + endCount + '/' + Object.keys(C.endings).length +
        '　｜　最佳存活 ' + (profile.best.turn || 0) + ' 天' +
        '　｜　总局数 ' + profile.runs.total + '（死亡 ' + profile.runs.died + '）' +
        '　｜　周目点数 ' + profile.points;
      box.appendChild(kv);
      const names = Object.keys(profile.endings || {})
        .map((k) => (C.endings[k] ? C.endings[k].name : k) + '×' + profile.endings[k]);
      box.appendChild(el('div', 'muted', '结局图鉴：' + (names.length ? names.join('、') : '暂无')));
      const unlockedNames = prog.list.filter((x) => x.unlocked).map((x) => x.name);
      box.appendChild(el('div', 'muted', '已解锁成就：' + (unlockedNames.length ? unlockedNames.join('、') : '暂无')));

      // 二周目：花点数换开局加成（只改初始值，写进本局存档参与校验和）
      if (profile.points > 0 && C.legacyOptions) {
        box.appendChild(el('div', 'sectionTitle', '二周目继承（本次开局生效，消耗周目点数）'));
        const row = el('div', 'row');
        const none = el('button', 'btn small' + (!selected.legacy ? ' on' : ''), '不带继承');
        none.onclick = () => { selected.legacy = null; showMenu(); };
        row.appendChild(none);
        Object.keys(C.legacyOptions).forEach((id) => {
          const leg = C.legacyOptions[id];
          const afford = profile.points >= leg.cost;
          const b = el('button', 'btn small' + (selected.legacy === id ? ' on' : ''),
            leg.name + '（' + leg.cost + ' 点）' + (afford ? '' : '·点数不足'));
          b.disabled = !afford;
          if (afford) b.onclick = () => { selected.legacy = id; showMenu(); };
          row.appendChild(b);
        });
        box.appendChild(row);
        const cur = selected.legacy && C.legacyOptions[selected.legacy];
        box.appendChild(el('div', 'hint', cur ? cur.desc : '继承只影响开局初始值，不参与任何判定公式。'));
      }
    } else {
      const gallery = LS.get('rs_gallery', {});
      const names = Object.keys(gallery).map((k) => (C.endings[k] ? C.endings[k].name : k) + '×' + gallery[k].times);
      box.appendChild(el('div', 'muted', '结局图鉴（' + Object.keys(gallery).length + '/' + Object.keys(C.endings).length + '）：' +
        (names.length ? names.join('、') : '暂无')));
    }
    const auto = LS.get('rs_autosave', null);
    if (auto) {
      const b = el('button', 'btn small', '继续上次的进度');
      b.onclick = () => loadFromText(auto); // 注意：LS.get 已经解过一次码，不能再 JSON.stringify
      box.appendChild(b);
    }
  }

  function startGame() {
    // 二周目继承：先校验点数（档案带校验和，改档会在载入时被拒）
    let legacy = null;
    if (selected.legacy && profile && P && C.legacyOptions[selected.legacy]) {
      const cost = C.legacyOptions[selected.legacy].cost;
      if (profile.points >= cost) {
        profile.points -= cost;
        legacy = selected.legacy;
        P.saveProfile(profile);
      } else {
        legacy = null;
      }
      selected.legacy = null; // 只对本次开局生效
    }
    state = E.createGame({
      pack: selected.pack, difficulty: selected.difficulty,
      custom: selected.difficulty === 'custom' ? selected.custom : null,
      seed: selected.seed || undefined, contentLevel: selected.level,
      legacy: legacy,
    });
    $('panel').style.display = '';
    clear($('log'));
    addLog('', '【开局】' + C.packs[selected.pack].blurb);
    // 继承提示必须写在 clear(log) 之后，否则会被清掉（玩家花了点数却看不到反馈）
    if (legacy) {
      addLog('', '【二周目继承】' + C.legacyOptions[legacy].name + '：' + C.legacyOptions[legacy].desc +
        '（已消耗 ' + C.legacyOptions[legacy].cost + ' 点，剩余 ' + (profile ? profile.points : 0) + ' 点）');
    }
    addLog('muted', '规则引擎 ' + C.meta.version + '　种子：' + state.seed + '　难度：' + (state.tuning ? state.tuning.name : '标准') +
      '　内容分级：' + ({ A: 'A 影视级', B: 'B 写实级', C: 'C 无限制' }[state.contentLevel] || 'A') +
      '（同一种子+同一串选择 = 同一结果；判定永不由运气之外的因素改变）');
    renderPanel();
    lastSceneTurn = 0;
    renderScene(true);
    renderChoices(E.availableActions(state));
  }

  /* ------------------------------------------------------- 内置工具面板 */
  /** 存档导入 / AI 设置都走页面内面板：不可用会锁死渲染线程的 prompt/alert */
  function openToolbox(mode) {
    const box = $('toolbox');
    clear(box);
    box.style.display = '';
    if (mode === 'load') {
      box.appendChild(el('div', 'sectionTitle', '导入存档（会被校验和检查，改过就打不开）'));
      const ta = el('textarea', 'input');
      ta.rows = 4;
      ta.placeholder = '把存档 JSON 整段粘贴到这里';
      box.appendChild(ta);
      const row = el('div', 'row');
      const go = el('button', 'btn small primary', '载入');
      go.onclick = () => { if (loadFromText(ta.value)) { box.style.display = 'none'; } };
      const cancel = el('button', 'btn small', '关闭');
      cancel.onclick = () => { box.style.display = 'none'; };
      row.appendChild(go); row.appendChild(cancel);
      box.appendChild(row);
    } else {
      renderAccountPanel(box);
    }
  }

  /* --------------------------------------------- 本机账户与 API 绑定面板 */
  const V = window.RSVault || null;

  function aiBadge() {
    if (!V || !V.hasVault()) return 'AI：未设账户';
    const u = V.userName();
    if (!V.isUnlocked()) return 'AI：' + u + '（未登录）';
    return 'AI：' + u + (V.hasAI() ? '（已绑定）' : '（未绑定）');
  }

  function refreshAIState() {
    const cfg = window.RS_AI;
    $('aiState').textContent = aiBadge();
    if (!V || !V.isUnlocked() || !V.hasAI()) {   // 未登录 / 未绑定 → 一律回到纯程序叙事
      cfg.enabled = false;
      cfg.endpoint = '';
      cfg.apiKey = '';
      return;
    }
    V.getAI().then((ai) => {
      if (!ai || ai.error) { cfg.enabled = false; return; }
      cfg.endpoint = ai.endpoint || '';
      cfg.apiKey = ai.apiKey || '';
      cfg.model = ai.model || 'deepseek-chat';
      cfg.enabled = !!cfg.endpoint;
      $('aiState').textContent = aiBadge();
    });
  }

  function note(el2, text, tone) {
    const n = el('div', 'hint', text);
    if (tone === 'warn') n.style.color = 'var(--danger)';
    if (tone === 'ok') n.style.color = 'var(--ok)';
    el2.appendChild(n);
    return n;
  }

  function renderAccountPanel(box) {
    if (!V) { note(box, '当前环境不支持本机账户（缺少 WebCrypto）', 'warn'); return; }
    box.appendChild(el('div', 'sectionTitle', 'AI 叙事需要绑定本机账户（API 配置会加密保存）'));
    note(box, '说明：本机账户只是把 API 配置用你的密码加密存在本地——没登录就看不到、改不了。' +
      '它挡得住同机翻 localStorage 与手改存档，挡不住能改页面代码或知道密码的人；也没有找回密码与跨设备同步（单文件本地游戏做不到）。');

    if (!V.hasVault()) {
      // ---- 状态一：未设账户 ----
      const u = el('input', 'input'); u.id = 'acc_user'; u.placeholder = '账户名（例如 baisonghao）';
      const p = el('input', 'input'); p.id = 'acc_pass'; p.type = 'password'; p.placeholder = '密码（至少 ' + V.MIN_PASS + ' 位）';
      const p2 = el('input', 'input'); p2.id = 'acc_pass2'; p2.type = 'password'; p2.placeholder = '再输一次密码';
      box.appendChild(u); box.appendChild(p); box.appendChild(p2);
      // 如果旧版本在档案里留过明文配置，这里带出来供一次性绑定
      const legacy = (profile && profile.ai && profile.ai.endpoint) ? profile.ai : null;
      const ep = el('input', 'input'); ep.id = 'ai_endpoint'; ep.placeholder = 'AI 接口地址（可留空，稍后再绑）';
      const k = el('input', 'input'); k.id = 'ai_apiKey'; k.type = 'password'; k.placeholder = 'API Key（可留空）';
      const m = el('input', 'input'); m.id = 'ai_model'; m.placeholder = '模型名';
      ep.value = legacy ? (legacy.endpoint || '') : '';
      k.value = legacy ? (legacy.apiKey || '') : '';
      m.value = (legacy && legacy.model) || 'deepseek-chat';
      box.appendChild(el('div', 'sectionTitle', '顺带绑定 AI 配置（可选）'));
      box.appendChild(ep); box.appendChild(k); box.appendChild(m);
      if (legacy) note(box, '检测到旧版本存在档案里的明文配置，已带出——绑定后我会把它从档案里删掉。');
      const row = el('div', 'row');
      const go = el('button', 'btn small primary', '创建账户并绑定');
      go.onclick = async () => {
        if (p.value !== p2.value) { note(box, '两次输入的密码不一致', 'warn'); return; }
        const ai = ep.value.trim() ? { endpoint: ep.value.trim(), apiKey: k.value.trim(), model: m.value.trim() || 'deepseek-chat' } : null;
        const r = await V.register(u.value, p.value, ai);
        if (r.error) { note(box, r.error, 'warn'); return; }
        // 绑定成功：清掉档案里的明文（如果有人看过，它就不该再留一份）
        if (legacy && P && profile) { profile.ai = { endpoint: '', apiKey: '', model: 'deepseek-chat', enabled: false }; P.saveProfile(profile); }
        refreshAIState();
        addLog('muted', '【账户】已创建本机账户「' + r.user + '」' + (r.bound ? '，AI 配置已加密绑定。' : '（尚未绑定 AI 配置）。'));
        box.style.display = 'none';
      };
      const cancel = el('button', 'btn small', '关闭');
      cancel.onclick = () => { box.style.display = 'none'; };
      row.appendChild(go); row.appendChild(cancel);
      box.appendChild(row);
      return;
    }

    // ---- 状态二：有账户但未登录 ----
    if (!V.isUnlocked()) {
      note(box, '本机账户：「' + V.userName() + '」' + (V.hasAI() ? '（已绑定 AI 配置，加密保存）' : '（未绑定 AI 配置）'));
      note(box, '未登录时 AI 配置不可见、不可改，游戏按纯程序叙事运行。', 'warn');
      const p = el('input', 'input'); p.id = 'acc_pass'; p.type = 'password'; p.placeholder = '输入账户密码';
      box.appendChild(p);
      const row = el('div', 'row');
      const go = el('button', 'btn small primary', '登录');
      go.onclick = async () => {
        const r = await V.unlock(p.value);
        if (r.error) { note(box, r.error, 'warn'); return; }
        refreshAIState();
        addLog('muted', '【账户】已登录「' + r.user + '」' + (r.bound ? '，AI 叙事已启用（密钥只在本页内存里，刷新需重新登录）。' : '，还未绑定 AI 配置。'));
        box.style.display = 'none';
      };
      p.addEventListener('keydown', (ev) => { if (ev.key === 'Enter') go.click(); });
      const cancel = el('button', 'btn small', '关闭');
      cancel.onclick = () => { box.style.display = 'none'; };
      row.appendChild(go); row.appendChild(cancel);
      box.appendChild(row);
      return;
    }

    // ---- 状态三：已登录，可查看/修改绑定 ----
    note(box, '已登录：「' + V.lockedUser() + '」。下面是绑定到该账户的 AI 配置（未绑定则留空）。', 'ok');
    const cur = { endpoint: '', apiKey: '', model: 'deepseek-chat' };
    const build = (ai) => {
      if (ai && !ai.error) { cur.endpoint = ai.endpoint || ''; cur.apiKey = ai.apiKey || ''; cur.model = ai.model || 'deepseek-chat'; }
      const ep = el('input', 'input'); ep.id = 'ai_endpoint'; ep.value = cur.endpoint; ep.placeholder = '接口地址（留空=不用 AI，回到程序叙事）';
      const k = el('input', 'input'); k.id = 'ai_apiKey'; k.type = 'password'; k.value = cur.apiKey; k.placeholder = 'API Key';
      const m = el('input', 'input'); m.id = 'ai_model'; m.value = cur.model;
      box.appendChild(ep); box.appendChild(k); box.appendChild(m);
      const row = el('div', 'row');
      const save = el('button', 'btn small primary', '保存到账户');
      save.onclick = async () => {
        const r = await V.putAI({ endpoint: ep.value, apiKey: k.value, model: m.value });
        if (r.error) { note(box, r.error, 'warn'); return; }
        refreshAIState();
        addLog('muted', '【账户】AI 配置已加密绑定到「' + V.userName() + '」。');
        box.style.display = 'none';
      };
      const unbind = el('button', 'btn small', '解绑');
      unbind.onclick = () => {
        const r = V.clearAI();
        if (r.error) { note(box, r.error, 'warn'); return; }
        refreshAIState();
        addLog('muted', '【账户】已解绑 AI 配置，回到纯程序叙事。');
        box.style.display = 'none';
      };
      const logout = el('button', 'btn small', '登出');
      logout.onclick = () => {
        V.lock();
        refreshAIState();
        addLog('muted', '【账户】已登出，AI 配置重新变为不可见。');
        box.style.display = 'none';
      };
      const del = el('button', 'btn small danger', '删除账户');
      del.onclick = async () => {
        const pw = (document.querySelector('#acc_delpass') || {}).value || '';
        const r = await V.destroy(pw);
        if (r.error) { note(box, r.error, 'warn'); return; }
        refreshAIState();
        addLog('muted', '【账户】本机账户已删除（含加密保存的 AI 配置）。');
        box.style.display = 'none';
      };
      const row2 = el('div', 'row');
      const dp = el('input', 'input'); dp.id = 'acc_delpass'; dp.type = 'password'; dp.placeholder = '删除账户需再输一次密码';
      const cancel = el('button', 'btn small', '关闭');
      cancel.onclick = () => { box.style.display = 'none'; };
      row.appendChild(save); row.appendChild(unbind); row.appendChild(logout); row.appendChild(cancel);
      box.appendChild(row);
      box.appendChild(el('div', 'sectionTitle', '危险操作'));
      box.appendChild(dp);
      const row3 = el('div', 'row');
      row3.appendChild(del);
      box.appendChild(row3);
    };
    V.getAI().then((ai) => build(ai && ai.error ? null : ai)).catch(() => build(null));
  }

  /* ------------------------------------------------------------ 初始化 */
  window.addEventListener('DOMContentLoaded', function () {
    $('btnSave').onclick = saveToFile;
    $('btnLoad').onclick = function () { openToolbox('load'); };
    $('btnCard').onclick = function () {
      const txt = E.serialize(state || E.createGame({}));
      addLog('muted', '【存档卡】' + txt.slice(0, 240) + '…（完整内容用「导出存档」保存）');
    };
    $('btnAI').onclick = function () { openToolbox('ai'); };
    $('btnCustom').onclick = function () {
      const v = $('customInput').value;
      if (!v.trim()) return;
      $('customInput').value = '';
      onChoice('__custom__', v);
    };
    refreshAIState();   // 刷新后一律回到"未登录"，AI 配置留在加密保管库里
    showMenu();
  });
})();
</script>
</body>
</html>
