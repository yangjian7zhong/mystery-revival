    { id: 'world_all', cat: 'collect', name: '四种世界', desc: '四种世界结局全部达成', cond: (c) => ['w_ruyu', 'w_golden', 'w_gate', 'w_rules', 'w_37'].every((k) => c.profile.endings[k]) },
    { id: 'fac_18', cat: 'collect', name: '百鬼夜行', desc: '跨局遭遇过全部 18 只厉鬼', cond: (c) => Object.keys(c.profile.faced || {}).length >= 18 },
    { id: 'know_20', cat: 'collect', name: '规律考据', desc: '跨局掌握 ≥20 条规律线索', cond: (c) => Object.keys(c.profile.knownClues || {}).length >= 20 },
    { id: 'know_all', cat: 'collect', name: '规律全录', desc: '跨局掌握 ≥55 条规律线索', cond: (c) => Object.keys(c.profile.knownClues || {}).length >= 55 },

    // —— 玩法 ——
    { id: 'polymath', cat: 'play', name: '玩法通', desc: '单局触发过 40 条不同玩法机制', cond: (c) => c.run.mechCount >= 40 },
    { id: 'polymath_60', cat: 'play', name: '机制大师', desc: '单局触发过 60 条不同玩法机制', cond: (c) => c.run.mechCount >= 60 },
    { id: 'gamble_3', cat: 'play', name: '赌徒', desc: '单局进鬼事赌局 ≥3 次', cond: (c) => actN(c, 'gamble') >= 3 },
    { id: 'marriage', cat: 'play', name: '成家', desc: '本局有了配偶', cond: (c) => !!c.state.wife },
    { id: 'children_2', cat: 'play', name: '儿女双全', desc: '本局有 ≥2 个孩子', cond: (c) => (c.state.children || 0) >= 2 },
    { id: 'social_5', cat: 'play', name: '关系网', desc: '维持 ≥5 段关系', cond: (c) => c.state.relationships && Object.keys(c.state.relationships).length >= 5 },
    { id: 'explore_20', cat: 'play', name: '走遍全城', desc: '单局自由探索 ≥20 次', cond: (c) => c.run.explores >= 20 },

    // —— 彩蛋 ——
    { id: 'firstday_death', cat: 'easter', name: '开局即终', desc: '第 1 天就结束（死得很快，也是一种记录）', cond: (c) => c.run.turn <= 1 && c.ending === 'dead' },
    { id: 'become_ghost', cat: 'easter', name: '复苏之鬼', desc: '侵蚀归零人性，自己变成鬼', cond: (c) => c.ending === 'p_fuxi' },
    { id: 'mad_oracle', cat: 'easter', name: '疯子先知', desc: '理智归零但还活着', cond: (c) => c.ending === 'p_mad' },
    { id: 'debt_end', cat: 'easter', name: '债主上门', desc: '因果值满，被鬼债收走', cond: (c) => c.ending === 'p_debtor' },
    { id: 'broke_20', cat: 'easter', name: '穷着活', desc: '活过 20 天时现金 ≤0', cond: (c) => c.run.turn >= 20 && c.run.cash <= 0 },
    { id: 'no_hit_30', cat: 'easter', name: '一次没挨过', desc: '存活 ≥30 天且从未被中性失败波及、从没死过', cond: (c) => c.run.turn >= 30 && c.run.neutralHits === 0 && c.run.erosion < 12 },
  ];

  // 统计小工具：老档案/合成数据里可能缺字段，一律当作 0 处理（缺字段不许把成就判定弄崩）
  function actN(c, id) { return ((c.run && c.run.actions) || {})[id] || 0; }
  function num(x) { return (typeof x === 'number' && isFinite(x)) ? x : 0; }

  // 所有条件统一兜底：抛错 = 未达成（lint 会逐个执行条件，抛错会被判为定义错误）
  for (const a of ACHIEVEMENTS) {
    const fn = a.cond;
    a.cond = function (c) { try { return !!fn(c); } catch (e) { return false; } };
  }

  /** 某个成就属于哪个分类（老档案里可能没有 cat 字段） */
  function achCat(id) {
    const a = ACHIEVEMENTS.find((x) => x.id === id);
    return a ? (a.cat || 'survive') : 'survive';
  }

  /* --------------------------------------------------- 单局统计与结算 */
  /** 从一局的状态里抽出用于成就与统计的数据 */
  function runSummary(state, ending) {
    const done = (state.events.done || []);
    const escapes = done.filter((x) => x.indexOf('escape:') === 0);
    const sEscapes = escapes.filter((x) => ['escape:qiaomen', 'escape:eshigui'].includes(x)).length;
    const encounters = done.filter((x) => x.indexOf('enc:') === 0).length;
    const shields = done.filter((x) => x.indexOf('shield:') === 0).length;
    const neutralHits = done.filter((x) => x.indexOf('hit:neutral') === 0).length;
    const actions = {};                 // act:<id> → 次数（老存档没有该前缀则为空表）
    let explodes = 0;
    for (const d of done) {
      if (typeof d !== 'string' || d.indexOf('act:') !== 0) continue;
      const id = d.slice(4);
      actions[id] = (actions[id] || 0) + 1;
      if (id.indexOf('probe_') === 0 || id.indexOf('city_') === 0) explodes += 1;
    }
    return {
      turn: state.turn,
      ending: ending || (state.over ? state.over.ending : null),
      difficulty: state.difficulty,
      escapes: escapes.length,
      sEscapes: sEscapes,
      contracts: state.contracts.length,
      maxGold: state.money.gold,
      mechCount: Object.keys(state.mechUsed || {}).length,
      clues: state.clues.length,
      erosion: state.stats.erosion,
      marks: state.flags.marks,
      // 第 21 轮新增（供扩充后的成就使用）
      encounters: encounters,
      shields: shields,
      neutralHits: neutralHits,
      actions: actions,
      explores: explodes,
      freezeUses: state.freezeUses || 0,
      godLayers: state.godLayers || 0,
      stealth: state.stats.stealth,
      humanity: state.stats.humanity,
      sanity: state.stats.sanity,
      calamity: state.stats.calamity,
      causality: state.stats.causality,
      cash: state.money.cash,
      safehouse: state.flags.safehouse || 0,
      contracts5: state.contracts.length,
      // 智慧级厉鬼（需接入 AI 才会遭遇）
      smartMeets: done.filter((x) => x.indexOf('smart:') === 0).length,
      smartTalks: done.filter((x) => x.indexOf('talk:') === 0).length,
      smartEscapes: done.filter((x) => x.indexOf('escape-smart:') === 0).length,
    };
  }

  /** 周目点数：存活天数 + 结局质量 + 难度系数（跨局成长的唯一来源） */
  function pointsFor(run) {
    const base = Math.floor(run.turn / 10);                     // 每活 10 天 1 点
    const endBonus = run.ending === 'dead' ? 0
      : (run.ending === 'p_fuxi' || run.ending === 'w_ruyu') ? 1 : 2; // 好结局多给
    const diffBonus = run.difficulty === 'nightmare' ? 3 : run.difficulty === 'hardcore' ? 2 : 0;
    const escapeBonus = Math.min(2, run.escapes);
    // 下限 1：哪怕开局即死也留下 1 点，否则新手连死几局永远看不到周目成长
    return Math.max(1, base + endBonus + diffBonus + escapeBonus);
  }

  /**
   * 结算一局：更新统计、解锁成就、发放周目点数。
   * 返回 { profile, unlocked:[{id,name,desc}], points, run }
   */
  function settle(profile, state, ending) {
    const p = merge(empty(), profile);
    const run = runSummary(state, ending);
    const eid = run.ending || 'unfinished';

    p.runs.total += 1;
    if (eid === 'dead') p.runs.died += 1;
    if (eid && eid !== 'dead' && eid !== 'unfinished') p.runs.won += 1;
    const d = run.difficulty || 'standard';
    p.runs.byDiff[d] = (p.runs.byDiff[d] || 0) + 1;
    p.best.turn = Math.max(p.best.turn || 0, run.turn);
    p.best.byDiff[d] = Math.max(p.best.byDiff[d] || 0, run.turn);
    if (eid && eid !== 'unfinished') p.endings[eid] = (p.endings[eid] || 0) + 1;

    // 图鉴（第 20 轮）：把本局遭遇过的厉鬼、掌握过的规律线索并进档案，跨局累积。
    // 只做记录，不参与任何判定公式，也不改变周目点数。
    if (!p.faced) p.faced = {};
    if (!p.knownClues) p.knownClues = {};
    if (!p.escaped) p.escaped = {};
    for (const d of (state.events && state.events.done) || []) {
      if (typeof d !== 'string') continue;
      if (d.indexOf('enc:') === 0) p.faced[d.slice(4)] = true;
      if (d.indexOf('escape:') === 0) {
        const gid = d.slice(7);
        p.escaped[gid] = (p.escaped[gid] || 0) + 1;
      }
    }
    for (const c of state.clues || []) p.knownClues[c] = true;

    const pts = pointsFor(run);
    p.points += pts;
    p.earned += pts;

    const unlocked = [];
    const ctx = { state: state, profile: p, run: run, ending: eid };
    for (const a of ACHIEVEMENTS) {
      if (p.achievements[a.id]) continue;
      let ok = false;
      try { ok = !!a.cond(ctx); } catch (e) { ok = false; }
      if (ok) {
        p.achievements[a.id] = { turn: run.turn, at: Date.now() };
        unlocked.push({ id: a.id, name: a.name, desc: a.desc });
      }
    }
    return { profile: p, unlocked: unlocked, points: pts, run: run };
  }

  function achievementProgress(profile) {
    const p = merge(empty(), profile);
    const list = ACHIEVEMENTS.map((a) => ({
      id: a.id, cat: a.cat || 'survive', name: a.name, desc: a.desc, unlocked: !!p.achievements[a.id],
      at: p.achievements[a.id] ? p.achievements[a.id].at : null,
    }));
    const byCat = ACH_CATS.map((c) => {
      const items = list.filter((x) => x.cat === c.id);
      return { id: c.id, name: c.name, desc: c.desc, total: items.length,
        unlocked: items.filter((x) => x.unlocked).length };
    });
    return { list: list, byCat: byCat, cats: ACH_CATS,
      unlocked: list.filter((x) => x.unlocked).length, total: list.length };
  }

  /* --------------------------------------------------------- 存取（浏览器） */
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  function loadProfile() {
    const raw = lsGet(KEY);
    if (!raw) {
      // 首次：迁移旧版结局图鉴
      const p = empty();
      const gal = lsGet(GALLERY_KEY);
      if (gal) {
        try {
          const g = JSON.parse(gal);
          for (const k of Object.keys(g || {})) p.endings[k] = (g[k] && g[k].times) || 1;
        } catch (e) {}
      }
      return { profile: p, migrated: !!gal };
    }
    const r = decode(raw);
    if (r.error) return { profile: empty(), error: r.error };
    return { profile: r.profile };
  }

  function saveProfile(profile) {
    lsSet(KEY, encode(profile));
    return encode(profile);
  }

  return {
    KEY: KEY,
    GALLERY_KEY: GALLERY_KEY,
    empty: empty,
    encode: encode,
    decode: decode,
    checksum: checksum,
    achievements: ACHIEVEMENTS,
    achievementCats: ACH_CATS,
    achCat: achCat,
    runSummary: runSummary,
    pointsFor: pointsFor,
    settle: settle,
    achievementProgress: achievementProgress,
    loadProfile: loadProfile,
    saveProfile: saveProfile,
  };
});
</script>

  /* ------------------------------------------------------------ 取句逻辑 */
  const u32 = (x) => x >>> 0;
  function hashStr(s) {
    let h = 0x811c9dc5;
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193); }
    return u32(h);
  }

  // 近期用过的句子：按种子分桶，只记录「本轮更早回合」用过的句子。
  // 这样同一 (种子, 回合) 无论调用几次都取到同一句（确定性不被破坏），
  // 同时又能避免相邻回合重复读到同一句。纯文本记忆，重载即清空。
  const WINDOW = 12;              // 约 12 个回合内不重复
  const memory = new Map();       // seed → Map(line → 最后一次使用的回合)

  function memFor(seed) {
    let m = memory.get(seed);
    if (!m) { m = new Map(); memory.set(seed, m); }
    if (m.size > 600) { Array.from(m.keys()).slice(0, 200).forEach((k) => m.delete(k)); }
    return m;
  }
  function usedRecently(m, line, turn) {
    const prev = m.get(line);
    return prev !== undefined && prev < turn && (turn - prev) < WINDOW;
  }

  /** 轮转取句：同库内按 seed 定偏移 + turn 递增；若命中近期用过的句子就往后跳 */
  function pick(bank, state, salt) {
    const arr = B[bank];
    if (!arr || !arr.length) return '';
    const off = hashStr(String(state.seed || '') + ':' + bank);
    const base = (off + (state.turn || 0) + (salt || 0)) % arr.length;
    const m = memFor(String(state.seed || ''));
    const turn = state.turn || 0;
    let line = arr[base];
    for (let k = 1; k <= 3 && usedRecently(m, line, turn); k++) {
      line = arr[(base + k) % arr.length];
    }
    m.set(line, turn);
    return line;
  }

  /** 多句不重复取（同一回合内要两句时用） */
  function pickN(bank, state, n, salt) {
    const arr = B[bank];
    const out = [];
    if (!arr || !arr.length) return out;
    for (let k = 0; k < n && k < arr.length; k++) {
      const off = hashStr(String(state.seed || '') + ':' + bank + ':' + k);
      out.push(arr[(off + (state.turn || 0) + (salt || 0)) % arr.length]);
    }
    return out;
  }

   * 一回合的场景描写：时段天气 + 场所 + 感官/异象 + 状态反应（0~3 句）+ 分级句

    const lines = [];
    const tags = [];
    // 第 20 轮：先给两段成段叙事（读感），再给短句（信息）
    const open = prose(s, 'dayOpen', 2, state.__ctx);
    open.forEach(function (x) { lines.push(x); tags.push('dayOpen'); });
    lines.push(pick('timeOfDay', s) + '，' + pick('weather', s) + '。'); tags.push('timeOfDay', 'weather');
    lines.push(pick('place', s)); tags.push('place');
    // 第 13 轮：加厚——环境细节 + 时期感 + 地点专属细节（带库就取，没有就跳过）
    if (B.dayDetail) { pickN('dayDetail', s, 3, 4).forEach((x) => lines.push(x)); tags.push('dayDetail'); }
    const eraBank = 'era_' + (s.era || '');
    if (B[eraBank]) { pickN(eraBank, s, 2, 1).forEach((x) => lines.push(x)); tags.push(eraBank); }
    const placeBank = 'place_' + (s.place || '');
    if (B[placeBank]) { pickN(placeBank, s, 2, 2).forEach((x) => lines.push(x)); tags.push(placeBank); }
    if (B.crowd) { lines.push(pick('crowd', s, 5)); tags.push('crowd'); }
    if (B.innerThought) { lines.push(pick('innerThought', s, 6)); tags.push('innerThought'); }

    else if (s.stats.stealth >= 75) reactive.push(['highStealth', pick('highStealth', s)]);
    if (s.clues.length >= 6) reactive.push(['intel', pick('intel', s)]);
    if (s.contracts.length >= 1 && s.turn % 3 === 0) reactive.push(['contract', pick('contract', s)]);
    const chosen = reactive.slice(0, 2);
    for (const [tag, line] of chosen) { lines.push(line); tags.push(tag); }

    // 一切正常时给一句"平静"的话，避免正文太干
    if (!chosen.length && !s.pending) { lines.push(pick('safe', s)); tags.push('safe'); }

    // 内容分级：只影响文字强度
    const lv = s.contentLevel || 'A';
    if (lv === 'B') { lines.push(pick('levelB', s)); tags.push('levelB'); }
    else if (lv === 'C') { lines.push(pick('levelC', s)); tags.push('levelC'); }

    // 第 20 轮：结尾收一段，把"今天该动了"这件事说清楚，然后才交给选项
    const close = prose(s, 'dayClose', 1, s.__ctx);
    close.forEach(function (x) { lines.push(x); tags.push('dayClose'); });

    return { lines: lines, tags: tags };
  }

  /** 行动结果变体句（引擎给出 variant key，这里取对应库） */
  function actionLine(state, variant) {
    const bank = 'act_' + (variant || 'custom');
    if (!B[bank]) {
      // 本地专属行动（act_<行动>）等没有专属库时：先试该城的专属库，再退通用句，而不是整段消失
      const cityBank = state && state.city ? 'act_city_' + state.city : null;
      if (cityBank && B[cityBank]) return pick(cityBank, state);
      if (B.act_city) return pick('act_city', state);
      return B.act_normal ? pick('act_normal', state) : '';
    }
    return pick(bank, state);
  }

  /** 遭遇氛围句：随"掌握线索条数"变化，让同一只鬼的遭遇读起来不一样 */
  function encounterMood(state) {    const p = state.pending;
    if (!p) return '';
    const known = (p.revealedClues || []).length;
    if (known === 0) return '你对它一无所知。所有判断都只能靠眼前这一点东西。';
    if (known === 1) return '你掌握的线索让它的轮廓清楚了一点——只有一点。';
    if (known === 2) return '你知道它的规矩了，至少知道两条。';
    return '它的规律在你脑子里几乎连成了一条线。';
  }

  /** 世界事件开场白 */
  function eventLine(state) {
    const ev = (state.__evLabel) || '';
    return ev ? '接下来的一切都会围着「' + ev + '」转。' : '';
  }

  /** 供测试统计：素材库规模与条目 */
  function stats() {
    const out = {};
    for (const k of Object.keys(B)) out[k] = B[k].length;
    return out;
  }

  /** 第 15 轮：行动过程（"你是怎么做的"，接在行动结果之前） */
  function actionProcess(state, actionId) {
    const id = String(actionId || '').replace(/^city_/, 'city').replace(/^probe_/, 'probe');
    const bank = 'proc_' + (id === 'city' ? 'investigate' : (id === 'probe' ? 'investigate' : id));
    // 第 20 轮：从 2 句加到 3 句（用户反馈"剧情描述玩起来好少"）
    if (B[bank]) return pickN(bank, state, 3, 3);
    return B.proc_investigate ? pickN('proc_investigate', state, 2, 5) : [];
  }

  /** 第 15 轮：身体状态段（按侵蚀/理智/体力/污染取一句） */
  function bodyState(state) {
    if (!B.bodyState) return '';
    return pick('bodyState', state, 2);
  }

  /** 第 15 轮：遭遇时那只鬼在做什么 */
  function encounterAct(state) {
    return B.encounterAct ? pick('encounterAct', state, 3) : '';
  }

  /** 第 13 轮：遭遇的感官细节（接在遭遇正文之后，让场景"可感知"） */
  function encounterSense(state) {
    return B.encounterSense ? pick('encounterSense', state) : '';
  }

  /** 第 13 轮：行动之后的余波（1~2 句，让"做完了"这件事有下文） */
  function aftermath(state, n) {
    if (!B.aftermath) return [];
    return pickN('aftermath', state, n || 1, 7);
  }

  /* ------------------------------------------- 第 20 轮：成段叙事（长段落）
   * 用户反馈：「剧情描述玩起来好少」「你确定是八百字」。
   * 实测过：一回合由 12 条短句组成（每条 30~40 字），合计只有 230~440 字，
   * 短句适合承载信息（线索、状态、异象），但读起来是"条目"不是"小说"。

  // 注册进句库，复用 pick/pickN 的种子轮转（前缀 p_ 便于测试统计区分）
  for (const k of Object.keys(PROSE)) B['p_' + k] = PROSE[k];

  /** 段落槽位替换：{time} {weather} {city} {era} {ghost} {day} {clues} */
  function fill(tpl, state, ctx) {
    const s = state || {};
    const c = ctx || {};
    const one = function (bank) {
      const arr = SLOT[bank];
      if (!arr) return '';
      return arr[hashStr(String(s.seed || '') + ':' + bank + ':' + (s.turn || 0)) % arr.length];
    };
    const ghost = (s.pending && s.pending.name) || c.ghost || (s.lastGhostName || '那只鬼');
    return String(tpl)
      .replace(/\{time\}/g, c.time || one('time'))
      .replace(/\{weather\}/g, c.weather || one('weather'))
      .replace(/\{city\}/g, c.city || '这座城市')
      .replace(/\{era\}/g, c.era || '这个时代')
      .replace(/\{ghost\}/g, ghost)
      .replace(/\{day\}/g, '第 ' + (s.turn || 0) + ' 天')
      .replace(/\{clues\}/g, String(((s.clues || []).length)));
  }

  /** 取 n 个段落（已填充槽位）。kind: dayOpen / dayClose / actionProse / encProse / encClose */
  function prose(state, kind, n, ctx) {
    const bank = 'p_' + kind;
    if (!B[bank]) return [];
    const salt = { dayOpen: 21, encProse: 22, encResolve: 24, deathProse: 25, actionClose: 26 }[kind] || 23;
    return pickN(bank, state, n || 1, salt).map(function (x) { return fill(x, state, ctx); });
  }

  return {
    banks: B,
    prose: prose,
    fill: fill,
    proseBanks: PROSE,
    scene: scene,
    actionProcess: actionProcess,
    bodyState: bodyState,
    encounterAct: encounterAct,

<script>/* ============================================================================
 * 神秘复苏模拟器 · 本机账户与密钥保管库（vault）
 * ----------------------------------------------------------------------------
 * 目的：把 AI 的 API 配置绑定到本机账户上——没登录看不见、改不了。
 *
 * 做法：密码 → PBKDF2-SHA256（25 万次）派生密钥 → AES-GCM 加密 AI 配置，
 *       只把「盐 + 密文」写进 localStorage；密码本身不落盘。
 *       AES-GCM 自带完整性校验：密文被改动会解密失败（不是静默出错）。
 *
 * 能防住什么：同机其他人翻 localStorage / 手改存档 / 误改配置。
 * 防不住什么：能改页面 JS 的人、知道密码的人、以及"密码本身太弱"被爆破。
 * 没有的东西：找回密码、跨设备同步、服务端身份校验——单文件本地游戏做不到。
 * ==========================================================================*/
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.RSVault = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  const KEY = 'rs_vault';
  const ITER = 250000;
  const CHECK_PLAIN = 'rs-vault-check-v1';
  const MIN_PASS = 6;

  const enc = new TextEncoder();
  const dec = new TextDecoder();

  function b64(buf) {
    const bytes = new Uint8Array(buf);
    let s = '';
    for (let i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
    return (typeof btoa === 'function') ? btoa(s) : Buffer.from(bytes).toString('base64');
  }
  function unb64(str) {
    let s;
    if (typeof atob === 'function') { s = atob(str); }
    else { s = Buffer.from(str, 'base64').toString('binary'); }
    const out = new Uint8Array(s.length);
    for (let i = 0; i < s.length; i++) out[i] = s.charCodeAt(i);
    return out;
  }
  function subtle() {
    const c = (typeof crypto !== 'undefined' && crypto.subtle) ? crypto.subtle
      : (typeof globalThis !== 'undefined' && globalThis.crypto && globalThis.crypto.subtle) ? globalThis.crypto.subtle : null;
    if (!c) throw new Error('当前环境没有 WebCrypto，无法加密保存');
    return c;
  }
  function rand(n) {
    const a = new Uint8Array(n);
    if (typeof crypto !== 'undefined' && crypto.getRandomValues) crypto.getRandomValues(a);
    else globalThis.crypto.getRandomValues(a);
    return a;
  }

  async function deriveKey(pass, salt, iter) {
    const base = await subtle().importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveKey']);
    return subtle().deriveKey(
      { name: 'PBKDF2', salt: salt, iterations: iter || ITER, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  }
  async function encrypt(key, obj) {
    const iv = rand(12);
    const ct = await subtle().encrypt({ name: 'AES-GCM', iv: iv }, key, enc.encode(JSON.stringify(obj)));
    return { iv: b64(iv), ct: b64(ct) };
  }
  async function decrypt(key, box) {
    const iv = unb64(box.iv), ct = unb64(box.ct);
    const plain = await subtle().decrypt({ name: 'AES-GCM', iv: iv }, key, ct);
    return JSON.parse(dec.decode(plain));
  }

  /* --------------------------------------------------------------- 存取 */
  function lsGet() {
    try { return localStorage.getItem(KEY); } catch (e) { return null; }
  }
  function lsSet(v) { try { localStorage.setItem(KEY, v); } catch (e) {} }
  function lsDel() { try { localStorage.removeItem(KEY); } catch (e) {} }

  function read() {
    const raw = lsGet();
    if (!raw) return null;
    try {
      const v = JSON.parse(raw);
      if (!v || v.v !== 1 || !v.salt || !v.check) return null;
      return v;
    } catch (e) { return null; }
  }
  function write(v) { lsSet(JSON.stringify(v)); }

  /* --------------------------------------------------------------- 会话 */
  let sessionKey = null;   // 只在内存里，刷新即失效（这正是"必须登录"的含义）
  let sessionUser = null;

  function hasVault() { return !!read(); }
  function userName() { const v = read(); return v ? v.user : null; }
  function isUnlocked() { return !!sessionKey; }
  function lockedUser() { return sessionUser; }

  /** 首次使用：创建账户并把 AI 配置加密绑定进去 */
  async function register(user, pass, initialAI) {
    user = String(user || '').trim();
    pass = String(pass || '');
    if (user.length < 2) return { error: '账户名至少 2 个字符' };
    if (pass.length < MIN_PASS) return { error: '密码至少 ' + MIN_PASS + ' 位' };
    if (hasVault()) return { error: '本机已存在账户，请直接登录（或先用原密码删除账户）' };
    const salt = rand(16);
    const key = await deriveKey(pass, salt);
    const v = {
      v: 1, user: user, salt: b64(salt), iter: ITER,
      check: await encrypt(key, CHECK_PLAIN),
      ai: initialAI ? await encrypt(key, initialAI) : null,
    };
    write(v);
    sessionKey = key;
    sessionUser = user;
    return { ok: true, user: user, bound: !!v.ai };
  }

  /** 登录：密码不对 → 解密校验块失败 */
  async function unlock(pass) {
    const v = read();
    if (!v) return { error: '本机还没有账户' };
    try {
      const key = await deriveKey(String(pass || ''), unb64(v.salt), v.iter);
      const check = await decrypt(key, v.check);
      if (check !== CHECK_PLAIN) return { error: '密码不正确' };
      sessionKey = key;
      sessionUser = v.user;
      return { ok: true, user: v.user, bound: !!v.ai };
    } catch (e) {
      return { error: '密码不正确' };   // AES-GCM 校验失败也落在这里
    }
  }

  function lock() { sessionKey = null; sessionUser = null; return { ok: true }; }

  /* ----------------------------------------------------------- AI 绑定 */
  async function putAI(ai) {
    const v = read();
    if (!v) return { error: '本机还没有账户，请先创建' };
    if (!sessionKey) return { error: '需要登录后才能修改绑定的 API 配置' };
    v.ai = await encrypt(sessionKey, {
      endpoint: String(ai.endpoint || '').trim(),
      apiKey: String(ai.apiKey || ''),
      model: String(ai.model || 'deepseek-chat').trim(),
    });
    write(v);
    return { ok: true };
  }

  function hasAI() { const v = read(); return !!(v && v.ai); }

  function getAI() {
    if (!sessionKey) return { error: '未登录：查看或修改 API 配置需要先登录账户' };
    const v = read();
    if (!v || !v.ai) return null;      // 已登录但还没绑定
    return decrypt(sessionKey, v.ai).then((ai) => ai).catch(() => ({ error: '密文校验失败（保管库被改动过）' }));
  }

  function clearAI() {
    const v = read();
    if (!v) return { error: '本机还没有账户' };
    if (!sessionKey) return { error: '需要登录后才能解绑' };
    v.ai = null;
    write(v);
    return { ok: true };
  }

  /** 删除账户（需原密码验证） */
  async function destroy(pass) {
    const v = read();
    if (!v) return { error: '本机还没有账户' };
    const r = await unlock(pass);
    if (r.error) return r;
    lsDel();
    sessionKey = null;
    sessionUser = null;
    return { ok: true };
  }

  return {
    KEY: KEY,
    MIN_PASS: MIN_PASS,
    ITER: ITER,
    hasVault: hasVault,
    userName: userName,
    isUnlocked: isUnlocked,
    lockedUser: lockedUser,
    hasAI: hasAI,
    register: register,
    unlock: unlock,
    lock: lock,
    putAI: putAI,
    getAI: getAI,
    clearAI: clearAI,
    destroy: destroy,
    // 仅测试用
    _internals: { deriveKey: deriveKey, encrypt: encrypt, decrypt: decrypt, b64: b64, unb64: unb64 },
  };
});
</script>
<script>/* ============================================================================
 * 神秘复苏模拟器 · 界面层
 * ----------------------------------------------------------------------------
 * 原则：
 *  - 界面只读引擎状态，绝不参与判定；玩家无法在界面上输入任何数值。
 *  - 所有文本经 textContent 注入（不拼 HTML），自定义输入先剥离尖括号。
 *  - 预留 AI 叙事接口 window.RS_AI：AI 只写【剧情叙事】，判定与数值一律以引擎为准，
 *    AI 返回的任何数值声明都会被忽略。
 * ==========================================================================*/
(function () {
  'use strict';

  const E = window.RSEngine;
  const C = window.RSContent;
  const P = window.RSProfile || null;
  let profile = P ? P.loadProfile().profile : null;

  const LS = {
    get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  };

  /* ------------------------------------------------------------ AI 接口 */
  window.RS_AI = window.RS_AI || {
    enabled: false,
    endpoint: '',
    apiKey: '',
    model: '',
    /** 只负责把引擎给的机械结果润色成剧情文字；不得改动任何数值 */
    async narrate(payload) {
      if (!this.enabled || !this.endpoint) return null;
      let sys = '你是恐怖互动小说的叙事者。只输出【剧情叙事】段落，' +
        '禁止输出任何数值、状态、公式、选项；禁止替玩家做决定；禁止修改判定结果。';
      let ask = '写 120~220 字的中文剧情，压抑、克制、不写爽文。';
      // 第 21 轮：智慧级厉鬼——AI 要扮演它本人（思维、说话方式、能力），而不是旁白
      if (payload.ghost) {
        const g = payload.ghost;
        sys = '你在扮演一只"有智慧的厉鬼"，它不是背景板，是一个有明确思维方式和说话习惯的对手。\n' +
          '身份：' + g.who + '\n' +
          '它的思维方式：' + g.think + '\n' +
          '它的说话方式（必须严格照这个语感写）：' + g.speak + '\n' +
          '它的能力（它可以主动使用，但不得凭空扩大范围）：' + (g.abilities || []).join('、') + '\n' +
          '它的禁忌（踩到就会立刻翻脸）：' + g.taboo + '\n' +
          '它可以谈的条件：' + g.deal + '\n' +
          '硬性约束：① 你只能写这只鬼说的话和它制造的动静，不要替玩家行动、不要替玩家做决定；' +
          '② 不得输出任何数值、状态、公式、选项、提示；③ 不得宣称玩家已经死亡或已经安全——判定由引擎做；' +
          '④ 用它的语感说 80~200 字，可以反问、可以沉默、可以答非所问，但必须像"它"，不要像旁白。';
        ask = '玩家对它说了/做了：' + (payload.playerSpeech || payload.action || '（沉默）') +
          '　引擎判定（不要复述）：' + (payload.settlement || []).join('；') +
          '　请用它的口吻回应玩家，80~200 字。';
      }
      const user = JSON.stringify({
        世界: payload.world, 状态: payload.panel, 玩家行动: payload.action,
        引擎判定: payload.settlement, 要求: ask,
      });
      const res = await fetch(this.endpoint, {
        method: 'POST',
        headers: Object.assign({ 'Content-Type': 'application/json' },
          this.apiKey ? { Authorization: 'Bearer ' + this.apiKey } : {}),
        body: JSON.stringify({
          model: this.model || 'deepseek-chat',
          messages: [{ role: 'system', content: sys }, { role: 'user', content: user }],
          temperature: payload.ghost ? 0.9 : 0.8,
        }),
      });
      if (!res.ok) throw new Error('AI 接口返回 ' + res.status);
      const data = await res.json();
      const txt = data && data.choices && data.choices[0] && data.choices[0].message
        ? data.choices[0].message.content : '';
      return txt ? String(txt).replace(/[【】]/g, '').slice(0, 900) : null;
    },
  };

  /* -------------------------------------------------------------- 状态 */
  let state = null;
  let selected = {
    difficulty: 'standard', pack: 'ordinary', level: 'A', seed: '',
    city: 'random', era: 'random',
    custom: { encounter: 'normal', judge: 'normal', mercy: 'normal' },
    legacy: null,
  };

  const $ = (id) => document.getElementById(id);
  function el(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  }
  function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }

  /* ------------------------------------------------------------ 场景文本 */
  const N = window.RSNarrative || null;

  /** 本时期的"世界时钟"（时期不同，主线厉鬼序列就不同）；老存档无时期 → 退回原著 2018 */
  function eraClock(s) {
    const era = (C.eras && C.eras[s && s.era]) || null;
    return (era && era.events && era.events.length) ? era.events : C.worldClock;
  }
  function cityInfo(s) {
    return (C.cities && C.cities[s && s.city]) || null;
  }
  function eraInfo(s) {
    return (C.eras && C.eras[s && s.era]) || null;
  }

  /** 段落槽位用的上下文（城市名/时期名），供 narrative 的长段落替换 {city}/{era} */
  function ctxOf(s) {
    const c = cityInfo(s);
    const e = eraInfo(s);
    return { city: c ? c.name : '', era: e ? e.name : '' };
  }

  /* --------------------------------------------- 智慧级厉鬼（第 21 轮）
   * 需要绑定 AI 接口才会遭遇：AI 扮演它本人（思维 / 说话方式 / 能力），
   * 但判定与数值仍然全部由引擎做——对话只改叙事，不改结果。
   */
  function aiReady() {
    return !!(window.RS_AI && window.RS_AI.enabled && window.RS_AI.endpoint);
  }
  /** 每次调用引擎前把"是否接了 AI"同步给 state（不进存档，只影响智慧级是否入池） */
  function syncAI(s) {
    if (s) s.aiOn = aiReady();
    return s;
  }
  function isSmartPending(s) {
    return !!(s && s.pending && s.pending.smart);
  }

  /** 让 AI 用这只鬼的口吻说话（遭遇开场 / 玩家说完话之后各调一次） */
  async function aiGhostSpeak(pending, playerSpeech) {
    if (!pending || !pending.smart || !aiReady()) return;
    const g = (C.ghosts && C.ghosts[pending.ghost]) || null;
    if (!g || !g.persona) return;
    try {
      const line = await window.RS_AI.narrate({
        world: C.meta.title,
        panel: state ? E.panelOf(state) : null,
        action: playerSpeech ? '（玩家对它说话）' : '（它先开口）',
        settlement: [],
        ghost: Object.assign({ name: g.name }, g.persona),
        abilities: g.abilities || [],
        playerSpeech: playerSpeech || '',
      });
      if (line) {
        addLog('say ghost', '【' + g.name + '】' + line);
        renderNow();
      }
    } catch (e) {
      addLog('warn', '（它的回应没接上：' + (e && e.message ? e.message : '接口错误') + '。判定照常进行。）');
    }
  }

  /** 场景描写：优先用叙事生成器（组合 + 轮转 + 状态反应），没有则退回素材库 */
  function sceneLines(s) {
    if (N) {
      s.__ctx = ctxOf(s);
      const r = N.scene(s);
      const clock = eraClock(s);
      const ev = clock.filter((e) => e.turn <= s.turn).slice(-1)[0];
      if (ev && s.turn - ev.turn <= 2) r.lines.push('【世界事件】' + ev.label + ' 正在进行。');
      const era = eraInfo(s);
      if (era && s.turn === 1) r.lines.push('【时期】' + era.name + '——' + era.desc);
      const city = cityInfo(s);
      if (city && s.turn === 1) r.lines.push('【落地】' + city.name + '（' + city.src + '）——' + city.desc);
      // 第 15 轮：加一段"身体现在是什么感觉"，让每天的场景更完整
      if (N.bodyState) { const bd = N.bodyState(s); if (bd) r.lines.push(bd); }
      return r.lines;
    }
    const n = C.narrative;
    const out = [];
    out.push(n.timeOfDay[(s.turn * 3 + s.seedInt) % n.timeOfDay.length] + '，' +
      n.weather[(s.turn * 7 + s.seedInt) % n.weather.length] + '。');
    out.push(n.city[(s.turn + s.seedInt) % n.city.length]);
    return out;
  }

  let lastSceneTurn = 0;

  /** 每天开始时输出一次氛围与事件提示（同一天不重复） */
  function renderScene(force) {
    if (!state || state.over) return;
    if (!force && lastSceneTurn === state.turn) return;
    lastSceneTurn = state.turn;
    const lines = sceneLines(state);
    const startEv = eraClock(state).find((e) => e.turn === state.turn);
    if (startEv) {
      addLog('event', '════ 【重大事件】' + startEv.label + ' ════');
      addLog('event', '你正在被卷进去。它不是背景，它是接下来的一切。');
    }
    addLog('scene', lines);
  }

  /* ------------------------------------------------------------ 渲染 */
  function renderPanel() {
    const box = $('panel');
    clear(box);
    const p = E.panelOf(state);
    for (const k of Object.keys(p)) {
      const row = el('div', 'prow');
      row.appendChild(el('span', 'pk', k));
      row.appendChild(el('span', 'pv', String(p[k])));
      box.appendChild(row);
    }
    $('turnLabel').textContent = p['回合'];
    $('diffLabel').textContent = p['难度'];
  }

  /* ------------------------------------------------------ 剧情流（第 12 轮）
   * 手机端问题：「点完选项不知道上面还有故事」。
   * 解法：① 新剧情永远自动滚到可见处；② 本轮新增的行同时渲染到紧贴选项的「刚刚发生」卡片；
   *      ③ 选完先只给一个「继续」按钮，玩家读完结果再进下一步，不再"一跳就到下一个选择"。
   */
  let lastLines = [];        // 本轮新增的行（供「刚刚发生」卡片）
  let nowLineCount = 0;
  let dayStoryShown = false; // 第 20 轮：新一天的剧情是否已经单独读过一遍

  function scrollLog() {
    const box = $('logWrap');
    if (!box) return;
    box.scrollTop = box.scrollHeight;
    const j = $('jumpNew');
    if (j) j.style.display = 'none';
  }

  function addLog(kind, lines, opts) {
    const box = $('log');
    for (const line of [].concat(lines)) {
      if (line === undefined || line === null || line === '') continue;
      const d = el('div', 'line ' + kind, String(line));
      box.appendChild(d);
      if (!(opts && opts.noNow)) lastLines.push({ kind: kind, text: String(line) });
    }
    scrollLog();
  }

  /** 把本轮新增的叙事渲染进「刚刚发生」卡片（紧贴选项，手机上也看得见） */
  function renderNow() {
    const box = $('now');
    clear(box);
    const rows = lastLines.filter((x) => x.kind !== 'set');
    if (!rows.length) { box.style.display = 'none'; return; }
    box.style.display = '';
    const chars = rows.map((r) => r.text.length).reduce((a, b) => a + b, 0);
    box.appendChild(el('div', 'nowhead', '第 ' + (state ? state.turn : '?') + ' 天 · 这一段的完整剧情（' +
      chars + ' 字）'));
    // 剧情模式下这张卡片就是"读剧情"的主视图，不能截断：本轮新增的文字全部显示
    rows.forEach((r) => {
      const cls = r.kind === 'enc' ? 'line say ghost' : (r.kind === 'over' ? 'line say ghost' : 'line narr');
      box.appendChild(el('div', cls, r.text));
    });
    nowLineCount = rows.length;
  }

  function hideNow() { const b = $('now'); if (b) { clear(b); b.style.display = 'none'; } }

  function renderChoices(choices, mode, label) {
    syncAI(state);
    const box = $('choices');
    clear(box);
    // 遭遇中不提供自定义入口：此刻必须做出选择，避免用描述性文本绕过判定。
    // 例外（第 21 轮）：智慧级厉鬼可以对话——它听得懂人话，这也正是"它有智慧"的意义。
    $('footer').style.display = (state && state.pending && !isSmartPending(state)) ? 'none' : '';
    if (state && state.over) {
      document.body.classList.remove('story-mode');

      b.onclick = () => showMenu();

    // 剧情模式（用户要求）：点完选项先把选项收起来，只显示这一段剧情；读完再点「继续」回到选项
    if (mode === 'continue') {
      document.body.classList.add('story-mode');
      const chars = lastLines.reduce((a, x) => a + (x.text ? x.text.length : 0), 0);
      const hint = el('div', 'storyHint', '（这是这一段的完整剧情，共 ' + chars + ' 字·读完再点下面继续）');
      box.appendChild(hint);
      const b = el('button', 'btn primary big', label || (state && state.pending
        ? '继续 ▶　面对「' + state.pending.name + '」'
        : '继续 ▶　进入第 ' + (state.turn + 1) + ' 天'));
      b.onclick = continueNext;
      box.appendChild(b);
      return;
    }
    document.body.classList.remove('story-mode');
    if (!choices.length) {
      box.appendChild(el('div', 'muted', '（没有可选行动——请把存档贴回来继续）'));
      return;
    }
    // 接了 AI 的提示：告诉玩家智慧级厉鬼已经进入这个世界（否则它们的存在没人发现）
    if (aiReady() && state && state.turn >= 5 && !state.pending) {
      box.appendChild(el('div', 'hint', 'AI 已接入：智慧级厉鬼（' + (C.smartGhostIds || []).length +
        ' 只，会说话、会谈条件）已经进入你的世界，随时可能找上你。'));
    }
    // 标题：明确这里是"要你选一个"，否则一排按钮看起来像不明所以的文字块
    const inEnc = !!(state && state.pending);
    const smart = isSmartPending(state);
    box.appendChild(el('div', 'choicesHead',
      inEnc ? (smart ? '你有智慧级厉鬼在你面前 —— 可以直接对它说话，也可以从下面选一步'
                     : '你必须做出选择 —— 点下面任意一行（生路要线索支撑，陷阱会死人）')
            : '今天可以做的事 —— 选一件（每天只能做一个主动作）'));
    if (inEnc) {
      const opts = state.pending.options || [];
      const kinds = { exit: 0, neutral: 0, trap: 0 };
      opts.forEach((o) => { if (kinds[o.kind] !== undefined) kinds[o.kind]++; });
      box.appendChild(el('div', 'choicesSub',
        '现在给出 ' + opts.length + ' 个选项：其中可走的路 ' + kinds.exit + ' 条（需你已掌握线索）、' +
        '安全但会受伤的 ' + kinds.neutral + ' 条、直接触发规矩的 ' + kinds.trap + ' 条。' +
        '看不出来就先去调查——线索越全，生路越明确。' +
        (smart ? '　它是智慧级厉鬼：下面输入框可以直接说话，AI 用它自己的思维回答你（判定仍算引擎的）。' : '')));
    }
    choices.forEach((c, i) => {
      // 选项文字里已经写了「（生路）」的，不再重复追加标注
      const note = c.note && !c.label.includes('生路') ? c.note : '';
      const b = el('button', 'btn opt' + (c.note ? ' exit' : ''),
        String(i + 1).padStart(2, '0') + '　' + c.label + note);
      b.onclick = () => onChoice(c.id);
      box.appendChild(b);
    });
    if (state.pending) {
      const hint = el('div', 'muted', '可观察线索：已掌握 ' + state.pending.revealedClues.length +
        ' 条，另有 ' + state.pending.clueHints + ' 条尚未掌握。线索越全，生路越明确。');
      box.appendChild(hint);
    }
  }

  function renderEncounter() {
    if (!state.pending) return;
    addLog('enc', '【遭遇】' + state.pending.name + '（' + state.pending.level + ' 级）' +
      (state.pending.smart ? '　★智慧级' : ''));
    addLog('', state.pending.text);
    if (state.pending.smart) {
      addLog('warn', '它有智慧：听得懂人话，会跟你谈条件。你可以直接在下面输入框里对它说话——' +
        '它会用自己的思维与说话方式回应你（AI 扮演），但判定仍归引擎。');
      // 让它先开口（AI 扮演）；接口没接上就退回到它的兜底台词
      const g = C.ghosts[state.pending.ghost];
      const tl = (g && g.talk) || [];
      if (tl.length) addLog('say ghost', '【' + state.pending.name + '】' + tl[0]);
      if (aiReady()) aiGhostSpeak(state.pending, '');       // 异步补一句更贴人设的开场
    }
    if (N) {
      // 第 20 轮：先两段成段叙事（读感），再补短句细节（信息）
      if (N.prose) {
        const ps = N.prose(state, 'encProse', 2, ctxOf(state));
        if (ps.length) addLog('scene', ps);
      }
      const mood = N.encounterMood(state);
      if (mood) addLog('scene', mood);
      const sense = N.encounterSense ? N.encounterSense(state) : '';
      if (sense) addLog('scene', sense);
      const act = N.encounterAct ? N.encounterAct(state) : '';
      if (act) addLog('scene', act);
    }
    if (state.pending.revealedClues.length) {
      addLog('clue', state.pending.revealedClues.map((c) => '· 你掌握的线索：' + c));
    } else {
      addLog('warn', '· 你对它一无所知——现在只能靠判断和运气。');
    }
    if (N && N.prose) {
      const cs = N.prose(state, 'encClose', 1, ctxOf(state));
      if (cs.length) addLog('scene', cs);
    }
  }

  function renderOver() {
    const o = state.over;
    const def = C.endings[o.ending] || { name: o.ending, text: '' };
    addLog('over', '【结局】' + def.name);
    addLog('over', def.text);
    addLog('', '存活 ' + state.turn + ' 天（第 ' + state.chapter + ' 章）。');
    // 跨局结算：统计、成就、周目点数（档案带校验和）
    if (P && profile && !o.settled) {
      o.settled = true;
      const r = P.settle(profile, state, o.ending);
      profile = r.profile;
      P.saveProfile(profile);
      addLog('muted', '【档案】本局获得周目点数 +' + r.points + '（累计可用 ' + profile.points + '）｜存活 ' +
        r.run.turn + ' 天｜生路存活 ' + r.run.escapes + ' 次｜触发玩法 ' + r.run.mechCount + ' 条');
      if (r.unlocked.length) {
        addLog('over', '【解锁成就】' + r.unlocked.map((a) => a.name + '（' + a.desc + '）').join('；'));
      }
      const prog = P.achievementProgress(profile);
      addLog('muted', '成就进度 ' + prog.unlocked + '/' + prog.total + '　结局收集 ' +
        Object.keys(profile.endings).length + '/' + Object.keys(C.endings).length);
    }
    const lv = state.contentLevel || 'A';
    if (lv !== 'A' && C.narrative['level' + lv]) {
      const bank = C.narrative['level' + lv];
      addLog('warn', bank[(state.turn + state.seedInt) % bank.length]);
    }
    const gallery = LS.get('rs_gallery', {});
    if (!gallery[o.ending]) {
      gallery[o.ending] = { times: 1, first: Date.now() };
      LS.set('rs_gallery', gallery);
    } else gallery[o.ending].times += 1, LS.set('rs_gallery', gallery);
  }

  async function onChoice(id, customText) {
    lastLines = [];                 // 本轮新增行：用于「刚刚发生」卡片
    dayStoryShown = false;          // 新的一轮开始：下一天的剧情重新单独读一遍
    syncAI(state);                  // 智慧级厉鬼是否入池，取决于此刻有没有接 AI
    // 智慧级遭遇：玩家说了话，先让"它"用自己的口吻回一句（AI 扮演），再走引擎判定
    const smartTalk = isSmartPending(state) && id === '__custom__' ? String(customText || '') : null;
    if (smartTalk) await aiGhostSpeak(state.pending, smartTalk);
    // 自由输入：先尝试识别成"真实行动"（不接 AI 也能有自由度）
    let realId = id;
    let intent = null;
    if (id === '__custom__') {
      if (state && state.pending && E.parseEncounterIntent) {
        // 遭遇中：只允许把话对应到**现有选项**上，绝不凭空造一个绕过判定的选项
        const ei = E.parseEncounterIntent(state, customText);
        if (ei) {
          realId = ei.optionId;
          const kindName = { exit: '生路', neutral: '中性', trap: '陷阱' }[ei.kind] || ei.kind;
          intent = { label: '[' + kindName + '] ' + ei.label, via: '你写的那句话' };
        } else {
          if (isSmartPending(state)) {
            addLog('muted', '（它听完了你的话。不过你"真的要做什么"，仍然要从下面这些选项里挑一步——' +
              '说话能影响它、影响不了规则。）');
            addLog('muted', '提示：想活下来，就从选项里挑一条代价付得起的生路；它认的是条件，不是嘴。）');
            renderNow();
            return;
          }
          addLog('warn', '【此刻必须做出选择】引擎不会因为你说了什么而改变判定。');
          addLog('muted', '你可以直接写你要做的事，但必须落在下面这些选项上；选项的文字/标签对得上，我就替你选它。');
          return;
        }
      } else if (E.parseIntent) {
        intent = E.parseIntent(state, customText);
        if (intent && E.availableActions(state).some((a) => a.id === intent.actionId)) {
          realId = intent.actionId;
        }
      }
    }
    // 第 20 轮：先判断这是不是"遭遇结算"（结算后的文字与日常行动完全不同）
    const wasEncounter = !!(state && state.pending);
    const rep = E.resolve(state, realId, customText);
    if (rep.error) { addLog('warn', '【拒绝】' + rep.error); return; }
    if (intent && realId !== '__custom__') {
      addLog('muted', '（从你的话里识别到行动：' + intent.label + '｜依据：“' + intent.via + '”）');
    } else if (id === '__custom__') {
      addLog('muted', '（这句话只作为叙事描述，判定仍按当前局势照常结算）');
    }
    // 第 15 轮：先写"你是怎么做的"（行动过程），再出结果，剧情更完整
    if (N && N.actionProcess && !rep.error) {
      const proc = N.actionProcess(state, realId);
      if (proc && proc.length) addLog('', proc);
    }
    // 叙事
    if (window.RS_AI.enabled && window.RS_AI.endpoint && rep.narrative.length) {
      try {
        const ai = await window.RS_AI.narrate({ world: C.meta.title, panel: rep.panel, action: id, settlement: rep.settlement });
        if (ai) { addLog('', ai); addLog('muted', '（本段剧情由 AI 润色；判定与数值以引擎为准）'); }
        else addLog('', rep.narrative);
      } catch (e) {
        addLog('', rep.narrative);
        addLog('warn', '（AI 叙事失败，已回退为引擎文本：' + e.message + '）');
      }
    } else {
      addLog('', rep.narrative);
    }
    // 行动结果变体句：让"每次休整都是同一句话"不再发生
    if (N && rep.actionVariant && !state.over) {
      const extra = N.actionLine(state, rep.actionVariant);
      if (extra) addLog('scene', extra);
    }
    if (rep.settlement && rep.settlement.length) addLog('set', rep.settlement.map((s) => '▸ ' + s));
    // 第 20 轮：行动之后补成段叙事（"这一趟留下了什么" + "今天剩下的时间"）
    if (N && N.prose && !state.over) {
      if (wasEncounter) {
        const ap = N.prose(state, 'encResolve', 3, ctxOf(state));
        if (ap.length) addLog('scene', ap);
      } else {
        const ap = N.prose(state, 'actionProse', 2, ctxOf(state));
        if (ap.length) addLog('scene', ap);
        const ac = N.prose(state, 'actionClose', 1, ctxOf(state));
        if (ac.length) addLog('scene', ac);
      }
    }
    // 第 13 轮：行动之后的余波（让"做完了"有下文，剧情更完整）
    if (N && N.aftermath && !state.over) {
      const af = N.aftermath(state, 3);
      if (af.length) addLog('scene', wasEncounter ? af.slice(0, 2) : af.slice(0, 3));
    }
    // 死亡：先写一段墓志铭式的叙事，再给结局判定
    if (N && N.prose && state.over) {
      const dp = N.prose(state, 'deathProse', 1, ctxOf(state));
      if (dp.length) addLog('over', dp);
    }
    if (state.integrity.length) { addLog('warn', '【完整性告警】' + state.integrity.slice(-3).join(' / ')); }
    renderPanel();
    renderSceneArt(state, { lastAction: realId });
    if (state.over) { renderOver(); hideNow(); renderChoices([]); autoSave(); return; }
    if (state.pending) renderEncounter();     // 进入遭遇：正文要显示在「刚刚发生」里
    renderNow();
    renderChoices(rep.choices, 'continue');   // 先读完结果，再让玩家点「继续」
    autoSave();
  }

  /** 「继续」：清掉结果卡片，正式进入下一步（新的一天 / 一场遭遇）
   *  第 20 轮：新一天的剧情也要先单独读一遍（一天 700~800 字，直接跟选项一起给
   *  就会变成"点完选项上面还有一大段没看到"）。所以：先给剧情 + 继续，再给选项。
   */
  function continueNext() {
    hideNow();
    lastLines = [];
    lastSceneCtx = { lastAction: null };
    if (!state) return;
    if (state.over) { renderOver(); renderChoices([]); return; }
    if (state.pending) {
      // 遭遇正文已经在「刚刚发生」里展示过，这里不再重复写进日志
      dayStoryShown = false;
      renderSceneArt(state);
      renderChoices(E.availableActions(state));
      return;
    }
    if (!dayStoryShown) {
      // ① 新一天的剧情：单独一屏，只有剧情和「开始今天的行动」
      dayStoryShown = true;
      renderScene(true);
      renderSceneArt(state);
      renderNow();
      renderChoices(E.availableActions(state), 'continue',
        '开始第 ' + state.turn + ' 天的行动 ▶');
      return;
    }
    // ② 剧情读完了：收起卡片，露出今天的选项
    dayStoryShown = false;
    renderSceneArt(state);
    renderChoices(E.availableActions(state));
  }

  /** 遭遇正文（放进日志，供「继续」之后回看） */
  function renderEncounterPreview() {
    if (!state.pending) return;
    lastSceneCtx = { lastAction: null };
    addLog('enc', '【遭遇】' + state.pending.name + '（' + state.pending.level + ' 级）', { noNow: true });
    addLog('', state.pending.text, { noNow: true });
    if (N) {
      if (N.prose) {
        const ps = N.prose(state, 'encProse', 2, ctxOf(state));
        if (ps.length) addLog('scene', ps, { noNow: true });
      }
      const mood = N.encounterMood(state);
      if (mood) addLog('scene', mood, { noNow: true });
    }
    if (state.pending.revealedClues.length) {
      addLog('clue', state.pending.revealedClues.map((c) => '· 你掌握的线索：' + c), { noNow: true });
    } else {
      addLog('warn', '· 你对它一无所知——现在只能靠判断和运气。', { noNow: true });
    }
    if (N && N.prose) {
      const cs = N.prose(state, 'encClose', 1, ctxOf(state));
      if (cs.length) addLog('scene', cs, { noNow: true });
    }
    renderSceneArt(state);
  }

  /* ============================================================ 场景插画（第 14 轮重做）
   * 用户要求：① 每个选项要有对应的画面；② 自由输入（AI/手打）的那类不用配图。
   * 做法：把"画什么"和"什么时候画"分开——
   *   · motifOf(state, ctx) 决定当前该画哪个母题（行动 id / 鬼 id / 地点 / 时期）；
   *   · MOTIFS[name] 负责把母题画出来（每个都是可辨认的具象剪影，不是抽象色块）。
   * 全部为内联 SVG，按 seed+turn 确定性生成，不引用任何外部素材。
   */
  const ERA_PALETTE = {
    // 阴冷诡异向：[天空上, 天空中, 地平线冷光, 高光(月/窗/边光), 主体中间调, 剪影]
    ancient: ['#1b2635', '#3d4c60', '#8d9cb0', '#f0d9a8', '#6c7989', '#0a0e14'],
    minguo: ['#231d16', '#453c33', '#8a7460', '#ffdc9c', '#6f6459', '#0b0a09'],
    y2017: ['#182435', '#33475f', '#7894b4', '#eaf5ff', '#5f7191', '#070b12'],
    y2018: ['#182429', '#31494c', '#6d9192', '#e6fff4', '#5c7374', '#060b0c'],
    y2019: ['#1f1b33', '#3d3659', '#7868a0', '#f4ecff', '#5f5686', '#0a0813'],
    doomsday: ['#2b1415', '#4d2c28', '#9e5147', '#ffc79a', '#71453e', '#0d0606'],
    after60: ['#24241b', '#484735', '#8b8366', '#fff3cd', '#6f6a56', '#0b0b08'],
  };

  // 行动 → 母题
  const ACTION_MOTIF = {
    rest: 'bed', work: 'desk', investigate: 'files', train: 'mirror', mastery: 'grip',
    purge: 'altar', shop: 'stall', mission: 'hq', gamble: 'dicetable', social: 'meal',
    safehouse: 'ward', heal: 'clinic', freeze: 'frost', city: 'alley', probe: 'alley',
  };
  // 厉鬼 → 母题
  const GHOST_MOTIF = {
    guiying: 'crib', qiaomen: 'knockdoor', wutou: 'headless', guiguan: 'coffin',
    eshigui: 'emptycity', jingqiaoqiao: 'mutealley', qigui: 'chess', yachuang: 'besidebed',

  const PLACE_MOTIF = {

    town: 'trees', village: 'fields', street: 'rain', shop: 'stall', temple: 'shrine',
    bus: 'busstop', oldhouse: 'house', yangjian: 'gate',

  const MOTIF_LABEL = {
    bed: '休整·卧室', desk: '上班·工位', files: '调查·档案', mirror: '训练·镜子', grip: '驾驭·按住它',

  };

  /** 当前该画什么：遭遇 > 刚做的行动 > 地点 > 时期 */
  function motifOf(state, ctx) {
    if (!state) return 'skyline';
    if (state.over) return 'gate';
    if (state.pending && state.pending.ghost) return GHOST_MOTIF[state.pending.ghost] || 'knockdoor';
    if (ctx && ctx.lastAction) {
      if (ctx.lastAction === '__custom__') return 'unknown';     // 自由输入：不给配图（用户明确要求）
      if (ctx.lastAction.indexOf('city_') === 0) return 'alley';
      if (ctx.lastAction.indexOf('probe_') === 0) return 'alley';
      if (ACTION_MOTIF[ctx.lastAction]) return ACTION_MOTIF[ctx.lastAction];
    }
    const city = (C.cities && C.cities[state.city]) || null;
    return PLACE_MOTIF[(city && city.place) || 'city'] || 'skyline';
  }

  /* ------------------------------------------------------------- 画图工具 */
  const R_ = (x, y, w, h, fill, op) => '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" fill="' + fill + '"' + (op !== undefined ? ' opacity="' + op + '"' : '') + '/>';
  const C_ = (cx, cy, r, fill, op) => '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="' + fill + '"' + (op !== undefined ? ' opacity="' + op + '"' : '') + '/>';
  const E_ = (cx, cy, rx, ry, fill, op) => '<ellipse cx="' + cx + '" cy="' + cy + '" rx="' + rx + '" ry="' + ry + '" fill="' + fill + '"' + (op !== undefined ? ' opacity="' + op + '"' : '') + '/>';
  const LN = (x1, y1, x2, y2, st, op, w) => '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="' + st + '" stroke-opacity="' + (op === undefined ? 1 : op) + '" stroke-width="' + (w || 2) + '" stroke-linecap="round"/>';
  const PA = (d, fill, op) => '<path d="' + d + '" fill="' + fill + '"' + (op !== undefined ? ' opacity="' + op + '"' : '') + '/>';
  const PS = (d, st, op, w) => '<path d="' + d + '" fill="none" stroke="' + st + '" stroke-opacity="' + (op === undefined ? 1 : op) + '" stroke-width="' + (w || 2) + '" stroke-linecap="round"/>';
  const PG = (pts, fill, op) => '<polygon points="' + pts + '" fill="' + fill + '"' + (op !== undefined ? ' opacity="' + op + '"' : '') + '/>';
  const TX = (x, y, s, fill, size, op) => '<text x="' + x + '" y="' + y + '" fill="' + fill + '" opacity="' + (op || 1) + '" font-size="' + (size || 16) + '" text-anchor="middle" font-family="serif">' + s + '</text>';

  /* ------------------------------------------------------------- 母题库 */

  const G2 = (pts, fill, op) => '<polygon points="' + pts + '" fill="' + fill + '"' + (op === undefined ? '' : ' opacity="' + op + '"') + '/>';
  /** 赛璐璐块：平涂 + 黑描边（画法的基本单元） */

  /* ------------------------------------------------ 动画人脸 */
  /** 正面脸：脸型 + 单侧硬边阴影 + 轮廓光 + 眼睛（虹膜/高光/睫毛）+ 眉 + 鼻 + 嘴 + 头发 */

      cp('M' + nf(cx - 0.9 * r) + ' ' + nf(cy - 0.9 * r) + ' L' + nf(cx - 0.04 * r) + ' ' + nf(cy - 0.9 * r) +

      a.push(S('M' + nf(ex - ew * 0.78) + ' ' + nf(ey + eh * 0.86) + ' Q' + nf(ex) + ' ' + nf(ey + eh * 1.18) + ' ' + nf(ex + ew * 0.78) + ' ' + nf(ey + eh * 0.80), CEL_INK, 1.4, 0.75));
      a.push(S('M' + nf(ex - ew * 1.06) + ' ' + nf(ey - eh * 2.3) + ' Q' + nf(ex) + ' ' + nf(ey - eh * 3.0) + ' ' + nf(ex + ew * 0.96) + ' ' + nf(ey - eh * 2.1), HAIR.lo, 3.2));

    a.push(S('M' + nf(cx + 0.06 * r) + ' ' + nf(cy + 0.34 * r) + ' l' + nf(-0.06 * r) + ' ' + nf(0.12 * r), SKIN.deep, 1.6, 0.7));
    a.push(S('M' + nf(cx - 0.10 * r) + ' ' + nf(cy + 0.58 * r) + ' q' + nf(0.10 * r) + ' ' + nf(0.07 * r) + ' ' + nf(0.20 * r) + ' ' + nf(-0.01 * r), '#8c5c4f', 2, 0.9));

      ' C' + nf(cx + 0.52 * r) + ' ' + nf(cy - 0.34 * r) + ' ' + nf(cx + 0.20 * r) + ' ' + nf(cy - 0.46 * r) + ' ' + nf(cx - 0.06 * r) + ' ' + nf(cy - 0.32 * r) +
      ' C' + nf(cx - 0.30 * r) + ' ' + nf(cy - 0.22 * r) + ' ' + nf(cx - 0.56 * r) + ' ' + nf(cy - 0.28 * r) + ' ' + nf(cx - 0.70 * r) + ' ' + nf(cy - 0.10 * r) + ' Z';
    a.push(cp(hairTop, HAIR.mid) + S(hairTop, CEL_INK, 3));
    a.push(cp('M' + nf(cx - 0.34 * r) + ' ' + nf(cy - 0.34 * r) + ' L' + nf(cx - 0.16 * r) + ' ' + nf(cy + 0.06 * r) +

  /** 外套/肩（正面或背面通用）：肩线 + 立领 + 明暗两色 + 黑描边 */

  /* ------------------------------------------------ 环境 */

  const MOTIFS_V2 = {
    tear: stillTear,

  /** 画风 V2 渲染：底 + 母题 + 体积光 + 颗粒 + 压暗 + 电影黑边 */
  function sceneSvgV2(state, ctx, forceMotif) {
    const eraId = (state && state.era) || 'y2018';
    const pal = CEL_PALETTE[eraId] || CEL_PALETTE.y2018;
    const seed = (state && state.seedInt) || 20180923;
    const turn = (state && state.turn) || 1;
    const motif = forceMotif || 'rain';
    const fn = MOTIFS_V2[motif] || stillRain;
    const out = [];
    out.push('<svg viewBox="0 0 ' + CEL_W + ' ' + CEL_H + '" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">');
    out.push('<defs><radialGradient id="vig3" cx="50%" cy="46%" r="72%">' +
      '<stop offset=".46" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".76"/></radialGradient>' +
      '<filter id="grain3"><feTurbulence type="fractalNoise" baseFrequency="0.92" numOctaves="2" stitchTiles="stitch"/>' +
      '<feColorMatrix type="saturate" values="0"/></filter></defs>');
    out.push(fn(pal).join(''));
    if (((seed + turn) % 3) !== 1) {
      out.push(cp('M' + (60 + (seed % 140)) + ' 0 L' + (200 + (seed % 120)) + ' 0 L' + (300 + (seed % 90)) + ' ' + CEL_H + ' L' + (140 + (seed % 60)) + ' ' + CEL_H + ' Z', pal[3], 0.05));
    }
    out.push('<rect width="' + CEL_W + '" height="' + CEL_H + '" filter="url(#grain3)" opacity=".06"/>');
    out.push(R2(0, 0, CEL_W, CEL_H, 'url(#vig3)'));
    out.push(letterbox());
    out.push('</svg>');
    return out.join('');
  }

  /** 画册样张清单（第 21 轮重做版） */
  const SAMPLES_V2 = [
    { motif: 'tear', label: '撕信（对应你给的那一集）', note: '两只手把信撕开、红印章、暗处一只眼——最接近特写镜头的一张' },
    { motif: 'rain', label: '雨中巷口', note: '主角背影低机位 + 红路灯 + 湿地面反光 + 巷子深处一道鬼影' },
    { motif: 'eye', label: '鬼眼', note: '极特写：睫毛、虹膜、瞳孔里立着一个红影' },
    { motif: 'door', label: '门缝后的那张脸', note: '门板压满画面，门缝里半张苍白的脸和一只红眼' },
    { motif: 'captain', label: '幽灵船长', note: '雾夜甲板、红灯笼、船长逆光剪影、海里伸出来的手' },
  ];

  function sceneSvg(state, ctx, forceMotif) {
    const pal = ERA_PALETTE[(state && state.era)] || ERA_PALETTE.y2018;
    const seed = (state && state.seedInt) || 20180923;
    const turn = (state && state.turn) || 1;
    const hh = (i) => ((seed * 9301 + turn * 49297 + i * 233) % 233280) / 233280;
    const motif = forceMotif || motifOf(state, ctx);
    const W = 400; const H = 190; const horizon = 132;
    const out = [];
    out.push('<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">');
    out.push('<defs>' +
      '<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0" stop-color="' + pal[0] + '"/><stop offset=".52" stop-color="' + pal[1] + '"/>' +
      '<stop offset=".84" stop-color="' + pal[2] + '"/><stop offset="1" stop-color="' + pal[2] + '"/></linearGradient>' +
      '<radialGradient id="halo" cx="50%" cy="50%" r="50%">' +
      '<stop offset="0" stop-color="' + pal[2] + '" stop-opacity=".8"/><stop offset=".5" stop-color="' + pal[2] + '" stop-opacity=".16"/>' +
      '<stop offset="1" stop-color="' + pal[2] + '" stop-opacity="0"/></radialGradient>' +
      '<radialGradient id="vig" cx="50%" cy="45%" r="72%"><stop offset=".55" stop-color="#000" stop-opacity="0"/>' +
      '<stop offset="1" stop-color="#000" stop-opacity=".7"/></radialGradient></defs>');
    out.push(R_(0, 0, W, H, 'url(#sky)'));
    // 月亮 + 地平线（所有母题共用的底子）
    const mx = 58 + hh(1) * 284;
    out.push(C_(mx.toFixed(0), (34 + hh(2) * 24).toFixed(0), 74, 'url(#halo)'));
    out.push(C_(mx.toFixed(0), (34 + hh(2) * 24).toFixed(0), 17, pal[3], 1));
    out.push(C_(mx.toFixed(0), (34 + hh(2) * 24).toFixed(0), 11, '#ffffff', .9));
    out.push(R_(0, horizon, W, H - horizon, pal[5]));
    out.push(E_(200, horizon + 24, 240, 34, pal[2], .28));
    const flat = (a) => [].concat(a).reduce((acc, x) => acc.concat(Array.isArray(x) ? flat(x) : x), []);
    out.push(flat((MOTIFS[motif] || MOTIFS.skyline)(pal, hh)).join(''));
    // ===== 阴冷诡异质感层（借鉴《我叫杨间》：羊皮纸颗粒、被黑暗窥视的眼睛、高对比冷光）=====
    // 旧纸颗粒：SVG 湍流滤镜直接生成，不需要任何外部贴图
    out.push('<filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>' +
      '<feColorMatrix type="saturate" values="0"/></filter>');
    out.push('<rect width="' + W + '" height="' + H + '" filter="url(#grain)" opacity=".13"/>');
    for (let i = 0; i < 5; i++) {
      out.push(E_((hh(i + 300) * W).toFixed(0), (hh(i + 320) * H).toFixed(0),
        (18 + hh(i + 340) * 46).toFixed(0), (10 + hh(i + 360) * 26).toFixed(0), pal[2], .06));
    }
    for (let y = 0; y < H; y += 4) out.push(LN(0, y, W, y, '#000000', .06, 1));   // 扫描线
    for (let i = 0; i < 3; i++) {                                                  // 胶片划痕
      const sx = (hh(i + 400) * W).toFixed(0);
      out.push(LN(sx, (hh(i + 410) * 40).toFixed(0), (Number(sx) + hh(i + 420) * 3).toFixed(0), H, '#ffffff', .09, 1));
    }
    // 暗处窥视的眼睛：遭遇/结局时必现，平时偶尔出现——"被黑暗窥视"的招牌意象
    if ((state && (state.pending || state.over)) || hh(7) > .5) {
      const ex = 44 + hh(11) * 300;
      const ey = 54 + hh(13) * 58;
      const gap = 26 + hh(15) * 16;
      out.push(E_(ex.toFixed(0), ey.toFixed(0), 16, 8, '#000000', .5));
      [-1, 1].forEach((k) => {
        const x = (ex + k * gap / 2).toFixed(0);
        out.push(E_(x, ey.toFixed(0), 6.4, 3.6, pal[3], .95));
        out.push(C_(x, ey.toFixed(0), 2.2, '#05070a', .95));
        out.push(C_(x, ey.toFixed(0), 0.9, '#ffffff', .55));
      });
      out.push(LN(ex - 46, ey, ex - gap / 2 - 9, ey, pal[3], .16, 1.6));
      out.push(LN(ex + gap / 2 + 9, ey, ex + 46, ey, pal[3], .16, 1.6));
    }
    out.push(R_(0, 0, W, H, 'url(#vig)'));
    for (let i = 0; i < 26; i++) {
      out.push(C_((hh(i + 90) * W).toFixed(0), (hh(i + 150) * H).toFixed(0), 0.9, '#fff', (.05 + hh(i) * .09).toFixed(2)));
    }
    out.push('</svg>');
    return out.join('');
  }

  function sceneCaption(state, ctx) {
    if (!state) return '神秘复苏 · 灵异复苏时代';
    const city = (C.cities && C.cities[state.city]) || null;
    const era = (C.eras && C.eras[state.era]) || null;
    const motif = motifOf(state, ctx);
    const parts = [];
    if (MOTIF_LABEL[motif]) parts.push(MOTIF_LABEL[motif]);
    if (city) parts.push(city.name);
    if (era) parts.push(era.short);
    return parts.join('　·　') || '神秘复苏';
  }

  let lastSceneCtx = null;
  function renderSceneArt(state, ctx) {
    const box = $('scene');
    if (!box || !state) return;
    if (ctx) lastSceneCtx = ctx;
    const m = motifOf(state, lastSceneCtx);
    box.innerHTML = sceneSvg(state, lastSceneCtx);
    box.appendChild(el('div', 'sceneCaption', sceneCaption(state, lastSceneCtx)));
    box.setAttribute('data-motif', m);
  }

  /** 供画册页/测试列举所有母题 */

  /* ------------------------------------------------------------ 画册（所有母题一览）
   * 用途：① 玩家可以在手机上翻看全部画面；② 我自己核对"每个选项是否真的有配图"。
