  function openGallery() {
    const box = $('toolbox');
    box.style.display = '';
    clear(box);
    // ===== 第 21 轮：新画风样张（按《我叫杨间》动画风格）最上面单独一栏 =====
    box.appendChild(el('div', 'sectionTitle', '新版样张 · 国漫动画风（5 张，按《我叫杨间》的画面来做）'));
    box.appendChild(el('div', 'hint', '赛璐璐平涂（硬边色阶，不做渐变过渡）+ 黑色粗描边 + 冷蓝夜色 + 单侧冷轮廓光 + 红色只给鬼气/眼睛/血 + 四周压暗。' +
      '人物只做剪影不画五官。你看过点头，我就把剩下 38 张按这套同一画法全部重做（现在的旧画风先保留在下面）。'));
    const sgrid = el('div', 'galleryGrid');
    SAMPLES_V2.forEach((s, i) => {
      const fake = { era: ['y2018', 'y2017', 'y2019', 'minguo', 'y2018'][i % 5], seedInt: 20180923 + i * 977, turn: 3 + i, city: 'dachang' };
      const cell = el('div', 'galleryCell');
      const art = el('div', 'galleryArt v2');
      art.innerHTML = sceneSvgV2(fake, null, s.motif);
      cell.appendChild(art);
      cell.appendChild(el('div', 'galleryLabel', '样张 ' + (i + 1) + '　' + s.label));
      cell.appendChild(el('div', 'galleryNote', s.note));
      sgrid.appendChild(cell);
    });
    box.appendChild(sgrid);

    const list = motifList();
    box.appendChild(el('div', 'sectionTitle', '现行画册 · 共 ' + list.length + ' 张（下面是正在用的旧画风）'));
    box.appendChild(el('div', 'hint', '色调随「时期」变化；自由输入的行动不配图（那张是问号）。点「关闭」回到游戏。'));
    const grid = el('div', 'galleryGrid');
    const eraIds = Object.keys(C.eras);
    list.forEach((m, i) => {
      const fake = { era: eraIds[i % eraIds.length], seedInt: (i + 3) * 7919, turn: 1 + (i % 5), city: 'dachang' };
      const cell = el('div', 'galleryCell');
      const art = el('div', 'galleryArt');
      art.innerHTML = sceneSvg(fake, null, m.name);
      cell.appendChild(art);
      cell.appendChild(el('div', 'galleryLabel', m.label + '（' + m.name + '）'));
      grid.appendChild(cell);
    });
    box.appendChild(grid);
    const close = el('button', 'btn small', '关闭');
    close.onclick = () => { box.style.display = 'none'; };
    box.appendChild(close);
  }
  /* ------------------------------------------------------ 世界观速览（新手引导） */
  const GLOSSARY = [
    ['诡秘复苏', '现实世界的"规律"被厉鬼接管：它们不追人，只按自己的规矩杀人。'],
    ['厉鬼与"规矩"', '每只鬼都有一条杀人规律（敲门鬼按敲门次数、鬼婴靠声音定位）。懂规矩就能活，不懂就是死。'],
    ['驭鬼者', '把厉鬼纳入自己身体的人。力量来自鬼，代价是侵蚀（越用越像鬼，到 100 就不再是人）。'],
    ['劫难值', '世界复苏的进度。它每回合自动上涨，到 100 会强制触发一次劫难判定，扛不住就死。可以用「处置灵异源头」主动压低，但每章只有 3 次。'],
    ['侵蚀 / 人性', '侵蚀涨、人性上限就降。人性归零或侵蚀满 100 = 你变成鬼（复苏之鬼结局）。'],
    ['低调值', '你被注意的程度。低于 30 时更容易撞上东西。'],
    ['理智 / 体力 / 污染 / 因果', '理智归零会发疯；体力不够很多事做不了；污染来自与灵异接触；因果是你欠下的"债"，满 100 会被收走。'],
    ['鬼眼', '觉醒的标志。没有鬼眼（或契约）时，驾驭鬼的成功率是 0%。'],
    ['遭遇三选一', '陷阱＝必死（有对应道具才能赌一次）；中性＝擦身而过，但失败会留下不可逆侵蚀；生路＝需要先掌握足够线索，代价付得起才出现。'],
    ['线索', '调查能挖到鬼的规律。掌握得越多，生路才会出现——这是唯一的活路来源。'],
  ];

  function openGuide() {
    const box = $('toolbox');
    box.style.display = '';
    clear(box);
    box.appendChild(el('div', 'sectionTitle', '世界观速览（没看过小说也能玩）'));
    box.appendChild(el('div', 'hint', '你是灵异复苏时代的一个普通人。世界正在被"鬼的规矩"改写成另一种样子，你要靠线索和判断活到结局。'));
    GLOSSARY.forEach(([k, v]) => {
      const row = el('div', 'guideRow');
      row.appendChild(el('div', 'guideKey', k));
      row.appendChild(el('div', 'guideVal', v));
      box.appendChild(row);
    });
    box.appendChild(el('div', 'sectionTitle', '怎么开始'));
    box.appendChild(el('div', 'hint', '① 选难度 → ② 选开局 → ③ 选落地城市与时期（也可以都选"随机"）→ ④ 开始游戏。'));
    box.appendChild(el('div', 'hint', '每天只能做一个主动作；选完会先给你看结果，点「继续」才进入下一天。写不出选项里的话时，直接在底部输入框里写你想做什么，我会尽量把它认成真实行动。'));
    const close = el('button', 'btn small', '知道了，开始玩');
    close.onclick = () => { box.style.display = 'none'; };
    box.appendChild(close);
  }

  /* ------------------------------------------------------------ 图鉴（第 20 轮）
   * 用户反馈：「成就那些怎么没有图鉴可以点开看呢」。
   * 五个分页：成就 / 结局 / 厉鬼 / 线索 / 战绩。
   * 解锁规则：成就与结局看跨局档案；厉鬼与规律线索看「是否真的遭遇/掌握过」——
   * 没遭遇过的鬼只给名字等级属地与遭遇文本，规律一律打码，避免图鉴变成通关攻略。
   */
  const LEVEL_TONE = { S: 'danger', A: 'warn', B: 'accent', C: 'success' };
  let ghostView = 'ghost';   // 厉鬼分页里的子视图：ghost（档案）/ gdims（维度图）

  /** 线索 id → { text, ghost, ghostName } 全库索引（用于"这条线索属于谁"） */
  function clueIndex() {
    const idx = {};
    const gs = (C && C.ghosts) || {};
    for (const gid of Object.keys(gs)) {
      const g = gs[gid];
      (g.clues || []).forEach((c) => { idx[c.id] = { text: c.text, ghost: gid, ghostName: g.name, level: g.level }; });
    }
    return idx;
  }

  function tabBar(tabs, active, onPick) {
    const bar = el('div', 'tabbar');
    tabs.forEach((t) => {
      const b = el('button', 'tab' + (t.id === active ? ' on' : ''), t.label + (t.count === undefined ? '' : ' ' + t.count));
      b.onclick = () => onPick(t.id);
      bar.appendChild(b);
    });
    return bar;
  }

  /* ------------------------------------- 厉鬼维度（第 21 轮：雷达图 + 总览）
   * 六维：威胁 / 规律严苛 / 感知追踪 / 污染 / 精神冲击 / 反制难度（0~100，见 content.ghostDims）。
   * 全部是内联 SVG，不引用外部素材。
   */
  const DIM_ORDER = ['threat', 'rule', 'sense', 'pollution', 'sanity', 'counter'];

  function dimLabel(k) { return (C.dimLabel && C.dimLabel[k]) || k; }
  function dimsOf(gid) {
    const d = (C.ghostDims && C.ghostDims[gid]) || null;
    if (d) return d;
    // 没有显式维度的鬼（老数据）：按等级给一组保守值，保证图鉴不空
    const lv = ((C.ghosts[gid] || {}).level) || 'B';
    const base = { S: 88, A: 70, B: 50, C: 25 }[lv] || 50;
    return { threat: base, rule: base, sense: base, pollution: base, sanity: base, counter: base, note: '' };
  }

  /** 单只鬼的六维雷达图（size=画布边长） */
  function radarSvg(gid, size) {
    const dims = dimsOf(gid);
    const S = size || 240;
    const cx = S / 2, cy = S / 2 + 4;
    const R = S * 0.33;
    const n = DIM_ORDER.length;
    const pt = (i, r) => {
      const a = -Math.PI / 2 + (Math.PI * 2 * i) / n;
      return [cx + Math.cos(a) * r, cy + Math.sin(a) * r];
    };
    const out = [];
    // 网格：4 圈 + 6 条轴
    out.push('<svg viewBox="0 0 ' + S + ' ' + (S + 10) + '" width="100%" height="' + (S + 10) +
      '" xmlns="http://www.w3.org/2000/svg" role="img">');
    out.push('<rect x="0" y="0" width="' + S + '" height="' + (S + 10) + '" fill="#0a0f14"/>');
    for (let ring = 4; ring >= 1; ring--) {
      const rr = (R * ring) / 4;
      const pts = [];
      for (let i = 0; i < n; i++) pts.push(pt(i, rr).map((v) => v.toFixed(1)).join(','));
      out.push('<polygon points="' + pts.join(' ') + '" fill="' + (ring === 4 ? '#101922' : 'none') +
        '" stroke="#26313d" stroke-width="1"/>');
    }
    for (let i = 0; i < n; i++) {
      const p = pt(i, R);
      out.push('<line x1="' + cx + '" y1="' + cy + '" x2="' + p[0].toFixed(1) + '" y2="' + p[1].toFixed(1) +
        '" stroke="#232f3b" stroke-width="1"/>');
    }
    // 数据多边形
    const dpts = [];
    for (let i = 0; i < n; i++) {
      const v = Math.max(0, Math.min(100, dims[DIM_ORDER[i]] || 0));
      dpts.push(pt(i, (R * v) / 100));
    }
    const poly = dpts.map((p) => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
    const danger = dims.threat >= 80 ? '#ef5350' : dims.threat >= 60 ? '#ffb300' : '#26c6da';
    out.push('<polygon points="' + poly + '" fill="' + danger + '" fill-opacity="0.28" stroke="' + danger +
      '" stroke-width="2"/>');
    dpts.forEach((p) => out.push('<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) +
      '" r="2.6" fill="' + danger + '"/>'));
    // 顶点标签
    for (let i = 0; i < n; i++) {
      const p = pt(i, R + 20);
      const v = dims[DIM_ORDER[i]] || 0;
      const lx = Math.max(34, Math.min(S - 34, p[0]));
      out.push('<text x="' + lx.toFixed(1) + '" y="' + (p[1] + 3).toFixed(1) + '" fill="#9fb0c0" font-size="10.5" ' +
        'text-anchor="middle" font-family="sans-serif">' + dimLabel(DIM_ORDER[i]) + ' ' + v + '</text>');
    }
    out.push('</svg>');
    return out.join('');
  }

  /** 展开区：雷达图 + 危险说明 + 规律结构 + 生路 + 遭遇记录 */
  function ghostDimsBlock(g, met) {
    const dims = dimsOf(g.id);
    const wrap = el('div', 'dimsWrap');
    const chart = el('div', 'radarBox');
    chart.innerHTML = radarSvg(g.id, 240);
    wrap.appendChild(chart);

    const side = el('div', 'dimsSide');
    if (dims.note) side.appendChild(el('div', 'dimsNote', '危险在哪：' + dims.note));
    const bars = el('div', 'dimBars');
    DIM_ORDER.forEach((k) => {
      const v = dims[k] || 0;
      const row = el('div', 'dimRow');
      row.appendChild(el('span', 'dimKey', dimLabel(k)));
      const track = el('div', 'dimTrack');
      const fill = el('div', 'dimFill');
      fill.style.width = v + '%';
      fill.style.background = v >= 80 ? '#ef5350' : v >= 60 ? '#ffb300' : '#26c6da';
      track.appendChild(fill);
      row.appendChild(track);
      row.appendChild(el('span', 'dimVal', String(v)));
      bars.appendChild(row);
    });
    side.appendChild(bars);

    // 规律结构（数量信息恒显示，具体文字按是否掌握给）
    const traps = (g.traps || []).length, neutral = (g.neutral || []).length, exits = (g.exits || []).length;
    const need = Math.min.apply(null, (g.exits || [{ needClues: 2 }]).map((e) => e.needClues || 2));
    side.appendChild(el('div', 'dimsNote', '规律结构：' + traps + ' 个陷阱（踩中即死）· ' + neutral +
      ' 条中性（擦身而过，失败会留不可逆侵蚀）· ' + exits + ' 条生路（最少需要 ' + need + ' 条线索撑开）'));
    const esc = (profile && profile.escaped && profile.escaped[g.id]) || 0;
    const seenNow = state && state.events && state.events.done &&
      state.events.done.indexOf('escape:' + g.id) >= 0;
    side.appendChild(el('div', 'dimsNote', '你的记录：' + (met ? '已遭遇过' : '还没遇到过') +
      (esc || seenNow ? '　从它手里走过生路 ' + (esc + (seenNow ? 1 : 0)) + ' 次' : '')));
    if (!met) side.appendChild(el('div', 'dimLocked', '（规律未掌握：先遭遇它、或调查这一带，才能看到它的杀人规矩）'));
    wrap.appendChild(side);
    return wrap;
  }

  /** 维度总览：全体厉鬼的 威胁 × 规律严苛 分布图 + 各维度 Top5 */
  function ghostDimsOverview(faced) {
    const box = el('div');
    const ids = Object.keys(C.ghosts);
    const W = 340, H = 300, pad = 40;
    const out = [];
    out.push('<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg">');
    out.push('<rect x="0" y="0" width="' + W + '" height="' + H + '" fill="#0a0f14"/>');
    // 坐标轴 + 网格
    out.push('<line x1="' + pad + '" y1="' + (H - pad) + '" x2="' + (W - 12) + '" y2="' + (H - pad) + '" stroke="#2b3846"/>');
    out.push('<line x1="' + pad + '" y1="' + pad + '" x2="' + pad + '" y2="' + (H - pad) + '" stroke="#2b3846"/>');
    for (let i = 1; i <= 4; i++) {
      const x = pad + ((W - pad - 12) * i) / 4;
      const y = (H - pad) - ((H - pad - pad) * i) / 4;
      out.push('<line x1="' + x + '" y1="' + pad + '" x2="' + x + '" y2="' + (H - pad) + '" stroke="#1a232c"/>');
      out.push('<line x1="' + pad + '" y1="' + y + '" x2="' + (W - 12) + '" y2="' + y + '" stroke="#1a232c"/>');
    }
    out.push('<text x="' + (W / 2) + '" y="' + (H - 10) + '" fill="#8b949e" font-size="11" text-anchor="middle">威胁 →</text>');
    out.push('<text x="12" y="' + (H / 2) + '" fill="#8b949e" font-size="11" text-anchor="middle" transform="rotate(-90 12 ' + (H / 2) + ')">规律严苛 →</text>');
    const px = (v) => pad + ((W - pad - 12) * v) / 100;
    const py = (v) => (H - pad) - ((H - pad - pad) * v) / 100;
    ids.forEach((gid) => {
      const d = dimsOf(gid);
      const g = C.ghosts[gid];
      const met = !!(faced || {})[gid];
      const r = 4 + ((d.counter || 0) / 100) * 8;
      const tone = d.threat >= 80 ? '#ef5350' : d.threat >= 60 ? '#ffb300' : '#26c6da';
      out.push('<circle cx="' + px(d.threat).toFixed(1) + '" cy="' + py(d.rule).toFixed(1) + '" r="' + r.toFixed(1) +
        '" fill="' + tone + '" fill-opacity="' + (met ? 0.85 : 0.35) + '" stroke="' + tone + '" stroke-width="1"/>');
      out.push('<text x="' + (px(d.threat) + r + 3).toFixed(1) + '" y="' + (py(d.rule) + 3.5).toFixed(1) +
        '" fill="' + (met ? '#c8d2dc' : '#6c7885') + '" font-size="9.5" font-family="sans-serif">' + g.name + '</text>');
    });
    out.push('</svg>');
    const chart = el('div', 'dimsOverviewChart');
    chart.innerHTML = out.join('');
    box.appendChild(el('div', 'sectionTitle', '厉鬼维度图 · 全体分布'));
    box.appendChild(el('div', 'hint', '横轴＝威胁（正面杀伤力），纵轴＝规律严苛（规矩有多难绕），气泡大小＝反制难度。' +
      '实心＝你已经遭遇过，半透明＝还没遇到。S 级集中在右上角。'));
    box.appendChild(chart);

    // 各维度 Top5
    const rank = el('div', 'dimRankGrid');
    DIM_ORDER.forEach((k) => {
      const top = ids.slice().sort((a, b) => (dimsOf(b)[k] || 0) - (dimsOf(a)[k] || 0)).slice(0, 5);
      const cell = el('div', 'dimRankCell');
      cell.appendChild(el('div', 'codexName', dimLabel(k) + ' 最高'));
      top.forEach((gid, i) => {
        cell.appendChild(el('div', 'codexDesc', (i + 1) + '. ' + C.ghosts[gid].name +
          '（' + C.ghosts[gid].level + ' 级）　' + (dimsOf(gid)[k] || 0)));
      });
      rank.appendChild(cell);
    });
    box.appendChild(el('div', 'sectionTitle', '六个维度各自的天花板'));
    box.appendChild(rank);
    return box;
  }

  function openCodex(tab) {
    const box = $('toolbox');
    box.style.display = '';
    clear(box);
    let active = tab || 'ach';
    const faced = Object.assign({}, (profile && profile.faced) || {});
    // 本局刚刚遭遇过的鬼：引擎在开遭遇时就写了 enc:<id>，图鉴要立刻反映，
    // 不能等到这局结算（否则"刚打完却还显示未遭遇"）。
    if (state && state.events && state.events.done) {
      state.events.done.forEach((d) => { if (typeof d === 'string' && d.indexOf('enc:') === 0) faced[d.slice(4)] = true; });
    }
    if (state && state.pending && state.pending.ghost) faced[state.pending.ghost] = true;
    const knownClues = Object.assign({}, (profile && profile.knownClues) || {});
    const idx = clueIndex();

    // 每页的角标数量：成就已解锁数 / 结局已收集数 / 厉鬼已遭遇数 / 本局线索数 / —
    const prog = P ? P.achievementProgress(profile) : { list: [], unlocked: 0, total: 0 };
    const endTotal = Object.keys(C.endings).length;
    const endHave = Object.keys((profile && profile.endings) || {}).length;
    const ghostTotal = Object.keys(C.ghosts).length;
    const ghostHave = Object.keys(faced).length;
    const clueHave = (state && state.clues ? state.clues.length : 0);

    box.appendChild(el('div', 'sectionTitle', '图鉴 · 收集进度'));
    box.appendChild(el('div', 'hint', '成就与结局跨局累积；厉鬼的杀人规律只有在你真正遭遇过之后才会写进图鉴。' +
      '其中「智慧级厉鬼」（S+）需要先在顶栏「AI 叙事设置」里绑定接口才会出现在你的世界里——' +
      '它们会像人一样跟你说话、谈条件，共 ' + (C.smartGhostIds || []).length + ' 只。'));
    box.appendChild(tabBar([
      { id: 'ach', label: '成就', count: prog.unlocked + '/' + prog.total },
      { id: 'end', label: '结局', count: endHave + '/' + endTotal },
      { id: 'ghost', label: '厉鬼', count: ghostHave + '/' + ghostTotal },
      { id: 'gdims', label: '维度图' },
      { id: 'clue', label: '线索', count: String(clueHave) },
      { id: 'stat', label: '战绩' },
    ], active === 'gdims' ? 'gdims' : active, openCodex));

    if (active === 'ach') {
      box.appendChild(el('div', 'hint', '已解锁 ' + prog.unlocked + ' / ' + prog.total +
        '　共 ' + (prog.byCat ? prog.byCat.length : 0) + ' 类。成就只影响档案，不影响本局数值。'));
      (prog.byCat || []).forEach((cat) => {
        const head = el('div', 'codexCat');
        head.appendChild(el('span', 'codexCatName', cat.name));
        head.appendChild(el('span', 'codexCatProgress', cat.unlocked + '/' + cat.total));
        head.appendChild(el('span', 'codexCatDesc', cat.desc));
        box.appendChild(head);
        const grid = el('div', 'codexGrid');
        prog.list.filter((a) => a.cat === cat.id).forEach((a) => {
          const cell = el('div', 'codexCell' + (a.unlocked ? ' got' : ' locked'));
          cell.appendChild(el('div', 'codexName', (a.unlocked ? '★ ' : '☆ ') + a.name));
          cell.appendChild(el('div', 'codexDesc', a.desc));
          cell.appendChild(el('div', 'codexMeta', a.unlocked
            ? ('已解锁' + (a.at ? '　' + new Date(a.at).toLocaleDateString() : ''))
            : '未解锁'));
          grid.appendChild(cell);
        });
        box.appendChild(grid);
      });
    }

    if (active === 'end') {
      box.appendChild(el('div', 'hint', '共 ' + endTotal + ' 种结局（个人 ' +
        Object.keys(C.endings).filter((k) => C.endings[k].kind === 'personal').length + '　世界 ' +
        Object.keys(C.endings).filter((k) => C.endings[k].kind === 'world').length +
        '）。未解锁的结局只显示类型，不剧透条件。'));
      const list = el('div', 'codexList');
      Object.keys(C.endings).forEach((eid) => {
        const e = C.endings[eid];
        const got = (profile && profile.endings && profile.endings[eid]) || 0;
        const row = el('div', 'codexRow' + (got ? ' got' : ' locked'));
        row.appendChild(el('div', 'codexName', (got ? '★ ' : '☆ ') + (got ? e.name : '？？？')));
        row.appendChild(el('div', 'codexDesc', got ? e.text : '（尚未达成）'));
        row.appendChild(el('div', 'codexMeta', (e.kind === 'world' ? '世界结局' : '个人结局') +
          '　' + (e.bad === true ? '悲剧' : e.bad === false ? '善终' : '开放') +
          (got ? '　已达成 ×' + got : '')));
        list.appendChild(row);
      });
      box.appendChild(list);
    }

    if (active === 'ghost' || active === 'gdims') {
      ghostView = active === 'gdims' ? 'gdims' : 'ghost';
      box.appendChild(tabBar([
        { id: 'ghost', label: '厉鬼档案' },
        { id: 'gdims', label: '维度图' },
      ], ghostView, function (t) { ghostView = t; openCodex(t === 'gdims' ? 'gdims' : 'ghost'); }));
      box.appendChild(el('div', 'hint', '遭遇过 ' + ghostHave + ' / ' + ghostTotal +
        ' 只。规律（线索）在你真的遭遇过它之后才会解锁，共 ' +
        Object.keys(idx).length + ' 条。点一行展开它的档案与维度雷达图。'));
      if (ghostView !== 'gdims') {
      const list = el('div', 'codexList');
      Object.keys(C.ghosts).forEach((gid) => {
        const g = C.ghosts[gid];
        const met = !!faced[gid];
        const row = el('div', 'codexRow clickable' + (met ? ' got' : ''));
        const head = el('div', 'codexHead');
        head.appendChild(el('span', 'lvl badgetone-' + (LEVEL_TONE[g.level] || 'accent'), g.level + ' 级'));
        if (g.smart) head.appendChild(el('span', 'lvl badgetone-smart', '智慧级 · 需接 AI'));
        head.appendChild(el('span', 'codexName', (met ? '★ ' : '☆ ') + g.name));
        head.appendChild(el('span', 'codexMeta', met ? '已遭遇（点开看档案）' : '未遭遇（点开看档案）'));
        row.appendChild(head);
        row.appendChild(el('div', 'codexDesc', '属地：' + (g.tie || '不明') +
          '　危险系数 ' + (g.penalty || 0) + '／60'));
        row.appendChild(el('div', 'codexQuote', g.encounter || ''));
        const known = (g.clues || []).filter((c) => knownClues[c.id] ||
          (state && state.clues && state.clues.indexOf(c.id) >= 0));
        if (known.length) {
          known.forEach((c) => row.appendChild(el('div', 'codexClue', '· ' + c.text)));
        } else {
          (g.clues || []).forEach(() => row.appendChild(el('div', 'codexClue locked', '· ？？？（规律未掌握）')));
        }
        // 展开区：雷达图 + 规律结构 + 生路 + 遭遇记录（默认收起，点行展开）
        const detail = el('div', 'codexDetail');
        detail.style.display = 'none';
        let built = false;
        row.onclick = () => {
          if (!built) {
            built = true;
            detail.appendChild(ghostDimsBlock(g, met));
          }
          detail.style.display = detail.style.display === 'none' ? '' : 'none';
        };
        row.appendChild(detail);
        list.appendChild(row);
      });
      box.appendChild(list);
      } else {
        box.appendChild(ghostDimsOverview(faced));
      }
    }

    if (active === 'clue') {
      const cur = (state && state.clues) || [];
      box.appendChild(el('div', 'hint', '本局已掌握 ' + cur.length + ' 条；跨局累计 ' +
        Object.keys(knownClues).length + ' 条。线索是生路唯一的来源——没有线索，遭遇里只有陷阱和中性项。'));
      const list = el('div', 'codexList');
      if (!cur.length) {
        list.appendChild(el('div', 'codexRow locked', '本局还没有掌握任何线索。去调查、搜档、问人，把鬼的规矩拼出来。'));
      }
      cur.forEach((cid) => {
        const c = idx[cid];
        const row = el('div', 'codexRow got');
        row.appendChild(el('div', 'codexName', c ? c.ghostName + '（' + c.level + ' 级）' : cid));
        row.appendChild(el('div', 'codexClue', c ? c.text : '（旧版本线索：' + cid + '）'));
        list.appendChild(row);
      });
      const missing = Object.keys(idx).filter((cid) => cur.indexOf(cid) < 0);
      if (missing.length) {
        list.appendChild(el('div', 'hint', '还有 ' + missing.length + ' 条线索没有掌握（分布在你还没遭遇或还没调查的厉鬼身上）。'));
      }
      box.appendChild(list);
    }

    if (active === 'stat') {
      const r = (profile && profile.runs) || { total: 0, died: 0, won: 0, byDiff: {} };
      const best = (profile && profile.best) || { turn: 0, byDiff: {} };
      box.appendChild(el('div', 'hint', '本机档案（带校验和，手改无效）。这一档只统计，不参与判定。'));
      const kv = el('div', 'codexList');
      const rowOf = (k, v) => {
        const row = el('div', 'codexRow');
        row.appendChild(el('div', 'codexName', k));
        row.appendChild(el('div', 'codexDesc', String(v)));
        return row;
      };
      kv.appendChild(rowOf('总局数', r.total));
      kv.appendChild(rowOf('死亡次数', r.died));
      kv.appendChild(rowOf('非死亡结局', r.won));
      kv.appendChild(rowOf('最佳存活', best.turn + ' 天'));
      kv.appendChild(rowOf('周目点数', (profile ? profile.points : 0) + '（累计获得 ' + (profile ? profile.earned : 0) + '）'));
      const diffs = Object.keys(r.byDiff || {}).map((d) => d + '×' + r.byDiff[d]).join('　') || '—';
      kv.appendChild(rowOf('难度分布', diffs));
      const byBest = Object.keys(best.byDiff || {}).map((d) => d + ' ' + best.byDiff[d] + '天').join('　') || '—';
      kv.appendChild(rowOf('各难度最佳', byBest));
      if (state) {
        kv.appendChild(rowOf('当前局', '第 ' + state.turn + ' 天　' + (state.over ? '已结束' : '进行中') +
          '　' + (state.pending ? '遭遇中' : '自由行动')));
      }
      box.appendChild(kv);
    }

    const close = el('button', 'btn small', '关闭');
    close.onclick = () => { box.style.display = 'none'; };
    box.appendChild(close);
  }

  function autoSave() {
    // 只在「每天开始」这一干净边界自动存档（遭遇中途不覆盖，避免歧义）
    if (state && !state.over && state.phase === 'day' && !state.actionTakenToday) {
      LS.set('rs_autosave', E.serialize(state));
    }
  }
  function saveToFile() {
    const text = E.serialize(state);
    const blob = new Blob([text], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '神秘复苏-存档-第' + state.turn + '天.json';
    a.click();
    URL.revokeObjectURL(a.href);
  }
  function loadFromText(text) {
    const r = E.deserialize(String(text || '').trim());
    if (r.error) {
      addLog('warn', '【载入失败】' + r.error + '（存档被修改过，或被截断）');
      return false;
    }
    state = r.state;
    clear($('log'));
    addLog('', '【读档】第 ' + state.turn + ' 天（第 ' + state.chapter + ' 章），难度：' + (state.difficulty === 'hard' ? '极难' : '标准'));
    if (state.over) renderOver();
    renderPanel();
    lastSceneTurn = 0;
    if (state.pending) { renderEncounterPreview(); renderChoices(E.availableActions(state)); }
    else { renderScene(true); renderSceneArt(state); renderChoices(E.availableActions(state)); }
    return true;
  }

  function startGame() {
    // 二周目继承：先校验点数（档案带校验和，改档会在载入时被拒）
    let legacy = null;
    if (selected.legacy && profile && P && C.legacyOptions[selected.legacy]) {
      const cost = C.legacyOptions[selected.legacy].cost;
      if (profile.points >= cost) {
        profile.points -= cost;
        legacy = selected.legacy;
        P.saveProfile(profile);
      } else {
        legacy = null;
      }
      selected.legacy = null; // 只对本次开局生效
    }
    state = E.createGame({
      pack: selected.pack, difficulty: selected.difficulty,
      custom: selected.difficulty === 'custom' ? selected.custom : null,
      seed: selected.seed || undefined, contentLevel: selected.level,
      city: selected.city, era: selected.era,
      legacy: legacy,
    });
    $('panel').style.display = '';
    clear($('log'));
    addLog('', '【开局】' + C.packs[selected.pack].blurb);
    const ci = cityInfo(state), ei = eraInfo(state);
    if (ci) addLog('', '【落地】' + ci.name + '（' + ci.src + '，' + (state.cityRandom ? '随机' : '自选') + '）——' + ci.desc);
    if (ei) addLog('', '【时期】' + ei.name + '（' + ei.src + '，' + (state.eraRandom ? '随机' : '自选') + '）——' + ei.desc);
    // 继承提示必须写在 clear(log) 之后，否则会被清掉（玩家花了点数却看不到反馈）
    if (legacy) {
      addLog('', '【二周目继承】' + C.legacyOptions[legacy].name + '：' + C.legacyOptions[legacy].desc +
        '（已消耗 ' + C.legacyOptions[legacy].cost + ' 点，剩余 ' + (profile ? profile.points : 0) + ' 点）');
    }
    addLog('muted', '规则引擎 ' + C.meta.version + '　种子：' + state.seed + '　难度：' + (state.tuning ? state.tuning.name : '标准') +
      '　内容分级：' + ({ A: 'A 影视级', B: 'B 写实级', C: 'C 无限制' }[state.contentLevel] || 'A') +
      '（同一种子+同一串选择 = 同一结果；判定永不由运气之外的因素改变）');
    renderPanel();
    lastSceneTurn = 0;
    renderScene(true);
    renderSceneArt(state);
    renderChoices(E.availableActions(state));
  }

  /* --------------------------------------------- 本机账户与 API 绑定面板 */
  const V = window.RSVault || null;

  function aiBadge() {
    if (!V || !V.hasVault()) return 'AI：未设账户';
    const u = V.userName();
    if (!V.isUnlocked()) return 'AI：' + u + '（未登录）';
    return 'AI：' + u + (V.hasAI() ? '（已绑定）' : '（未绑定）');
  }

  function refreshAIState() {
    const cfg = window.RS_AI;
    $('aiState').textContent = aiBadge();
    if (!V || !V.isUnlocked() || !V.hasAI()) {   // 未登录 / 未绑定 → 一律回到纯程序叙事
      cfg.enabled = false;
      cfg.endpoint = '';
      cfg.apiKey = '';
      return;
    }
    V.getAI().then((ai) => {
      if (!ai || ai.error) { cfg.enabled = false; return; }
      cfg.endpoint = ai.endpoint || '';
      cfg.apiKey = ai.apiKey || '';
      cfg.model = ai.model || 'deepseek-chat';
      cfg.enabled = !!cfg.endpoint;
      $('aiState').textContent = aiBadge();
    });
  }

  function note(el2, text, tone) {
    const n = el('div', 'hint', text);
    if (tone === 'warn') n.style.color = 'var(--danger)';
    if (tone === 'ok') n.style.color = 'var(--ok)';
    el2.appendChild(n);
    return n;
  }

  function renderAccountPanel(box) {
    if (!V) { note(box, '当前环境不支持本机账户（缺少 WebCrypto）', 'warn'); return; }
    box.appendChild(el('div', 'sectionTitle', 'AI 叙事需要绑定本机账户（API 配置会加密保存）'));
    note(box, '说明：本机账户只是把 API 配置用你的密码加密存在本地——没登录就看不到、改不了。' +
      '它挡得住同机翻 localStorage 与手改存档，挡不住能改页面代码或知道密码的人；也没有找回密码与跨设备同步（单文件本地游戏做不到）。');

    if (!V.hasVault()) {
      // ---- 状态一：未设账户 ----
      const u = el('input', 'input'); u.id = 'acc_user'; u.placeholder = '账户名（例如 baisonghao）';
      const p = el('input', 'input'); p.id = 'acc_pass'; p.type = 'password'; p.placeholder = '密码（至少 ' + V.MIN_PASS + ' 位）';
      const p2 = el('input', 'input'); p2.id = 'acc_pass2'; p2.type = 'password'; p2.placeholder = '再输一次密码';
      box.appendChild(u); box.appendChild(p); box.appendChild(p2);
      // 如果旧版本在档案里留过明文配置，这里带出来供一次性绑定
      const legacy = (profile && profile.ai && profile.ai.endpoint) ? profile.ai : null;
      const ep = el('input', 'input'); ep.id = 'ai_endpoint'; ep.placeholder = 'AI 接口地址（可留空，稍后再绑）';
      const k = el('input', 'input'); k.id = 'ai_apiKey'; k.type = 'password'; k.placeholder = 'API Key（可留空）';
      const m = el('input', 'input'); m.id = 'ai_model'; m.placeholder = '模型名';
      ep.value = legacy ? (legacy.endpoint || '') : '';
      k.value = legacy ? (legacy.apiKey || '') : '';
      m.value = (legacy && legacy.model) || 'deepseek-chat';
      box.appendChild(el('div', 'sectionTitle', '顺带绑定 AI 配置（可选）'));
      box.appendChild(ep); box.appendChild(k); box.appendChild(m);
      if (legacy) note(box, '检测到旧版本存在档案里的明文配置，已带出——绑定后我会把它从档案里删掉。');
      const row = el('div', 'row');
      const go = el('button', 'btn small primary', '创建账户并绑定');
      go.onclick = async () => {
        if (p.value !== p2.value) { note(box, '两次输入的密码不一致', 'warn'); return; }
        const ai = ep.value.trim() ? { endpoint: ep.value.trim(), apiKey: k.value.trim(), model: m.value.trim() || 'deepseek-chat' } : null;
        const r = await V.register(u.value, p.value, ai);
        if (r.error) { note(box, r.error, 'warn'); return; }
        // 绑定成功：清掉档案里的明文（如果有人看过，它就不该再留一份）
        if (legacy && P && profile) { profile.ai = { endpoint: '', apiKey: '', model: 'deepseek-chat', enabled: false }; P.saveProfile(profile); }
        refreshAIState();
        addLog('muted', '【账户】已创建本机账户「' + r.user + '」' + (r.bound ? '，AI 配置已加密绑定。' : '（尚未绑定 AI 配置）。'));
        box.style.display = 'none';
      };
      const cancel = el('button', 'btn small', '关闭');
      cancel.onclick = () => { box.style.display = 'none'; };
      row.appendChild(go); row.appendChild(cancel);
      box.appendChild(row);
      return;
    }

    // ---- 状态二：有账户但未登录 ----
    if (!V.isUnlocked()) {
      note(box, '本机账户：「' + V.userName() + '」' + (V.hasAI() ? '（已绑定 AI 配置，加密保存）' : '（未绑定 AI 配置）'));
      note(box, '未登录时 AI 配置不可见、不可改，游戏按纯程序叙事运行。', 'warn');
      const p = el('input', 'input'); p.id = 'acc_pass'; p.type = 'password'; p.placeholder = '输入账户密码';
      box.appendChild(p);
      const row = el('div', 'row');
      const go = el('button', 'btn small primary', '登录');
      go.onclick = async () => {
        const r = await V.unlock(p.value);
        if (r.error) { note(box, r.error, 'warn'); return; }
        refreshAIState();
        addLog('muted', '【账户】已登录「' + r.user + '」' + (r.bound ? '，AI 叙事已启用（密钥只在本页内存里，刷新需重新登录）。' : '，还未绑定 AI 配置。'));
        box.style.display = 'none';
      };
      p.addEventListener('keydown', (ev) => { if (ev.key === 'Enter') go.click(); });
      const cancel = el('button', 'btn small', '关闭');
      cancel.onclick = () => { box.style.display = 'none'; };
      row.appendChild(go); row.appendChild(cancel);
      box.appendChild(row);
      return;
    }

    // ---- 状态三：已登录，可查看/修改绑定 ----
    note(box, '已登录：「' + V.lockedUser() + '」。下面是绑定到该账户的 AI 配置（未绑定则留空）。', 'ok');
    const cur = { endpoint: '', apiKey: '', model: 'deepseek-chat' };
    const build = (ai) => {
      if (ai && !ai.error) { cur.endpoint = ai.endpoint || ''; cur.apiKey = ai.apiKey || ''; cur.model = ai.model || 'deepseek-chat'; }
      const ep = el('input', 'input'); ep.id = 'ai_endpoint'; ep.value = cur.endpoint; ep.placeholder = '接口地址（留空=不用 AI，回到程序叙事）';
      const k = el('input', 'input'); k.id = 'ai_apiKey'; k.type = 'password'; k.value = cur.apiKey; k.placeholder = 'API Key';
      const m = el('input', 'input'); m.id = 'ai_model'; m.value = cur.model;
      box.appendChild(ep); box.appendChild(k); box.appendChild(m);
      const row = el('div', 'row');
      const save = el('button', 'btn small primary', '保存到账户');
      save.onclick = async () => {
        const r = await V.putAI({ endpoint: ep.value, apiKey: k.value, model: m.value });
        if (r.error) { note(box, r.error, 'warn'); return; }
        refreshAIState();
        addLog('muted', '【账户】AI 配置已加密绑定到「' + V.userName() + '」。');
        box.style.display = 'none';
      };
      const unbind = el('button', 'btn small', '解绑');
      unbind.onclick = () => {
        const r = V.clearAI();
        if (r.error) { note(box, r.error, 'warn'); return; }
        refreshAIState();
        addLog('muted', '【账户】已解绑 AI 配置，回到纯程序叙事。');
        box.style.display = 'none';
      };
      const logout = el('button', 'btn small', '登出');
      logout.onclick = () => {
        V.lock();
        refreshAIState();
        addLog('muted', '【账户】已登出，AI 配置重新变为不可见。');
        box.style.display = 'none';
      };
      const del = el('button', 'btn small danger', '删除账户');
      del.onclick = async () => {
        const pw = (document.querySelector('#acc_delpass') || {}).value || '';
        const r = await V.destroy(pw);
        if (r.error) { note(box, r.error, 'warn'); return; }
        refreshAIState();
        addLog('muted', '【账户】本机账户已删除（含加密保存的 AI 配置）。');
        box.style.display = 'none';
      };
      const row2 = el('div', 'row');
      const dp = el('input', 'input'); dp.id = 'acc_delpass'; dp.type = 'password'; dp.placeholder = '删除账户需再输一次密码';
      const cancel = el('button', 'btn small', '关闭');
      cancel.onclick = () => { box.style.display = 'none'; };
      row.appendChild(save); row.appendChild(unbind); row.appendChild(logout); row.appendChild(cancel);
      box.appendChild(row);
      box.appendChild(el('div', 'sectionTitle', '危险操作'));
      box.appendChild(dp);
      const row3 = el('div', 'row');
      row3.appendChild(del);
      box.appendChild(row3);
    };
    V.getAI().then((ai) => build(ai && ai.error ? null : ai)).catch(() => build(null));
  }

  // 供截图/测试核对：列出全部母题与生成 SVG
  window.RSUI = { motifList: motifList, sceneSvg: sceneSvg, motifOf: motifOf, MOTIFS: MOTIFS, openGallery: openGallery, openCodex: openCodex, clueIndex: clueIndex,
    sceneSvgV2: sceneSvgV2, SAMPLES_V2: SAMPLES_V2, radarSvg: radarSvg, dimsOf: dimsOf };

  /* ------------------------------------------------------------ 初始化 */
  window.addEventListener('DOMContentLoaded', function () {
    $('btnSave').onclick = saveToFile;
    $('btnLoad').onclick = function () { openToolbox('load'); };
    $('btnCard').onclick = function () {
      const txt = E.serialize(state || E.createGame({}));
      addLog('muted', '【存档卡】' + txt.slice(0, 240) + '…（完整内容用「导出存档」保存）');
    };
    $('btnAI').onclick = function () { openToolbox('ai'); };
    if ($('btnGuide')) $('btnGuide').onclick = openGuide;
    if ($('btnGallery')) $('btnGallery').onclick = openGallery;
    if ($('btnCodex')) $('btnCodex').onclick = function () { openCodex('ach'); };
    if ($('btnPanel')) $('btnPanel').onclick = function () { document.body.classList.toggle('panelOpen'); };
    if ($('jumpNew')) $('jumpNew').onclick = scrollLog;
    // 手动往上翻时给出「回到最新」提示
    const lw = $('logWrap');
    if (lw) lw.addEventListener('scroll', function () {
      const j = $('jumpNew');
      if (!j) return;
      const away = lw.scrollHeight - lw.scrollTop - lw.clientHeight > 90;
      j.style.display = away ? '' : 'none';
    });
    $('btnCustom').onclick = function () {
      const v = $('customInput').value;
      if (!v.trim()) return;
      $('customInput').value = '';
      onChoice('__custom__', v);
    };
    refreshAIState();   // 刷新后一律回到"未登录"，AI 配置留在加密保管库里
    showMenu();
    // 首次进入自动弹世界观速览（没看过小说也能玩明白）
    if (!LS.get('rs_seen_guide', 0)) { LS.set('rs_seen_guide', 1); openGuide(); }
  });
})();
</script>
</body>
</html>
