    const city = CONTENT.resolveAxis(CONTENT.cities, opts.city, seed, 'cityPick');
    const era = CONTENT.resolveAxis(CONTENT.eras, opts.era, seed, 'eraPick');
    const cityRandom = !opts.city || opts.city === 'random';
    const eraRandom = !opts.era || opts.era === 'random';

    const stats = Object.assign({}, pack.stats);
    const money = Object.assign({ contribution: 0 }, pack.money);

    const state = {
      v: 1,
      seed: seed,
      seedInt: hashStr(seed),
      turn: 0,
      chapter: 1,
      phase: 'day',
      over: null,            // 结局 / 死因
      difficulty: difficulty,
      tuning: tuning,
      custom: opts.custom || null,
      pack: packId,
      city: city.id,
      era: era.id,
      cityRandom: cityRandom,
      eraRandom: eraRandom,
      contentLevel: opts.contentLevel || 'A',
      stats: stats,
      money: money,
      items: pack.items.map((id) => ({ id: id, uses: CONTENT.items[id].uses || 1 })),
      contracts: pack.contracts.slice(),
      clues: [],
      bestiary: {},
      relationships: [],
      wife: null,
      children: 0,
      place: city.place || pack.place || 'city',
      flags: Object.assign({ safehouse: 0, disguise: 0, intel: 0, marks: 0, favor: 0 }, pack.flags || {}),
      attempts: {},
      chapterReduction: 0,   // 本章已使用的劫难降低量（上限 5）
      chapterPurge: 0,       // 本章已用「处置灵异源头」次数（上限 3，不受 5 点上限约束）
      purgeRisk: 0,          // 本次处置带来的"当天遭遇率"加成（当天有效）
      chapterSpendings: 0,   // 本章收入（上限 500 万）
      clueGains: 0,          // 本章线索收获次数（旧字段，保留兼容）
      lastClueTurn: -99,     // 上次获得线索的天数（冷却 3 天）
      humanityGains: 0,      // 本章已回复的人性总量（上限 5）
      freezeUses: 0,         // 死机法使用次数（越用越难）
      mechUsed: {},          // 玩法机制使用记录（id → 最后一次触发的回合）
      mechRequest: null,     // 玩家点名要触发的玩法
      mechLog: [],           // 最近触发的玩法（供界面显示）
      actionTakenToday: false, // 每天只能有一个主动作（防读档复制行动）
      worldAdvance: 0,
      calamityEscapes: 0,
      events: { fired: [], done: [] },
      pending: null,         // 待玩家选择的遭遇
      meta: Object.assign({ deaths: 0, bestTurn: 0 }, opts.meta || {}),
      ledger: [],
      ledgerStart: {},
      integrity: [],
      logs: [],
    };
    state.pending = null;
    state.peakGold = stats.gold || 0;
    // 鬼域层数（目前只有杨戬开局有）：致死代价改为消耗一层鬼域，层数用尽才会真的死
    state.godLayers = pack.godLayers || 0;
    state.notes = [];     // 引擎在流程里产生的提示，由 resolve 带进叙事

    // 二周目继承：只改初始值，不参与任何判定
    state.legacy = opts.legacy || null;
    const leg = state.legacy && CONTENT.legacyOptions ? CONTENT.legacyOptions[state.legacy] : null;
    if (leg) applyEffects(state, leg.effects, '二周目继承·' + leg.name);

    // 落地与时期的环境修正（同样只改初始值，全部经唯一写入点记账）
    if (era.effects && era.effects.length) applyEffects(state, era.effects, '时期·' + era.name);
    if (city.effects && city.effects.length) applyEffects(state, city.effects, '落地·' + city.name);

    // 劫难值下限必须在**所有开局修正之后**才算：P1 的防苟活底线是"开局初始值 − 5"，
    // 而"初始值"指的是玩家真正拿到手的那个数。原来在应用时代/城市加成之前就固定了，
    // 于是像末日（劫难 +15）这种时期会白送 15 点可反复压低的余量，底线被悄悄放宽。
    state.calamityFloor = Math.max(0, state.stats.calamity - 5);

    startTurn(state);        // 进入第 1 天
    return state;
  }

  /** 缓存：从 state 取落地/时期定义（老存档没有这两个字段 → 退回原著 2018 + 普通城市） */
  function cityOf(state) {
    if (!state.city) state.city = 'dachang';
    return CONTENT.cities[state.city] || CONTENT.cities.dachang;
  }
  function eraOf(state) {
    if (!state.era) state.era = 'y2018';
    return CONTENT.eras[state.era] || CONTENT.eras.y2018;
  }
  /**
   * 某只鬼此刻是否允许出现（分级门禁）：
   *  · 在本时期世界时钟上有排期的鬼：S/A 级必须等到排期那天，C/B 级可以提前游荡进来；
   *  · 不在时钟上的鬼（城市本地鬼、跨时期游荡鬼）：S 级第 20 天后、A 级第 3 天后才出现。
   * 目的：城市与时期是可自选/可随机的，不能让一次随机的落地选择在开局第一天
   * 就撞上 S 级本地鬼（如名主祠的真名鬼，罚分 60 ≈ 当场暴毙）。
   */
  function ghostAllowedNow(state, gid) {
    const g = CONTENT.ghosts[gid];
    if (!g) return false;
    const sched = eraOf(state).events.filter((e) => e.ghost === gid)[0];
    if (sched) return state.turn >= sched.turn || g.level === 'C' || g.level === 'B';
    if (g.level === 'S') return state.turn >= 20;
    if (g.level === 'A') return state.turn >= 3;
    return true;
  }

  /** 该局可出现的厉鬼池：时期时钟里的鬼 ∪ 落地城市的本地鬼 ∪ 各年代都有的低阶杂鬼 */
  function ghostPoolOf(state) {
    const era = eraOf(state); const city = cityOf(state);
    const out = [];
    for (const ev of era.events) if (out.indexOf(ev.ghost) < 0) out.push(ev.ghost);
    for (const g of (city.ghosts || [])) if (out.indexOf(g) < 0) out.push(g);
    // 低阶厉鬼（C/B）不受时期限制：任何年代都有这种"杂鬼"在游荡。
    // 没有这一条，开局头几天候选池可能只剩 1 只（其余 S/A 都还没排期）→ 必然连着两次撞同一只鬼。
    for (const gid of Object.keys(CONTENT.ghosts)) {
      const g = CONTENT.ghosts[gid];
      if (g && (g.level === 'C' || g.level === 'B') && out.indexOf(gid) < 0) out.push(gid);
    }
    return out;
  }

  /* --------------------------------------------------- 唯一写入点 setPath */
  function getPath(obj, path) {
    const parts = path.split('.');
    let cur = obj;
    for (let i = 0; i < parts.length; i++) cur = cur ? cur[parts[i]] : undefined;
    return cur;
  }
  function dynamicBounds(state, path) {
    if (path === 'stats.humanity') {
      return [0, clamp(100 - state.stats.erosion, 0, 100)];
    }
    if (path === 'stats.calamity') {
      return [state.calamityFloor, 100];
    }
    return boundsOf(path) || [0, 0];
  }
  /**
   * 唯一写入点。raw=true 时跳过动态钳制（仅引擎内部用于初始化/世界推进）。
   * 每次写入都会记账，供回合末守恒校验。
   * 依赖关系：侵蚀上升会压缩人性上限，此处在同一入口内连带收紧并记账，
   * 避免出现「人性高于上限」的状态（模拟测试抓到的真实缺陷）。
   */
  function setPath(state, path, value, reason, opts) {
    opts = opts || {};
    const b = dynamicBounds(state, path);
    const before = getPath(state, path);
    if (typeof before !== 'number') {
      state.integrity.push('写入未登记字段: ' + path + ' (' + reason + ')');
      return false;
    }
    let v = int(value);
    if (!opts.raw) v = clamp(v, b[0], b[1]);
    const parts = path.split('.');
    let cur = state;
    for (let i = 0; i < parts.length - 1; i++) cur = cur[parts[i]];
    cur[parts[parts.length - 1]] = v;
    state.ledger.push({ path: path, before: before, after: v, delta: v - before, reason: reason });
    if (path === 'money.gold' && v > (state.peakGold || 0)) state.peakGold = v; // 峰值黄金（成就用）

    // 侵蚀上升 → 人性上限收缩（连带钳制，必须记账）
    if (path === 'stats.erosion' && !state._clamping) {
      state._clamping = true;
      const cap = clamp(100 - state.stats.erosion, 0, 100);
      if (state.stats.humanity > cap) {
        const hb = state.stats.humanity;
        state.stats.humanity = cap;
        state.ledger.push({
          path: 'stats.humanity', before: hb, after: cap, delta: cap - hb,
          reason: '侵蚀上升压缩人性上限',
        });
      }
      state._clamping = false;
    }
    return true;
  }
  function addPath(state, path, delta, reason, opts) {
    const before = getPath(state, path);
    if (typeof before !== 'number') {
      state.integrity.push('写入未登记字段: ' + path + ' (' + reason + ')');
      return false;
    }
    return setPath(state, path, before + int(delta), reason, opts);
  }

  /* -------------------------------------------------------------- 效果表 */
  /**
   * 现金/存款收入**统一入口**：所有正向收入都必须经过它，受"本章收入上限"约束。
   * 为什么必须统一：收入上限只要漏掉任何一条路径，那条路径就是刷钱口
   * （历史教训：大澳市本地行动 +40 万/天不走上限；机制事件的现金也曾经绕过上限）。
   * opts.raw = true → 不计入上限（仅限开局初始化、结局结算等明确例外）。
   */
  function gainCash(state, key, amount, reason, opts) {
    if (amount <= 0 || (opts && opts.raw) || state.turn === 0 || state.over) {
      addPath(state, 'money.' + key, amount, reason);
      return { applied: amount, capped: 0 };
    }
    const cap = tuningOf(state).incomeCap;
    const room = Math.max(0, cap - state.chapterSpendings);
    const applied = Math.min(amount, room);
    if (applied > 0) {
      state.chapterSpendings += applied;
      addPath(state, 'money.' + key, applied, reason);
    }
    return { applied: applied, capped: amount - applied };
  }

  // 声明式效果：引擎统一校验前置条件与代价，前端隐藏不算数。
  function applyEffects(state, effects, reason) {
    const out = [];
    for (const e of effects || []) {
      if (e.if && !checkCond(state, e.if)) {
        out.push({ skipped: true, effect: e, reason: reason });
        continue;
      }
      switch (e.k) {
        case 'stat':
          addPath(state, 'stats.' + e.key, e.v, reason);
          break;
        case 'money': {
          // 正向现金/存款一律走收入上限；黄金、贡献、负向支出不受影响
          const isGain = e.v > 0 && (e.key === 'cash' || e.key === 'deposit');
          if (isGain) {
            const r = gainCash(state, e.key, e.v, reason, { raw: !!e.raw });
            if (r.capped) out.push({ cappedCash: r.capped, reason: reason });
          } else {
            addPath(state, 'money.' + e.key, e.v, reason);
          }
          break;
        }
        case 'flag':
          addPath(state, 'flags.' + e.key, e.v, reason);
          break;
        case 'itemAdd': {
          const def = CONTENT.items[e.id];
          if (!def) { state.integrity.push('未知道具: ' + e.id); break; }
          state.items.push({ id: e.id, uses: def.uses || 1 });
          out.push({ got: e.id });
          break;
        }
        case 'itemUse': {
          const it = state.items.find((x) => x.id === e.id);
          if (!it) { out.push({ noItem: e.id }); break; }
          it.uses -= 1;
          if (it.uses <= 0) state.items = state.items.filter((x) => x !== it);
          out.push({ used: e.id });
          break;
        }
        case 'clue': {
          if (!state.clues.includes(e.id)) {
            state.clues.push(e.id);
            out.push({ clue: e.id });
          }
          break;
        }
        case 'bestiary': {
          const b = state.bestiary[e.id] || (state.bestiary[e.id] = { known: true, clues: 0, tamed: false });
          b.known = true;
          if (e.clues) b.clues += e.clues;
          out.push({ bestiary: e.id });
          break;
        }
        default:
          state.integrity.push('未知效果类型: ' + e.k);
      }
    }
    return out;
  }

  function checkCond(state, cond) {
    if (typeof cond === 'function') return !!cond(state);
    return false;
  }

  /* ------------------------------------------------------- 劫难降低（P1） */
  const CHAPTER_REDUCTION_CAP = 5; // 补丁 P1.4：每章由 4.2 手段带来的总降幅 ≤5
  // 「处置灵异源头」（主动压劫难）：不受上面那条 5 点上限约束（它是本设计里唯一能追上世界推进的手段），
  // 但代价是当天遭遇率大幅上升 + 每章限 3 次 + 递减收益 + 劫难值下限仍然生效。
  const PURGE_CALM = [8, 5, 3];      // 本章第 1/2/3 次的劫难降幅
  const PURGE_RISK = [15, 25, 35];   // 对应这次给"当天遭遇率"的加成（百分点）
  const PURGE_COST = [
    [{ k: 'stat', key: 'sanity', v: -6 }, { k: 'stat', key: 'stamina', v: -10 }, { k: 'stat', key: 'pollution', v: 6 }],
    [{ k: 'stat', key: 'sanity', v: -8 }, { k: 'stat', key: 'stamina', v: -16 }, { k: 'stat', key: 'pollution', v: 10 }],
    [{ k: 'stat', key: 'sanity', v: -10 }, { k: 'stat', key: 'stamina', v: -22 }, { k: 'stat', key: 'pollution', v: 15 }],
  ];
  const PURGE_PER_CHAPTER = 3;
  const CHAPTER_HUMANITY_CAP = 5;  // 补丁 P7.5：每章人性回复总量上限 5 点
  const CLUE_COOLDOWN = 3;         // 线索：每 3 天最多一次实质收获（防刷线索开全图）

  /** 人性回复：受每章总量上限约束（防止用治疗/配偶把人性刷满） */
  function gainHumanity(state, amount, reason) {
    const left = CHAPTER_HUMANITY_CAP - (state.humanityGains || 0);
    if (left <= 0) return { ok: false, why: '本章人性回复额度已用尽（上限 ' + CHAPTER_HUMANITY_CAP + '）' };
    const applied = Math.min(left, amount);
    addPath(state, 'stats.humanity', applied, reason);
    state.humanityGains = (state.humanityGains || 0) + applied;
    return { ok: true, applied: applied };
  }
  function reduceCalamity(state, amount, reason) {
    const left = CHAPTER_REDUCTION_CAP - state.chapterReduction;
    if (left <= 0) return { ok: false, why: '本章降低额度已用尽（上限 ' + CHAPTER_REDUCTION_CAP + '）' };
    const applied = Math.min(left, Math.abs(amount));
    const before = state.stats.calamity;
    addPath(state, 'stats.calamity', -applied, reason);
    const real = before - state.stats.calamity;
    state.chapterReduction += real;
    if (state.stats.calamity <= state.calamityFloor && real < applied) {
      return { ok: true, applied: real, capped: '已达劫难值下限（' + state.calamityFloor + '），降低手段失效' };
    }
    return { ok: true, applied: real };
  }

  /** 处置灵异源头专用：绕过"每章降幅 ≤5"的上限，但仍然受劫难值下限约束（下限由 bounds 钳制） */
  function purgeCalamity(state, amount, reason) {
    const before = state.stats.calamity;
    addPath(state, 'stats.calamity', -Math.abs(amount), reason);
    const real = before - state.stats.calamity;
    const floored = real < Math.abs(amount);
    return { applied: real, floored: floored };
  }

  /* ------------------------------------------------------------ 世界推进 */
  /** 当前手感参数（难度档位 / 自定义旋钮），老存档缺失时按标准档兜底 */
  function tuningOf(state) {
    if (state.tuning && typeof state.tuning.worldMult === 'number') return state.tuning;
    const id = state.difficulty === 'hard' ? 'nightmare' : state.difficulty;
    return CONTENT.resolveTuning(id, state.custom);
  }

  function worldAdvanceAmount(state) {
    const tu = tuningOf(state);
    let base = 3;
    if (state.chapter >= 10) base = 8;
    else if (state.chapter >= 5) base = 5;
    base = Math.max(1, Math.round(base * tu.worldMult));
    base += state.flags.marks * 1;                 // 灾厄印记：后续增长 +20%（简化为 +1/层）
    base += ((cityOf(state).mods && cityOf(state).mods.advance) || 0)
      + ((eraOf(state).mods && eraOf(state).mods.advance) || 0);
    return Math.max(1, base);
  }

  /* -------------------------------------------------- 玩法轮换（12.1） */
  /**
   * 每回合从 152 条机制里抽 1~3 条施加：
   *  · 同一机制 3 回合内不重复；
   *  · 连续两回合不重复同一大类（重大节点强制换玩法）；
   *  · 玩家点名（自定义行动里写到机制名）优先触发。
   * 全部效果经 applyEffects 走账本，受唯一写入点与守恒校验约束。
   */
  const MECH_ROTATE = 3;

  function mechEligible(state, m) {
    if (m.pre && !m.pre(state)) return false;
    const last = state.mechUsed[m.id];
    if (last !== undefined && state.turn - last < MECH_ROTATE) return false;
    // 类别轮换：最近两回合用过的大类不立即重复
    const recent = state.mechLog.slice(-2).map((x) => x.cat);
    if (recent.length >= 2 && recent[0] === m.cat && recent[1] === m.cat) return false;
    return true;
  }

  function pickMechanics(state) {
    const all = (MECH && MECH.registry) || [];
    if (!all.length) return [];
    const picks = [];
    // 玩家点名优先
    if (state.mechRequest) {
      const want = all.find((m) => m.id === state.mechRequest);
      if (want) { picks.push(want); state.mechRequest = null; }
    }
    const count = 1 + (roll100(state, 'mechCount', 0) % 3); // 1~3 条
    for (let i = 0; i < count; i++) {
      // 同一回合不重复大类：避免一回合里刷出三条"元游戏"这种雷同组合
      const usedCats = picks.map((m) => m.cat);
      const pool = all.filter((m) => !picks.includes(m) && !usedCats.includes(m.cat) && mechEligible(state, m));
      if (!pool.length) break;
      const idx = hashStr(state.seed + ':' + state.turn + ':mech' + i) % pool.length;
      picks.push(pool[idx]);
    }
    return picks;
  }

  function applyMechanic(state, m) {
    const tpl = MECH.templates[m.tpl];
    if (!tpl) { state.integrity.push('玩法 ' + m.id + ' 的模板不存在: ' + m.tpl); return null; }
    const helpers = {
      roll: (i, max) => 1 + Math.floor(roll01(state, 'mech:' + m.id, i) * max),
    };
    let out;
    try {
      out = tpl(state, m.p, helpers, m) || {};
    } catch (err) {
      state.integrity.push('玩法 ' + m.id + ' 执行失败: ' + (err && err.message));
      return null;
    }
    // 机制事件的现金同样走统一入口（applyEffects 内部已记账），被上限截断时如实告诉玩家
    const cappedOut = [];
    const effOut = applyEffects(state, out.effects || [], '玩法·' + m.name);
    if (m.extra && m.extra.length) cappedOut.push.apply(cappedOut, applyEffects(state, m.extra, '玩法·' + m.name + '（专属）'));
    let cappedSum = 0;
    [effOut, cappedOut].forEach((arr) => (arr || []).forEach((x) => { if (x && x.cappedCash) cappedSum += x.cappedCash; }));
    const lines = (out.lines || []).slice();
    if (cappedSum) lines.push('（本章收入已达上限，' + cappedSum + ' 万没能落进口袋）');
    state.mechUsed[m.id] = state.turn;
    state.mechLog.push({ id: m.id, cat: m.cat, name: m.name, turn: state.turn });
    if (state.mechLog.length > 20) state.mechLog = state.mechLog.slice(-20);
    return { id: m.id, cat: m.cat, name: m.name, lines: lines };
  }

  /** 界面用：最近触发的玩法（含大类中文名） */
  function recentMechanics(state) {
    return state.mechLog.slice(-6).map((x) => ({
      id: x.id, turn: x.turn, name: x.name,
      cat: MECH && MECH.catNames ? MECH.catNames[x.cat] : x.cat,
    }));
  }

  /* ---------------------------------------------------------- 回合流程 */
  /** 开启新的一天：只做计数与重置；章首额外结算家庭收益 */
  function startTurn(state) {
    state.turn += 1;
    state.chapter = Math.ceil(state.turn / 7);
    if (state.turn % 7 === 1) {
      state.chapterReduction = 0;
      state.chapterPurge = 0;       // 「处置灵异源头」的每章次数同时重置
      state.clueGains = 0;
      state.humanityGains = 0;
      // 本章收入上限：必须每"章"（7 天）重置一次。
      // 原来这行写在章首判断外面 → 每天重置，等于"500 万/章"从不生效（收入上限形同虚设）。
      state.chapterSpendings = 0;
      // 章首家庭收益（受每章人性回复上限 5 点约束）
      if (state.wife) gainHumanity(state, 3, '配偶陪伴（每章）');
      if (state.children > 0) gainHumanity(state, 2, '子嗣羁绊（每章）');
    }
    state.ledger = [];
    state.ledgerStart = {};
    for (const p of Object.keys(BOUNDS)) state.ledgerStart[p] = getPath(state, p);
    state.turnRoll = dailyRoll(state);
    state.actionTakenToday = false;
    state.purgeRisk = 0;           // 处置的风险只在当天有效
    state.phase = 'day';
    state.pending = null;
  }

  /** 结束一天：守恒校验 → 结局判定 → 自然恢复 → 世界推进 → 阈值 → 进入下一天 */
  function endTurn(state) {
    // 账本守恒校验：逐笔推导值必须等于实际值（唯一写入点被绕过就会暴露）
    const derived = {};
    for (const k of Object.keys(state.ledgerStart)) derived[k] = state.ledgerStart[k];
    for (const entry of state.ledger) {
      if (derived[entry.path] === undefined) continue;
      derived[entry.path] += entry.delta;
    }
    for (const k of Object.keys(derived)) {
      const actual = getPath(state, k);
      const b = dynamicBounds(state, k);
      const expect = clamp(derived[k], b[0], b[1]);
      if (actual !== expect) {
        state.integrity.push('账本不守恒: ' + k + ' 推导=' + expect + ' 实际=' + actual);
      }
    }

    // 结局判定放在「当天行动的结果」这一时刻：既不会被随后的世界推进抢走，
    // 也不会被夜间恢复掩盖（例如理智刚好归零的「疯子先知」）。
    // 先跑玩法轮换（写进同一份账本，随后一起守恒校验）
    const mechLines = [];
    for (const m of pickMechanics(state)) {
      const r = applyMechanic(state, m);
      if (!r) continue;
      const catName = (MECH && MECH.catNames) ? MECH.catNames[r.cat] : r.cat;
      mechLines.push('【玩法·' + catName + '】' + r.name + '：' + (r.lines.join(' ') || ''));
    }
    state.lastMechLines = mechLines;

    checkWorldEndings(state);
    if (state.over) return;

    // 每天的自然消耗与恢复
    addPath(state, 'stats.stamina', +8, '睡眠恢复');
    addPath(state, 'stats.sanity', +3, '夜间休息');
    addPath(state, 'stats.pollution', -2, '净身与开窗');

    // 世界推进：不可被任何手段抵消（补丁 P1.2）
    const adv = worldAdvanceAmount(state);
    addPath(state, 'stats.calamity', adv, '世界推进（不可抵消）');
    state.worldAdvance += adv;

    checkThresholds(state);
    if (!state.over) startTurn(state);
  }

  function checkWorldEndings(state) {
    if (state.over) return;
    const banned = eraOf(state).banned || [];
    for (const c of CONTENT.worldEndingChecks) {
      if (banned.indexOf(c.id) >= 0) continue;   // 某些时期不存在这条路（如古代没有"总部黄金收容"）
      if (c.when(state)) {
        const def = CONTENT.endings[c.id];
        return endGame(state, c.id, def ? def.text : '世界线走到了尽头。', 'world');
      }
    }
    return null;
  }

  /* --------------------------------------------------------- 阈值与结局 */
  /**
   * 鬼域护体：本该致死的代价先由体内鬼域承担（杨戬开局）。
   * 返回 true = 这次死被挡下了（调用方必须放弃致死结算）。
   */
  function godSave(state, why, restore) {
    if (!state.godLayers || state.godLayers <= 0) return false;
    state.godLayers -= 1;
    if (restore) for (const k of Object.keys(restore)) addPath(state, k, restore[k], '鬼域护体·回调');
    (state.notes = state.notes || []).push(
      '你体内的鬼域自动铺开了一层，把「' + why + '」硬生生压了回去。' +
      '（剩余鬼域 ' + state.godLayers + ' 层' + (state.godLayers === 0 ? '——最后一层了' : '') + '）');
    return true;
  }

  function checkThresholds(state) {
    if (state.over) return;
    if (state.stats.erosion >= 100) {
      if (godSave(state, '侵蚀到顶', { 'stats.erosion': -12 })) return;
      return endGame(state, 'p_fuxi', '鬼侵蚀抵达 100，你不再是人。', 'erosion');
    }
    if (state.stats.humanity <= 0) {
      if (godSave(state, '人性归零', { 'stats.humanity': 12 })) return;
      return endGame(state, 'p_fuxi', '人性归零，你在镜子里看见的不再是自己。', 'humanity');
    }
    if (state.stats.calamity >= 100) {
      triggerCalamity(state);
      if (state.over) return;
      // 劫难代价（侵蚀 +10）可能当场把人推过终点，必须立刻复检
      if (state.stats.erosion >= 100) {
        if (godSave(state, '劫难压顶', { 'stats.erosion': -12 })) return;
        return endGame(state, 'p_fuxi', CONTENT.endings.p_fuxi.text, 'calamity');
      }
      if (state.stats.humanity <= 0) {
        if (godSave(state, '劫难压顶', { 'stats.humanity': 12 })) return;
        return endGame(state, 'p_fuxi', CONTENT.endings.p_fuxi.text, 'calamity');
      }
    }
  }

  /**
   * 劫难剧情（4.3）：劫难值=100 强制触发。
   * 规则原文只说"存活后回落 30~50 + 获得灾厄印记（永久 +20% 增长）+ 稀有奖励"，
   * 因此这里是可反复发生的长期压力源，而不是三振出局：
   * 每一次都按存活判定结算，灾厄印记越多越难活；印记满 5 层 → 人间如狱（世界结局）。
   */
  function triggerCalamity(state) {
    state.calamityEscapes += 1;
    const marks = state.flags.marks;
    const r = doCheck(state, 'calamity', 'esc' + state.calamityEscapes, 70 + tuningOf(state).calamityBonus, [
      { name: '安全屋', v: state.flags.safehouse * 4 },
      { name: '低调', v: state.stats.stealth >= 70 ? 5 : 0 },
      { name: '灾厄印记', v: -marks * 10 },
    ]);
    if (!r.success) {
      if (marks + 1 >= 5) {
      if (godSave(state, '劫难印记满层', { 'stats.calamity': -40 })) return;
      return endGame(state, 'w_ruyu', CONTENT.endings.w_ruyu.text, 'calamity');
    }
      if (godSave(state, '劫难降临', { 'stats.calamity': -40 })) return;
      return endGame(state, 'dead', '劫难降临，这一次你没有躲过去。', 'calamity');
    }
    // 存活：回落但不得跌破下限（补丁 P1.3）
    const godTier = state.pack === 'yangji' || state.contracts.length >= 3;
    if (godTier) {
      applyEffects(state, [{ k: 'stat', key: 'sanity', v: -10 }], '规则级反噬：神性崩解');
    }
    const fallback = Math.max(state.calamityFloor, 30 + state.calamityEscapes * 5);
    setPath(state, 'stats.calamity', Math.min(50, fallback), '劫难剧情存活后回落');
    addPath(state, 'flags.marks', 1, '获得灾厄印记');
    addPath(state, 'stats.erosion', 10, '劫难剧情的代价');
    const loot = roll100(state, 'calamityLoot', state.calamityEscapes);
    if (loot >= 50) applyEffects(state, [{ k: 'flag', key: 'intel', v: 3 }], '劫难奖励：情报');
    else applyEffects(state, [{ k: 'money', key: 'gold', v: 2 }], '劫难奖励：黄金 2kg');
    if (state.flags.marks >= 5) return endGame(state, 'w_ruyu', CONTENT.endings.w_ruyu.text);
    return null;
  }

  function endGame(state, endingId, text, cause) {
    state.over = { ending: endingId, text: text, turn: state.turn, cause: cause || 'other' };
    state.phase = 'over';
    state.meta.deaths += 1;
    state.meta.bestTurn = Math.max(state.meta.bestTurn || 0, state.turn);
    return state.over;
  }

  /* ---------------------------------------------------------- 判定 · 通用 */
  // 尝试记账：同一目标最多 N 次；第 2 次起 -20%；超出上限直接拒绝。
  // 上限按用途分类（补丁 P3 的本意是「不许对同一障碍反复试探」，不是「不许日常行动」）：
  //   · 障碍类（抵御/驾驭/中性规避/奇迹）：全局限 2 次 → 目标键不带章号
  //   · 日常类（训练/死机法/任务/赌局）：按章限 N 次 → 目标键带 @c<章>
  const ATTEMPT_CAPS = { default: 2, train: 3, freeze: 3, mission: 5, gamble: 2 };
  function chapterKey(state, base) {
    return base + '@c' + state.chapter;
  }
  const STRICT_PURPOSES = ['resist', 'neutral', 'calamity']; // 生死一线，不给容错
  function attemptState(state, purpose, target) {
    const key = purpose + ':' + target;
    const n = state.attempts[key] || 0;
    const cap = ATTEMPT_CAPS[purpose] || ATTEMPT_CAPS.default;
    const free = STRICT_PURPOSES.includes(purpose) ? 0 : tuningOf(state).retryFree;
    return {
      key: key,
      count: n,
      cap: cap,
      allowed: n < cap,
      penalty: n <= free ? 0 : -20,
      reason: n >= cap ? '同一目标的尝试额度已用尽（上限 ' + cap + ' 次）' : '',
    };
  }
  function recordAttempt(state, key) {
    state.attempts[key] = (state.attempts[key] || 0) + 1;
  }

  function doCheck(state, purpose, target, base, mods) {
    const at = attemptState(state, purpose, target);
    if (!at.allowed) return { refused: true, note: at.reason };
    mods = mods || [];
    const tu = tuningOf(state);
    let chance = base;
    const parts = ['基础 ' + base + '%'];
    if (tu.checkBonus) parts.push((tu.checkBonus > 0 ? '+' : '') + tu.checkBonus + '% 难度');
    for (const m of mods) {
      chance += m.v;
      if (m.v !== 0) parts.push((m.v > 0 ? '+' : '') + m.v + '% ' + m.name); // 零修正不显示，公式更好读
    }
    chance += tu.checkBonus;
    chance += at.penalty;
    if (at.penalty) parts.push(at.penalty + '% 重复尝试');
    chance = clamp(int(chance), 1, 90);
    const value = roll100(state, purpose, hashStr(target) % 97);
    recordAttempt(state, at.key);
    return {
      value: value,
      chance: chance,
      success: value <= chance,
      formula: parts.join(' ') + ' = ' + chance + '% ｜ 1d100=' + value,
      target: target,
      purpose: purpose,
    };
  }

  /* ------------------------------------------------- 驾驭成功率（第 6 章） */
  function masteryCheck(state, ghostId) {
    const g = CONTENT.ghosts[ghostId];
    const er = state.stats.erosion;
    const erAdj = er >= 60 ? 15 : er >= 30 ? 10 : er >= 10 ? 5 : 0;
    // 基础成功率：普通人 0%；已寄宿/拥有鬼眼者 5%~15%
    const awakened = state.stats.ghostEye > 0 || state.contracts.length > 0;
    const base = awakened ? clamp(5 + Math.floor(state.stats.ghostEye * 10 / 9), 5, 15) : 0;
    const mods = [{ name: '侵蚀修正', v: erAdj }];
    if (state.clues.includes(g.masteryClue)) mods.push({ name: '同源拼图', v: 20 });
    if (state.flags.intel >= 5) mods.push({ name: '封印仪式准备', v: 15 });
    if (state.contracts.length >= 2) mods.push({ name: '双鬼平衡', v: 10 });
    const cityM = (cityOf(state).rule && cityOf(state).rule.mastery) || 0;
    if (cityM) mods.push({ name: '本地规矩', v: cityM });
    mods.push({ name: '危险等级惩罚', v: -g.penalty });
    if (state.stats.calamity >= 70) mods.push({ name: '劫难修正', v: -5 });
    const r = doCheck(state, 'mastery', ghostId, base, mods);
    if (r.refused) return r;
    if (r.success) {
      // 厉鬼平衡法（附录 A）：已有 2 只以上契约时，新契约的侵蚀代价减半
      const balance = state.contracts.length >= 2;
      const cost = (balance ? 6 : 12) + int(roll01(state, 'masteryCost', 1) * (balance ? 6 : 8));
      applyEffects(state, [
        { k: 'stat', key: 'erosion', v: cost },
        { k: 'stat', key: 'calamity', v: 12 },
        { k: 'stat', key: 'humanity', v: -8 },
      ], '驾驭成功的代价' + (balance ? '（厉鬼平衡法减半）' : ''));
      state.contracts.push(ghostId);
    } else {
      applyEffects(state, [
        { k: 'stat', key: 'erosion', v: 8 },
        { k: 'stat', key: 'calamity', v: 25 },
      ], '驾驭失败：厉鬼局部复苏');
    }
    return r;
  }

  /* --------------------------------------------- 奇迹判定（补丁 P5：加权） */
  const MIRACLE_WEIGHTS = [0.5, 0.3, 0.2];
  function miracleCheck(state, key, stageCount, stageBase) {
    const n = clamp(int(stageCount || 3), 2, 3);
    const stages = [];
    let total = 0;
    let weightSum = 0;
    for (let i = 0; i < n; i++) {
      const base = stageBase[i] !== undefined ? stageBase[i] : 12;
      const v = roll100(state, 'miracle:' + key, i);
      const ok = v <= base;
      stages.push({ i: i + 1, value: v, chance: base, success: ok });
      total += base * MIRACLE_WEIGHTS[i];
      weightSum += MIRACLE_WEIGHTS[i];
      if (!ok) break;
    }
    let chance = clamp(int(total / Math.max(weightSum, 0.0001)) + tu.checkBonus, 5, tu.id === 'nightmare' || tu.id === 'hardcore' ? 15 : 20);
    const allOk = stages.length === n && stages.every((s) => s.success);
    return { stages: stages, chance: chance, success: allOk, formula: '加权平均（权重 0.5/0.3/0.2，不连乘）= ' + chance + '%' };
  }

  /* ------------------------------------------------------------ 行动生成 */
  /** 该判定是否还有尝试额度（用尽的行动不再出现在选项里，避免空转按钮） */
  function canAttempt(state, purpose, target) {
    return attemptState(state, purpose, target).allowed;
  }

  /* ------------------------------------------------- 自由行动：意图识别 */
  /**
   * 把玩家自己写的话映射到"真实行动"（不接 AI 也能有自由度）。
   * 命中就按那个行动结算（有数值、有判定），没命中才退化成纯叙事描述。
   */
  const INTENT_RULES = [
    { id: 'purge', kw: ['处置', '压劫难', '净化', '拆规矩', '源头', '清剿', '拆了它'] },
    { id: 'investigate', kw: ['调查', '打听', '查', '翻', '档案', '线索', '报纸', '上网', '搜', '问', '走访', '探', '看看'] },
    { id: 'rest', kw: ['休息', '睡', '休整', '静养', '躺', '歇', '不出门', '缓一缓'] },
    { id: 'work', kw: ['上班', '打工', '赚钱', '挣', '开店', '兼职', '工作', '跑单'] },
    { id: 'train', kw: ['训练', '练', '觉醒', '开眼', '适应'] },
    { id: 'freeze', kw: ['冻结', '死机', '压住', '停住', '按下去', '让它睡'] },
    { id: 'shop', kw: ['黑市', '买', '采购', '补给', '道具'] },
    { id: 'gamble', kw: ['赌', '押', '下注'] },
    { id: 'mission', kw: ['任务', '接活', '出任务', '总部派'] },
    { id: 'social', kw: ['社交', '朋友', '吃饭', '约会', '聊', '喝'] },
    { id: 'safehouse', kw: ['加固', '安全屋', '封门', '符阵', '门锁'] },
    { id: 'heal', kw: ['治疗', '看病', '心理医生', '医院', '包扎', '疗伤'] },
  ];

  /** 解析自由文本 → { actionId, label, via } 或 null */
  function parseIntent(state, text) {
    const t = String(text || '').trim();
    if (!t) return null;
    const pool = actionPool(state).filter((a) => !a.if || a.if(state));
    const available = pool.map((a) => a.id);
    // 1) 去某个地方（今天刷出来的探索选项）
    for (const p of placeProbeOptions(state)) {
      const id = 'probe_' + hashStr(p.name) % 1000;
      if (available.indexOf(id) >= 0) {
        const key = p.name.replace(/^(自家|学校|小区|镇上|村后|路口|城南|老城)/, '').slice(0, 4);
        if (key && t.indexOf(key) >= 0) return { actionId: id, label: '去看看：' + p.name, via: '地点' };
      }
    }
    // 2) 驾驭某只鬼：「驾驭敲门鬼」「收服鬼婴」
    if (/驾驭|收服|契约|收下|压住它/.test(t)) {
      for (const gid of Object.keys(CONTENT.ghosts)) {
        const g = CONTENT.ghosts[gid];
        if (t.indexOf(g.name) >= 0 && available.indexOf('mastery:' + gid) >= 0) {
          return { actionId: 'mastery:' + gid, label: '驾驭「' + g.name + '」', via: g.name };
        }
      }
    }
    // 3) 本地专属行动：命中城市行动名里的关键词
    const city = cityOf(state);
    if (city.act && available.indexOf('city_' + city.id) >= 0) {
      const key = String(city.act.label).replace(/^去/, '').replace(/（.*?）/g, '').slice(0, 5);
      if (key && t.indexOf(key) >= 0) return { actionId: 'city_' + city.id, label: city.act.label, via: '本地行动' };
    }
    // 4) 通用行动关键词（按规则优先级：先专有后通用）
    for (const rule of INTENT_RULES) {
      for (const kw of rule.kw) {
        if (t.indexOf(kw) >= 0 && available.indexOf(rule.id) >= 0) {
          const a = pool.find((x) => x.id === rule.id);
          return { actionId: rule.id, label: (a && a.label) || rule.id, via: kw };
        }
      }
    }
    return null;
  }

  /** 遭遇自由输入的同义词归一化：让"把门封死""别出声"这类口语也能对上选项标签 */
  const ENC_SYN = {
    封门: ['封死', '封住', '堵住', '封上', '钉死', '堵死', '焊'],
    回避: ['躲', '退', '避开', '撤', '缩', '绕开', '走开'],
    静默: ['不出声', '别出声', '不要出声', '没出声', '安静', '屏住', '闭嘴', '不说话'],
    出声: ['喊', '叫', '出声', '说话', '喊话'],
    开门: ['推门', '开门', '把门打开', '拉开门'],
    奔跑: ['跑', '逃', '冲', '狂奔', '飞奔'],
    观察: ['看', '观察', '盯着', '留意', '注意'],
    触碰: ['碰', '摸', '抱', '拿起来', '伸手'],
    遵循: ['照做', '按规矩', '照着规律', '不触犯', '遵守'],
  };

  function normalizeEncText(t) {
    let s = String(t || '');
    // 先处理否定式，否则"不出声"会被当命中"出声"
    s = s.replace(/不出声|别出声|不要出声|没出声/g, '静默');
    for (const tag of Object.keys(ENC_SYN)) {
      for (const w of ENC_SYN[tag]) if (s.indexOf(w) >= 0) s += ' ' + tag;
    }
    return s;
  }

  /**
   * 遭遇中的自由输入：把玩家说的话对应到**现有选项**上（绝不会凭空创造一个绕过判定的选项）。
   */
  function parseEncounterIntent(state, text) {
    const enc = state.pending;
    if (!enc) return null;
    const raw = String(text || '').trim();
    if (!raw) return null;
    const t = normalizeEncText(raw);
    let best = null; let bestScore = 0;
    for (const o of enc.options) {
      let score = 0;
      const label = String(o.label || '');
      for (let i = 0; i + 1 < label.length; i++) if (t.indexOf(label.slice(i, i + 2)) >= 0) score += 1;
      (o.tags || []).forEach((tg) => { if (tg && t.indexOf(tg) >= 0) score += 3; });
      if (score > bestScore) { bestScore = score; best = o; }
    }
    return bestScore >= 3 ? { optionId: best.id, label: best.label, kind: best.kind } : null;
  }

  const PLACES = {
    school: ['第七中学的旧教学楼', '学校后门的监控室'], apartment: ['自家楼下的物业', '小区地下车库'],
    city: ['城南的旧商城', '老城区的天桥', '夜间营业的便利店'], town: ['镇上的祠堂', '路口那盏不亮的路灯'],
    village: ['村后的坡地', '晒谷场的老仓库'], hotel: ['酒店十二层的走廊', '地下停车场'],
    street: ['步行街的电话亭', '巷口的裁缝铺'], shop: ['药铺后间', '柜台底下的抽屉'],
    temple: ['祠堂的偏殿', '山门外的石阶'], bus: ['末班车的候车亭', '公交总站的调度室'],
    oldhouse: ['老宅的地下室', '二楼的空房间'], yangjian: ['阴阳路的入口', '黄金门的背面'],
  };

  /** 每天 3 个"去哪里看看"的探索选项（按种子确定性抽取；只给叙事与小数值，不改判定） */
  function placeProbeOptions(state) {
    const city = cityOf(state);
    const list = PLACES[city.place] || PLACES.city;
    const out = [];
    for (let i = 0; i < 3; i++) {
      const name = list[hashStr(state.seed + ':' + state.turn + ':probe' + i) % list.length];
      if (out.some((x) => x.name === name)) continue;
      out.push({ name: name });
    }
    return out;
  }

  function probeAction(state, name) {
    return {
      id: 'probe_' + hashStr(name) % 1000,
      label: '去看看：' + name,
      tags: ['probe'],
      run: (s) => {
        const r = roll100(s, 'probe:' + name, 0);
        if (r <= 18) {           // 小概率撞见异常：给一点线索方向，但也要付代价
          applyEffects(s, [{ k: 'stat', key: 'pollution', v: 4 }, { k: 'stat', key: 'sanity', v: -3 }], '探索异常');
          return { lines: ['你去了 ' + name + '。', '那里有件东西不对劲：' + (CITY_PROBE_HINTS[hashStr(name) % CITY_PROBE_HINTS.length])] };
        }
        if (r <= 40) {
          applyEffects(s, [{ k: 'stat', key: 'stamina', v: -4 }], '白跑一趟');
          return { lines: ['你去了 ' + name + '，什么也没有。', '回程时你一直留意身后，脚步声始终只有你自己的。'] };
        }
        if (r <= 70) {
          applyEffects(s, [{ k: 'stat', key: 'sanity', v: 2 }, { k: 'stat', key: 'stealth', v: 2 }], '熟悉地形');
          return { lines: ['你在 ' + name + ' 待了一会儿。', '你记住了这里的出入口和摄像头位置——真出事的时候，这些比勇气有用。'] };
        }
        applyEffects(s, [{ k: 'stat', key: 'pollution', v: 3 }, { k: 'stat', key: 'calamity', v: 2 }], '踩到痕迹');
        return { lines: ['你去了 ' + name + '。', '地上有拖拽的痕迹，拖到墙根就断了。今晚这里的空气不太对。'] };
      },
    };
  }
  const CITY_PROBE_HINTS = [
    '墙角的石灰是新刷的，刷的时候没带梯子——是高处自己落下来的。',
    '有人在这里数过数，数到一半停了，地上留着他最后数到的那个数。',
    '门内侧贴着一张纸条：不要在这里说出自己的名字。',
    '窗户是关着的，但窗台上的灰有两个人的手印，一个是反着的。',
  ];

  /** 落地城市的专属行动（每城一条；与其它行动共用"每天一个主动作"的额度） */
  function cityAction(state) {
    const city = cityOf(state);
    const act = city.act;
    if (!act) return null;
    return {
      id: 'city_' + city.id,
      label: act.label + '（' + city.name + '）',
      tags: ['city'],
      if: (s) => (!act.require || act.require(s)) && canPay(s, act.cost),
      run: (s) => {
        if (act.cost) applyEffects(s, act.cost, '本地开销·' + city.name);
        // 现金收入统一走 gainCash（受本章收入上限约束）：否则大澳市这类给钱的本地行动
        // 会变成每天 +40 万的无上限刷钱机器。
        const eff = [];
        let capped = 0;
        for (const e of act.effects || []) {
          if (e.k === 'money' && e.v > 0 && (e.key === 'cash' || e.key === 'deposit')) {
            const r = gainCash(s, e.key, e.v, '本地行动·' + city.name);
            capped += r.capped;
          } else eff.push(e);
        }
        if (eff.length) applyEffects(s, eff, '本地行动·' + city.name);
        const lines = (act.lines || []).slice();
        if (capped) lines.push('（本章收入已达上限，' + capped + ' 万没能落进口袋）');
        return { lines: lines };
      },
    };
  }

  function actionPool(state) {
    const pool = [];
    const add = (a) => pool.push(a);

    add({
      id: 'rest', label: '休整一天（静养，恢复理智与体力）', tags: ['rest'],
      run: (s) => {
        applyEffects(s, [{ k: 'stat', key: 'sanity', v: 8 }, { k: 'stat', key: 'stamina', v: 15 }], '静养');
        const r = reduceCalamity(s, 5, '静养一夜（4.2）');
        return { lines: ['你把门窗封严，点上一支鬼烛，强迫自己睡下。', r.ok ? '劫难值 -' + r.applied + (r.capped ? '（' + r.capped + '）' : '') : r.why] };
      },
    });
    add({
      id: 'purge', label: '处置灵异源头（主动压劫难值，当天极易遭遇）', tags: ['probe'],
      if: (s) => (s.flags.intel >= 1 || s.clues.length >= 1) && (s.chapterPurge || 0) < PURGE_PER_CHAPTER,
      run: (s) => {
        const n = s.chapterPurge || 0;
        const calm = PURGE_CALM[n];
        const risk = PURGE_RISK[n];
        applyEffects(s, PURGE_COST[n], '处置开销');
        s.chapterPurge = n + 1;
        s.purgeRisk = (s.purgeRisk || 0) + risk;   // 当天遭遇率上升：压劫难要用命换
        const r = purgeCalamity(s, calm, '处置灵异源头（本章第 ' + (n + 1) + ' 次）');
        const lines = [
          '你顺着线索摸到那个源头，把它的"规矩"一层层拆开，写进纸上。',
          r.floored
            ? '劫难值 -' + r.applied + '（已触到下限 ' + s.calamityFloor + '，再压也没用）'
            : '劫难值 -' + r.applied,
          '代价是你把自己亮在了明处：今天遇上东西的概率 +' + risk + '%，本章还能处置 ' + (PURGE_PER_CHAPTER - s.chapterPurge) + ' 次。',
        ];
        return { lines: lines };
      },
    });
    add({
      id: 'work', label: '维持人设（上班/开店赚钱）', tags: ['normal'],
      run: (s) => {
        const gain = 3 + int(roll01(s, 'workPay', 0) * 6);
        const cap = tuningOf(s).incomeCap;
        const r = gainCash(s, 'cash', gain, '工作收入');
        applyEffects(s, [{ k: 'stat', key: 'stealth', v: 2 }, { k: 'stat', key: 'stamina', v: -5 }], '低调生活');
        return { lines: ['你照常出现在人群里，做一个无害的普通人。',
          '收入 +' + r.applied + ' 万（本章收入已用 ' + s.chapterSpendings + '/' + cap + ' 万）' +
          (r.capped ? '　—— 上限已满，' + r.capped + ' 万没能落进口袋' : '')] };
      },
    });
    add({
      id: 'investigate', label: '调查传闻（找线索，风险上升）', tags: ['probe'],
      run: (s) => {
        applyEffects(s, [{ k: 'stat', key: 'pollution', v: 4 }, { k: 'stat', key: 'sanity', v: -3 }], '深入调查');
        // 先查当前区域的鬼；它的线索查完了，就转去查你已知的其他鬼（否则驾驭用的关键线索永远拿不到）
        let g = CONTENT.ghosts[activeGhost(s)];
        if (!g || !g.clues.some((c) => !s.clues.includes(c.id))) {
          const alt = Object.keys(s.bestiary).filter((gid) => CONTENT.ghosts[gid] &&
            CONTENT.ghosts[gid].clues.some((c) => !s.clues.includes(c.id)));
          if (alt.length) g = CONTENT.ghosts[alt[hashStr(s.seed + ':alt') % alt.length]];
        }
        if (!g) return { lines: ['这一带暂时没有什么值得深挖的东西。'] };
        // 线索冷却：每 3 天最多一次实质收获，防止把线索当成无限资源刷
        if (s.turn - s.lastClueTurn < CLUE_COOLDOWN) {
          return { lines: ['线索不是每天都能挖出来的。你翻了一整天旧报纸，只翻到自己的手指发白。',
            '（线索冷却中：距上次实质收获 ' + (s.turn - s.lastClueTurn) + '/' + CLUE_COOLDOWN + ' 天）'] };
        }
        const pool = g.clues.filter((c) => !s.clues.includes(c.id));
        if (!pool.length) return { lines: ['关于「' + g.name + '」，你已经掌握能掌握的一切。'] };
        const c = pool[hashStr(s.seed + ':' + s.turn + ':clue') % pool.length];
        applyEffects(s, [{ k: 'clue', id: c.id }, { k: 'bestiary', id: g.id, clues: 1 }], '获得线索');
        s.lastClueTurn = s.turn;
        return { lines: ['你在旧报纸的边角上读到一段话：', '「' + c.text + '」', '（线索已记录：' + c.id + '）'] };
      },
    });
    add({
      id: 'freeze', label: '死机法：让体内的鬼停滞（九死一生，可压低侵蚀）', tags: ['power'],
      if: (s) => s.contracts.length >= 1 && canAttempt(s, 'freeze', chapterKey(s, 'self')),
      run: (s) => {
        // 附录 A 的延命三法之一：死机法。九死一生，且次数越多越难。
        const base = clamp(30 - (s.freezeUses || 0) * 6, 8, 30);
        const r = doCheck(s, 'freeze', chapterKey(s, 'self'), base, [
          { name: '契约数', v: s.contracts.length * 3 },
          { name: '理智', v: Math.floor(s.stats.sanity / 20) },
        ]);
        if (r.refused) return { lines: [r.note], check: r };
        s.freezeUses = (s.freezeUses || 0) + 1;
        if (r.value <= 5) {
          // 大失败：直接复苏
          applyEffects(s, [{ k: 'stat', key: 'erosion', v: 40 }, { k: 'stat', key: 'calamity', v: 20 }], '死机法反噬');
          return { lines: ['你把自己的意识按下去，结果它没有停——停的是你。'], check: r, fatal: true };
        }
        if (r.success) {
          const cut = 8 + int(roll01(s, 'freezeGain', 0) * 8);
          addPath(s, 'stats.erosion', -cut, '死机法：鬼陷入停滞');
          applyEffects(s, [{ k: 'stat', key: 'humanity', v: -3 }, { k: 'stat', key: 'calamity', v: 15 },
            { k: 'stat', key: 'stamina', v: -30 }], '死机法的代价');
          return { lines: ['有一段很长的时间，你听不见任何声音，也感觉不到那只鬼。',
            '侵蚀 -' + cut + '（当前 ' + s.stats.erosion + '），但劫难值涨了。'], check: r };
        }
        applyEffects(s, [{ k: 'stat', key: 'erosion', v: 10 }, { k: 'stat', key: 'calamity', v: 20 },
          { k: 'stat', key: 'sanity', v: -15 }], '死机法失败');
        return { lines: ['它没有停。它只是学会了怎么装死。'], check: r };
      },
    });
    // 驾驭：可以选目标 —— 弱者优先是常识，S 级基本无望（规则原意）
    const knownGhosts = Object.keys(state.bestiary)
      .filter((gid) => CONTENT.ghosts[gid] && !state.contracts.includes(gid));
    if (!knownGhosts.length) knownGhosts.push(activeGhost(state));
    for (const gid of knownGhosts) {
      const g = CONTENT.ghosts[gid];
      add({
        id: 'mastery:' + gid,
        label: '尝试驾驭「' + g.name + '」（' + g.level + ' 级，危险惩罚 -' + g.penalty + '%）',
        tags: ['power'],
        if: (s) => canAttempt(s, 'mastery', gid),
        run: (s) => {
          const r = masteryCheck(s, gid);
          if (r.refused) return { lines: [r.note], check: r };
          if (r.success) {
            return { lines: ['你把它按进了自己的身体里。它没有死——它只是暂时同意了。',
              '契约：' + g.name + '（' + g.level + ' 级）。代价写在你的骨头上。'], check: r };
          }
          return { lines: ['你没能压住它。有一个很短的时间，你分不清哪一部分是自己。'], check: r };
        },
      });
    }
    add({
      id: 'social', label: '维持关系（约会/送礼，可能成家）', tags: ['normal'],
      if: (s) => s.money.cash >= 2,
      run: (s) => {
        const npc = CONTENT.npcs.lin;
        if (s.money.cash < 2) return { lines: ['请人吃顿饭总要花钱，你连 2 万都拿不出来。'] };
        addPath(s, 'money.cash', -2, '约会支出');
        const gain = 6 + int(roll01(s, 'social', 0) * 8);
        addPath(s, 'flags.favor', gain, '与 ' + npc.name + ' 的关系进展');
        const lines = [npc.name + '（' + npc.desc + '）今天愿意听你说话。', '好感 +' + gain + '（当前 ' + s.flags.favor + '/100）'];
        if (!s.wife && s.flags.favor >= 90) {
          s.wife = npc.id;
          lines.push('你们把关系定了下来。她成了你在这个世界上唯一的弱点，也是唯一的锚。');
        } else if (s.wife && s.children === 0) {
          if (s.stats.erosion >= 80) {
            lines.push('你们谈过孩子的事，但医生的话让你没法继续谈下去。');
          } else {
            const rr = doCheck(s, 'birth', 'child0', s.stats.erosion < 60 ? 60 : 25, [
            ]);
            if (!rr.refused && rr.success) {
              s.children = 1;
              lines.push('孩子出生了——在这座城市里，这几乎算是一种反抗。', '子嗣 +1（人性回复来源，同时也是弱点）');
            } else {
              lines.push('这一次没有结果。你们都沉默了很久。');
            }
          }
        }
        return { lines: lines };
      },
    });
    add({
      id: 'train', label: '训练与冲重（鬼眼重数，侵蚀上涨）', tags: ['power'],
      if: (s) => s.stats.ghostEye < 9 && canAttempt(s, 'train', chapterKey(s, 'ghostEye')),
      run: (s) => {
        const r = doCheck(s, 'train', chapterKey(s, 'ghostEye'), 45 + s.stats.erosion / 5, [
          { name: '冷静度', v: int(s.stats.sanity / 10) },
          { name: '劫难修正', v: s.stats.calamity >= 70 ? -5 : 0 },
        ]);
        if (r.refused) return { lines: [r.note], check: r };
        if (r.success) {
          applyEffects(s, [{ k: 'stat', key: 'ghostEye', v: 1 }, { k: 'stat', key: 'erosion', v: 8 }, { k: 'stat', key: 'humanity', v: -5 }], '冲高鬼眼重数');
          return { lines: ['眼底一阵灼痛，视野被撕开一层——鬼眼 ' + s.stats.ghostEye + ' 重。'], check: r };
        }
        applyEffects(s, [{ k: 'stat', key: 'erosion', v: 5 }, { k: 'stat', key: 'sanity', v: -10 }], '冲重失败反噬');
        return { lines: ['血从眼角渗出来，你什么都没抓住，只换来更深的侵蚀。'], check: r };
      },
    });
    add({
      id: 'safehouse', label: '加固安全屋（封条/符阵/黄金）', tags: ['normal'],
      if: (s) => s.flags.safehouse < 5 && s.money.cash >= (s.flags.safehouse + 1) * 30,
      run: (s) => {
        const cost = (s.flags.safehouse + 1) * 30;
        if (s.money.cash < cost) return { lines: ['加固需要 ' + cost + ' 万现金，你拿不出来。'] };
        addPath(s, 'money.cash', -cost, '加固安全屋');
        applyEffects(s, [{ k: 'flag', key: 'safehouse', v: 1 }], '安全屋升级');
        return { lines: ['你把封条重贴了一遍，符阵补上了缺口。', '安全屋等级 ' + s.flags.safehouse + '/5（花费 ' + cost + ' 万）'] };
      },
    });
    add({
      id: 'heal', label: '心理治疗（恢复理智与人性）', tags: ['normal'],
      if: (s) => s.money.cash >= 5,
      run: (s) => {
        if (s.money.cash < 5) return { lines: ['治疗费 5 万，你掏不出来。'] };
        addPath(s, 'money.cash', -5, '心理治疗');
        applyEffects(s, [{ k: 'stat', key: 'sanity', v: 12 }], '心理治疗');
        const h = gainHumanity(s, 5, '心理治疗');
        return { lines: ['医生听着你那些不能报警的经历，只是点了点头。',
          '理智 +12、人性 ' + (h.ok ? '+' + h.applied : '（' + h.why + '）')] };
      },
    });
    add({
      id: 'shop', label: '去黑市补给（黄金换道具）', tags: ['normal'],
      if: (s) => (s.flags.intel >= 1 || s.turn >= 3) && s.money.gold >= 3,
      run: (s) => {
        const want = 'guizhu';
        const cityPrice = (cityOf(s).rule && cityOf(s).rule.price) || 1;
      const price = Math.max(1, Math.round((1 + int(roll01(s, 'shopPrice', 0) * 2)) * tuningOf(s).priceMult * cityPrice)); // 1~3kg × 难度系数 × 本地物价
        if (s.money.gold < price) return { lines: ['黑市摊主报出 ' + price + 'kg 黄金的价，你手上的金子不够。'] };
        addPath(s, 'money.gold', -price, '黑市购入鬼烛');
        applyEffects(s, [{ k: 'itemAdd', id: want }, { k: 'stat', key: 'stealth', v: -3 }], '黑市交易');
        return { lines: ['你用 ' + price + 'kg 黄金换来了鬼烛。黑市里有人记住了你的脸。'] };
      },
    });
    add({
      id: 'mission', label: '接总部任务（有报酬，有危险）', tags: ['probe'],
      if: (s) => canAttempt(s, 'mission', chapterKey(s, 'task')),
      run: (s) => {
        const r = doCheck(s, 'mission', chapterKey(s, 'task'), 55 + s.stats.ghostEye * 3, [
          { name: '安全屋', v: s.flags.safehouse * 4 },
          { name: '劫难修正', v: s.stats.calamity >= 70 ? -5 : 0 },
        ]);
        if (r.refused) return { lines: [r.note], check: r };
        if (r.success) {
          const g1 = 1 + int(roll01(s, 'missionPay', 0) * 3);
          applyEffects(s, [
            { k: 'money', key: 'cash', v: Math.round(40 * tuningOf(s).rewardMult) },
            { k: 'money', key: 'gold', v: g1 },
            { k: 'money', key: 'contribution', v: Math.round(20 * tuningOf(s).rewardMult) },
            { k: 'stat', key: 'calamity', v: 6 },
            { k: 'stat', key: 'pollution', v: 8 },
          ], '完成总部任务');
          return { lines: ['任务收尾。总部把报酬打给你，也把「危险等级」记进了档案。'], check: r };
        }
        applyEffects(s, [{ k: 'stat', key: 'pollution', v: 12 }, { k: 'stat', key: 'stamina', v: -25 }, { k: 'stat', key: 'sanity', v: -8 }], '任务失败');
        return { lines: ['你什么都没拿到，只带回一身洗不掉的冷意。'], check: r };
      },
    });
    add({
      id: 'gamble', label: '鬼事赌局（高风险高收益）', tags: ['probe'],
      if: (s) => canAttempt(s, 'gamble', chapterKey(s, 'table')),
      run: (s) => {
        const stake = Math.min(20, s.money.cash);
        if (stake <= 0) return { lines: ['你连赌本都凑不出来。'] };
        const r = doCheck(s, 'gamble', chapterKey(s, 'table'), 40, [{ name: '运气', v: s.stats.causality < 30 ? 5 : -5 }]);
        if (r.refused) return { lines: [r.note], check: r };
        if (r.success) {
          const win = gainCash(s, 'cash', stake * 3, '鬼事赌局盈利');
          applyEffects(s, [{ k: 'stat', key: 'causality', v: 8 }, { k: 'stat', key: 'stealth', v: -5 }], '赌局');
          return { lines: ['你押对了。钱来得太快，快得像有人借给你的。',
            '盈利 +' + win.applied + ' 万' + (win.capped ? '（本章收入已达上限，' + win.capped + ' 万没能落进口袋）' : '')], check: r };
        }
        addPath(s, 'money.cash', -stake, '鬼事赌局亏损');
        applyEffects(s, [{ k: 'stat', key: 'causality', v: 10 }, { k: 'stat', key: 'sanity', v: -6 }], '赌局失利');
        return { lines: ['你输光了赌本，还欠下一点说不清的东西。'], check: r };
      },
    });
    const ca = cityAction(state);
    if (ca) add(ca);
    // 自由探索：每天 3 个"去哪里看看"（让选项不再只有那几个功能按钮）
    for (const p of placeProbeOptions(state)) add(probeAction(state, p.name));
    return pool.filter((a) => !a.if || a.if(state));
  }

  function activeGhost(state) {
    const list = eraOf(state).events;
    let current = null;
    for (const ev of list) if (state.turn >= ev.turn) current = ev;
    return current ? current.ghost : list[0].ghost;
  }

  /**
   * 本次遭遇是哪只鬼（三档）：
   *  ① 25% 落地城市的本地鬼（每座城的"看家鬼"，让城市选择真能改变遭遇内容）
   *  ② 35% 当前时期鬼池里的游荡鬼（否则时钟之外的厉鬼永远不会出现 → 内容死掉）
   *  ③ 其余走本时期世界时钟的主线鬼
   * 本地鬼按等级设门禁：S 级第 20 天前不出现、A 级第 3 天前不出现，
   * 否则选一座"本地鬼是 S 级"的城市（如名主祠的真名鬼）会在开局第一天就被打死。
   */
  function encounterGhostId(state) {
    const r = roll100(state, 'ghostPick', 0);
    const city = cityOf(state);
    // 反重复：连着两次撞同一只鬼在读感上非常明显（试玩里出现过"序列之鬼 3 天 2 次""鬼婴 7 天 3 次"）。
    // 同一分支的候选池里还有别的鬼时，按确定性偏移换一只；换不出来才允许重复。
    const avoid = state.lastGhost || null;
    const pickFrom = (pool, salt) => {
      if (!pool.length) return null;
      const i = hashStr(state.seed + ':' + state.turn + ':' + salt) % pool.length;
      if (pool.length > 1 && pool[i] === avoid) return pool[(i + 1) % pool.length];
      return pool[i];
    };
    if (r <= 25 && city.ghosts && city.ghosts.length) {
      const local = city.ghosts.filter((gid) => ghostAllowedNow(state, gid));
      const got = pickFrom(local, 'city');
      if (got) return got;
    }
    if (r <= 60) {
      const pool = ghostPoolOf(state).filter((gid) => ghostAllowedNow(state, gid));
      const got = pickFrom(pool, 'wander');
      if (got) return got;
    }
    const main = activeGhost(state);
    if (main === avoid) {
      // 主线鬼就是上一只：看看游荡池里有没有别的，没有才接受重复
      const alt = ghostPoolOf(state).filter((gid) => ghostAllowedNow(state, gid) && gid !== avoid);
      if (alt.length) return alt[hashStr(state.seed + ':' + state.turn + ':anti') % alt.length];
    }
    return main;
  }

  /* --------------------------------------------------------- 遭遇与规律 */
  function encounterChance(state) {
    const tu = tuningOf(state);
    let c = tu.encounterBase + Math.floor(state.stats.calamity / 5) + Math.floor(state.stats.pollution / 10);
    c -= state.flags.safehouse * 5;
    c += state.stats.stealth < 30 ? 10 : 0;
    c += (cityOf(state).mods && cityOf(state).mods.encounter) || 0;
    c += (eraOf(state).mods && eraOf(state).mods.encounter) || 0;
    c += state.purgeRisk || 0;      // 「处置灵异源头」当天把自己亮出来的代价
    return clamp(c, 3, tu.encounterCap);
  }

  /** 代价是否付得起：付不起的选项一律不出现（防止"0 黄金也能走黄金生路"） */
  function canPay(state, cost) {
    for (const e of cost || []) {
      if (e.k === 'itemUse') {
        if (e.id === 'ghost_power') { if (state.contracts.length === 0) return false; continue; }
        if (!state.items.some((i) => i.id === e.id)) return false;
      }
      if (e.k === 'money' && e.v < 0) {
        const have = state.money[e.key];
        if (typeof have !== 'number' || have < -e.v) return false;
      }
    }
    return true;
  }

  function buildEncounter(state, ghostId) {
    const g = CONTENT.ghosts[ghostId];
    // 见过一次就进图鉴（此后可以针对它尝试驾驭）
    const b = state.bestiary[ghostId] || (state.bestiary[ghostId] = { known: true, clues: 0, tamed: false });
    b.known = true;
    const revealed = g.clues.filter((c) => state.clues.includes(c.id));
    const known = revealed.length;
    const options = [];
    // 必死选项（确定性：命中规律即死，不含随机）
    for (const opt of g.traps) {
      options.push({ id: opt.id, label: opt.label, tags: opt.tags, kind: 'trap' });
    }
    // 中性选项
    for (const opt of g.neutral) {
      options.push({ id: opt.id, label: opt.label, tags: opt.tags, kind: 'neutral' });
    }
    // 生路选项：需要线索支撑（P12：陷阱必须可推理）+ 代价必须付得起
    for (const opt of g.exits) {
      if (known >= opt.needClues && canPay(state, opt.cost)) {
        options.push({ id: opt.id, label: opt.label, tags: opt.tags, kind: 'exit', cost: opt.cost });
      }
    }
    return {
      ghost: ghostId,
      name: g.name,
      level: g.level,
      text: g.encounter,
      revealedClues: revealed.map((c) => c.text),
      clueHints: g.clues.filter((c) => !state.clues.includes(c.id)).length,
      options: options,
      minClues: g.minClues || 2,
    };
  }

  function resolveEncounter(state, optionId) {
    const enc = state.pending;
    if (!enc) return { error: '没有待处理的遭遇' };
    const g = CONTENT.ghosts[enc.ghost];
    const opt = enc.options.find((o) => o.id === optionId);
    if (!opt) return { error: '无效选项' };

    const lines = [];
    const settlement = [];
    let dead = false;
    let deadCause = null;

    if (opt.kind === 'trap') {
      // 确定性必死判定；只有持有有效抵御手段才进入概率结算
      const shield = pickShield(state, g);
      if (!shield) {
        if (godSave(state, '命中「' + g.name + '」的规律（' + (opt.label || '') + '）')) {
          settlement.push('命中「' + g.name + '」的杀人规律 → 被你体内的鬼域挡下（剩余 ' + state.godLayers + ' 层）');
          applyEffects(state, [{ k: 'stat', key: 'pollution', v: 6 }], '鬼域挡下的余波');
          lines.push('规律合拢的那一刻，你脚下的地面换了颜色：一层鬼域铺开，把它压在原地。');
        } else {
          dead = true;
          deadCause = 'encounter-trap';
          lines.push('你做出了那个选择。空气安静了一瞬——然后规律合拢。');
          settlement.push('命中「' + g.name + '」的杀人规律 → 无有效灵异道具/能力 → 默认必死（确定性判定，不含随机数）');
        }
      } else {
        const r = doCheck(state, 'resist:' + g.id, shield.item, shield.base, [
          { name: '道具匹配', v: shield.bonus },
          { name: '劫难修正', v: state.stats.calamity >= 70 ? -5 : 0 },
        ]);
        settlement.push('抵御判定：' + r.formula + (r.success ? ' → 成功' : ' → 失败'));
        applyEffects(state, [{ k: 'itemUse', id: shield.item }], '抵御消耗');
        if (r.success) {
          applyEffects(state, [
            { k: 'stat', key: 'erosion', v: 6 },
            { k: 'stat', key: 'calamity', v: 8 },
            { k: 'stat', key: 'stamina', v: -20 },
          ], '抵御成功的代价');
          lines.push(shield.text);
        } else {
          dead = true;
          deadCause = 'encounter-resist';
          lines.push('「' + shield.name + '」没能挡住它。');
        }
      }
    } else if (opt.kind === 'exit') {
      if (!canPay(state, opt.cost)) {
        // 防御纵深：即使有人伪造 pending 塞进付不起的生路，也照样拒绝
        settlement.push('生路被拒绝：代价付不起（' + JSON.stringify(opt.cost || []) + '）');
        applyEffects(state, [{ k: 'stat', key: 'stamina', v: -10 }], '徒劳的尝试');
        return { lines: ['你伸手去拿那个本该救你的东西——它不在。'], settlement: settlement, dead: false, ghost: g };
      }
      applyEffects(state, opt.cost || [], '生路代价');
      const reward = g.rewards;
      applyEffects(state, reward, '生路奖励');
      lines.push(g.exitText);
      settlement.push('生路成立（依赖已掌握线索 ' + enc.revealedClues.length + ' 条）→ 存活，并结算代价与奖励');
      state.events.done.push('escape:' + g.id);
    } else {
      const r = doCheck(state, 'neutral:' + g.id, opt.id, 45 + state.flags.safehouse * 5, [
        { name: '低调', v: state.stats.stealth >= 70 ? 10 : 0 },
      ]);
      if (r.refused) {
        // 引擎拒绝第三次判定：按失败结算（确定性，不放大玩家收益）
        settlement.push('中性判定被拒绝：' + r.note + ' → 按失败结算');
        applyEffects(state, [{ k: 'stat', key: 'pollution', v: 12 }, { k: 'stat', key: 'stamina', v: -25 },
          { k: 'stat', key: 'erosion', v: 4 }, { k: 'stat', key: 'sanity', v: -8 }], '重复试探的代价');
        lines.push('你已经用同样的方式走过这条路两遍了。这一次，它记得你。');
      } else {
        settlement.push('中性判定：' + r.formula);
        if (r.success) {
          applyEffects(state, [{ k: 'stat', key: 'pollution', v: 5 }, { k: 'stat', key: 'sanity', v: -5 }], '擦身而过');
          lines.push('你贴着墙走过去，它没有回头看你。');
        } else {
          // 中性失败不再是"零风险"：擦身而过要留下不可逆的侵蚀。
          // 否则一直选安全项就能无损穿过所有遭遇 → 遭遇战没有威胁，"两种威胁各占一半"永远做不到。
          const ero = 3 + Math.floor(g.penalty / 15);   // 等级越高，被波及的不可逆代价越大（B 级 4、A 级 6、S 级 7）
          applyEffects(state, [{ k: 'stat', key: 'pollution', v: 12 }, { k: 'stat', key: 'stamina', v: -25 },
            { k: 'stat', key: 'erosion', v: ero }, { k: 'stat', key: 'sanity', v: -6 }], '被波及');
          lines.push('你被那股东西卷了一下，五脏六腑像被人攥了一把。');
          settlement.push('被波及：污染 +12、体力 -25、侵蚀 +' + ero + '、理智 -6（中性失败会留下不可逆侵蚀）');
        }
      }
    }

    state.pending = null;
    state.phase = 'day';
    return { lines: lines, settlement: settlement, dead: dead, deadCause: deadCause, ghost: g };
  }

  function pickShield(state, g) {
    for (const item of state.items) {
      const def = CONTENT.items[item.id];
      if (def && def.shieldFor && def.shieldFor.includes(g.level)) {
        return {
          item: item.id, name: def.name, base: def.base || 60,
          bonus: def.bonus || 0, text: def.text || '道具替你挡下了这一下。',
        };
      }
    }
    if (state.contracts.length > 0) {
      return { item: 'ghost_power', name: '契约厉鬼', base: 50, bonus: 5, text: '体内的东西替你把规律顶了回去——代价随后就来。' };
    }
    return null;
  }

  /* ------------------------------------------------------------ 公开 API */
  function availableActions(state) {
    if (state.over) return [];
    if (state.phase === 'encounter' && state.pending) {
      return state.pending.options.map((o) => ({
        id: o.id, label: o.label, kind: 'encounter', note: o.kind === 'exit' ? '（生路）' : '',
      }));
    }
    if (state.phase === 'day' && !state.actionTakenToday) {
      return actionPool(state).map((a) => ({ id: a.id, label: a.label, kind: 'day' }));
    }
    return [];
  }

  /** 结算一次玩家选择；返回可渲染的报告。引擎是唯一裁判。 */
  function resolve(state, choiceId, customText) {
    if (state.over) return { over: state.over, narrative: [], settlement: [], choices: [] };
    const narrative = [];
    const settlement = [];
    let dead = false;
    let fatalEnding = null;
    let fatalCause = null;
    let lastVariant = null;   // 供界面取"行动结果变体句"

    if (state.phase === 'encounter' && state.pending) {
      const r = resolveEncounter(state, choiceId);
      if (r.error) return { error: r.error };
      narrative.push.apply(narrative, r.lines);
      settlement.push.apply(settlement, r.settlement);
      dead = r.dead;
      fatalCause = r.deadCause || 'encounter';
    } else {
      // 硬约束：一天只能有一个主动作（读档/改存档都无法复制行动）
      if (state.actionTakenToday) {
        return { error: '今天已经行动过了（每天只能有一个主动作）', choices: availableActions(state) };
      }
      const pool = actionPool(state);
      const act = pool.find((a) => a.id === choiceId);
      if (!act) {
        // 自定义行动：只进叙事层，绝不影响判定
        const safe = String(customText || '').slice(0, 120).replace(/[<>]/g, '');
        narrative.push('【自定义行动】' + (safe || '（空）'));
        narrative.push('引擎只把这句当作叙事描述：判定仍按当前局势照常结算。');
        // 12.1 第 3 条：玩家可以点名玩法
        const named = (MECH && MECH.registry || []).find((m) => safe.includes(m.name));
        if (named) {
          state.mechRequest = named.id;
          narrative.push('（已登记点名玩法：' + named.name + '，下一回合优先触发）');
        }
        applyEffects(state, [{ k: 'stat', key: 'stamina', v: -3 }], '自定义行动消耗');
      } else {
        const r = act.run(state);
        narrative.push.apply(narrative, r.lines || []);
        if (r.check && r.check.formula) settlement.push(r.check.formula);
        if (r.fatal) { dead = true; fatalEnding = 'p_fuxi'; }
        lastVariant = String(act.id).split(':')[0];
      }
      state.actionTakenToday = true;
      // 遭遇判定
      const rc = encounterChance(state);
      const v = roll100(state, 'encounter', 0);
      if (!dead && v <= rc) {
        const gid = encounterGhostId(state);
        state.lastGhost = gid;     // 记住上一只鬼，供下一回合反重复（必须进存档，否则读档可以刷掉重复）
        state.pending = buildEncounter(state, gid);
        state.phase = 'encounter';
        settlement.push('遭遇判定：1d100=' + v + ' ≤ ' + rc + '% → 遇见「' + state.pending.name + '」（' + state.pending.level + ' 级）');
      } else if (!dead) {
        settlement.push('遭遇判定：1d100=' + v + ' > ' + rc + '% → 今天没有撞上东西');
      }
    }

    if (dead) {
      state.phase = 'over';
      const eid = fatalEnding || 'dead';
      const def = CONTENT.endings[eid] || CONTENT.endings.dead;
      state.over = { ending: eid, text: def.text, turn: state.turn, cause: fatalCause || 'other' };
      state.meta.deaths += 1;
      state.meta.bestTurn = Math.max(state.meta.bestTurn || 0, state.turn);
    } else if (!state.pending && state.phase !== 'over') {
      endTurn(state);
    }

    return {
      narrative: narrative.concat(state.notes ? state.notes.splice(0) : []),
      actionVariant: lastVariant,
      settlement: settlement.concat(state.lastMechLines || []),
      choices: availableActions(state),
      panel: panelOf(state),
      over: state.over,
      pending: state.pending,
      integrity: state.integrity.slice(-5),
    };
  }

  /* ------------------------------------------------------------- 面板数据 */
  function panelOf(state) {
    const city = cityOf(state); const era = eraOf(state);
    const out = {
      回合: state.turn + ' 天（第 ' + state.chapter + ' 章）',
      落地: city.name + (state.cityRandom ? '（随机）' : ''),
      时期: era.short + (state.eraRandom ? '（随机）' : ''),
      本地规矩: (city.rule && city.rule.text) || '无',
      劫难处置: ((state.flags.intel >= 1 || state.clues.length >= 1)
        ? '本章剩 ' + Math.max(0, PURGE_PER_CHAPTER - (state.chapterPurge || 0)) + ' 次（用「处置灵异源头」主动压）'
        : '需要 1 点情报或 1 条线索'),
      难度: tuningOf(state).name + (state.over ? '' : ''),
      鬼侵蚀: state.stats.erosion,
      人性: state.stats.humanity + ' / ' + clamp(100 - state.stats.erosion, 0, 100),
      劫难值: state.stats.calamity + '（下限 ' + state.calamityFloor + '）',
      低调值: state.stats.stealth,
      理智: state.stats.sanity,
      体力: state.stats.stamina,
      因果值: state.stats.causality,
      污染度: state.stats.pollution,
      鬼眼: state.stats.ghostEye + ' 重',
      资金: state.money.cash + ' 万 / 存 ' + state.money.deposit + ' 万 / 黄金 ' + state.money.gold + 'kg',
      贡献: state.money.contribution,
      道具: state.items.map((i) => CONTENT.items[i.id].name + '×' + i.uses).join('、') || '无',
      契约: state.contracts.map((c) => CONTENT.ghosts[c].name).join('、') || '无',
      线索: state.clues.length + ' 条',
      安全屋: state.flags.safehouse + ' 级',
      灾厄印记: state.flags.marks,
    };
    // 只在真正有鬼域时显示这一行（否则面板会出现"鬼域 undefined"）
    if (state.godLayers) out['鬼域'] = state.godLayers + ' 层（替你挡死，用尽才会死）';
    return out;
  }

  /* ------------------------------------------------------- 存档：校验和 */
  const SALT = 'rs-v31-2026';
  function checksum(obj) {
    const h = hashStr(JSON.stringify(obj) + SALT);
    return ('00000000' + h.toString(16)).slice(-8);
  }
  function serialize(state) {
    const payload = {
      v: state.v, seed: state.seed, turn: state.turn, difficulty: state.difficulty,
      pack: state.pack, custom: state.custom, tuning: state.tuning, legacy: state.legacy,
      city: state.city, era: state.era, cityRandom: state.cityRandom, eraRandom: state.eraRandom,
      lastGhost: state.lastGhost || null,
      godLayers: state.godLayers || 0,
      stats: state.stats, money: state.money, items: state.items,
      contracts: state.contracts, clues: state.clues, bestiary: state.bestiary,
      flags: state.flags, attempts: state.attempts, calamityFloor: state.calamityFloor,
      meta: state.meta, events: state.events, calamityEscapes: state.calamityEscapes,
      worldAdvance: state.worldAdvance, chapterReduction: state.chapterReduction,
      chapterPurge: state.chapterPurge || 0, purgeRisk: state.purgeRisk || 0,
      chapterSpendings: state.chapterSpendings, clueGains: state.clueGains,
      lastClueTurn: state.lastClueTurn, humanityGains: state.humanityGains,
      freezeUses: state.freezeUses, mechUsed: state.mechUsed, mechRequest: state.mechRequest,
      mechLog: state.mechLog,
      actionTakenToday: state.actionTakenToday, pending: state.pending,
      relationships: state.relationships,
      wife: state.wife, children: state.children, place: state.place,
      contentLevel: state.contentLevel, phase: state.phase, over: state.over,
    };
    return JSON.stringify({ p: payload, c: checksum(payload) });
  }
  function deserialize(str) {
    let obj;
    try { obj = JSON.parse(str); } catch (e) { return { error: '存档不是合法 JSON' }; }
    // 容错：有些调用方会多编码一层（JSON 字符串里套 JSON 字符串），这里自动解开
    if (typeof obj === 'string') {
      try { obj = JSON.parse(obj); } catch (e) { return { error: '存档不是合法 JSON' }; }
    }
    if (!obj || !obj.p || !obj.c) return { error: '存档结构不完整' };
    if (checksum(obj.p) !== obj.c) return { error: '存档校验和不匹配（文件被修改过）' };
    if (obj.p.v !== 1) return { error: '存档版本不兼容' };
    const s = createGame({
      seed: obj.p.seed, pack: obj.p.pack, difficulty: obj.p.difficulty, custom: obj.p.custom,
      // 老存档没有 city/era 字段（本功能上线前存的档）：固定回退到 2018·复苏初期 + 大昌市，
      // 不能用随机——否则读一次档就换了一座城/一个时期，进度语义全变。
      city: obj.p.city || 'dachang', era: obj.p.era || 'y2018',
    });
    if (obj.p.tuning) s.tuning = obj.p.tuning;
    s.peakGold = Math.max(s.peakGold || 0, getPath(s, 'money.gold'));
    Object.assign(s, JSON.parse(JSON.stringify(obj.p)));
    s.seedInt = hashStr(s.seed);
    s.chapter = Math.ceil(s.turn / 7);
    s.ledger = [];
    s.ledgerStart = {};
    s.integrity = [];
    s.pending = obj.p.pending || null;
    s.phase = s.over ? 'over' : (s.pending ? 'encounter' : 'day');
    for (const k of Object.keys(BOUNDS)) s.ledgerStart[k] = getPath(s, k);
    return { state: s };
  }

  return {
    CONTENT: CONTENT,
    createGame: createGame,
    availableActions: availableActions,
    resolve: resolve,
    serialize: serialize,
    deserialize: deserialize,
    checksum: checksum,        // 供测试构造合法校验和的"老存档"（缺 city/era）
    parseIntent: parseIntent,  // 自由行动：把玩家写的话映射成真实行动
    parseEncounterIntent: parseEncounterIntent,  // 遭遇中的自由输入 → 映射到现有选项
    panelOf: panelOf,
    masteryCheck: masteryCheck,
    miracleCheck: miracleCheck,
    reduceCalamity: reduceCalamity,
    setPath: setPath,
    addPath: addPath,
    applyEffects: applyEffects,
    roll100: roll100,
    worldAdvanceAmount: worldAdvanceAmount,
    recentMechanics: recentMechanics,
    pickMechanics: pickMechanics,
    applyMechanic: applyMechanic,
    actionPool: actionPool,
    buildEncounter: buildEncounter,
    BOUNDS: BOUNDS,
    CHAPTER_REDUCTION_CAP: CHAPTER_REDUCTION_CAP,
    CHAPTER_HUMANITY_CAP: CHAPTER_HUMANITY_CAP,
    CLUE_COOLDOWN: CLUE_COOLDOWN,
    ATTEMPT_CAPS: ATTEMPT_CAPS,
    _internal: { hashStr: hashStr, clamp: clamp, checksum: checksum, doCheck: doCheck, attemptState: attemptState },
  };
});
</script>
<script>/* ============================================================================
 * 神秘复苏模拟器 · 玩家档案（跨局持久化）
 * ----------------------------------------------------------------------------
 * 存什么：成就 / 结局收集 / 全局统计 / 周目点数 / AI 叙事配置。
 * 防作弊：
 *   1. 档案本身带校验和，手改任意字段 → 载入失败并回到空档案（不会静默生效）。

    ],
    encounterAct: [
      '它没有立刻靠近，而是先"对齐"了周围的东西：门缝、墙角、你的影子，全部被它摆成同一个方向。',
      '它的动作很慢，但不是僵硬，是那种"早就知道你会往哪边让"的慢。',
      '你能看见的东西里，只有它是没有边缘的——像被水洇过的墨，边界在不断往外渗。',
      '它中途停了一下，像是在确认什么。那一瞬间你几乎以为它要走，然后它继续朝你这边来。',
